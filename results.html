<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWCC Past Results</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    background: #0a1628; color: #ecf0f1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px; min-height: 100vh;
}

#root { max-width: 640px; margin: 0 auto; padding: 14px 14px 40px; }

/* ── Header ── */
.page-hdr {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0 16px;
    border-bottom: 1px solid #1e3a5a;
    margin-bottom: 16px;
}
.back-btn {
    background: rgba(255,255,255,0.08); border: 1px solid #2a4a6a;
    color: #ecf0f1; border-radius: 8px; padding: 6px 14px;
    font-size: 0.9em; cursor: pointer; flex-shrink: 0;
    text-decoration: none; display: inline-block;
}
.back-btn:hover { background: rgba(255,255,255,0.14); }
.page-title { font-size: 1.25em; font-weight: 700; letter-spacing: 0.5px; }
.page-sub   { font-size: 0.78em; color: #7f8c8d; margin-top: 2px; }

/* ── Competition list ── */
.comp-card {
    background: rgba(255,255,255,0.05); border: 1px solid #1e3a5a;
    border-radius: 12px; margin-bottom: 10px;
    cursor: pointer; transition: background 0.15s;
    overflow: hidden;
}
.comp-card:hover { background: rgba(255,255,255,0.09); }
.comp-card:active { background: rgba(255,255,255,0.13); }
.comp-main { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
.comp-left { min-width: 0; }
.comp-date  { font-size: 0.75em; color: #7f8c8d; margin-bottom: 3px; }
.comp-name  { font-size: 1.05em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.comp-meta  { font-size: 0.78em; color: #4a6a84; margin-top: 3px; }
.comp-right { text-align: right; flex-shrink: 0; padding-left: 10px; }
.comp-leader-pts { font-size: 1.5em; font-weight: 700; color: #f1c40f; }
.comp-leader-name { font-size: 0.72em; color: #bdc3c7; margin-top: 1px; }
.comp-arrow { color: #4a6a84; margin-left: 8px; font-size: 1.1em; }

/* ── Detail view ── */
#detail { display: none; }
.detail-hdr { margin-bottom: 16px; }
.detail-comp { font-size: 1.15em; font-weight: 700; }
.detail-info { font-size: 0.8em; color: #7f8c8d; margin-top: 4px; }

/* ── Grade strip ── */
.grade-section { margin-bottom: 16px; }
.grade-title { font-size: 0.72em; color: #4a6a84; text-transform: uppercase; letter-spacing: 1px; padding: 6px 0 8px; }
.grade-blocks { display: flex; gap: 8px; }
.grade-block {
    flex: 1; background: rgba(255,255,255,0.05); border: 1px solid #1e3a5a;
    border-radius: 10px; padding: 10px 10px;
}
.grade-label { font-size: 0.68em; color: #4a6a84; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.grade-winner { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
.grade-medal  { font-size: 1em; flex-shrink: 0; }
.grade-wname  { font-size: 0.82em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.grade-wpts   { font-size: 0.78em; color: #f1c40f; flex-shrink: 0; }

/* ── Standings table ── */
.standings-title { font-size: 0.72em; color: #4a6a84; text-transform: uppercase; letter-spacing: 1px; padding: 6px 0 8px; }
.standings-hdr {
    display: grid; grid-template-columns: 2.5em 1fr 3.5em 3em;
    font-size: 0.68em; color: #4a6a84; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 4px 12px; border-bottom: 1px solid #1e3a5a;
}
.standings-hdr span:nth-child(3), .standings-hdr span:nth-child(4) { text-align: right; }
.s-row {
    display: grid; grid-template-columns: 2.5em 1fr 3.5em 3em;
    padding: 7px 12px; border-bottom: 1px solid rgba(30,58,90,0.5);
    align-items: center; font-size: 0.9em;
}
.s-row:last-child { border-bottom: none; }
.s-row.top3 { background: rgba(241,196,15,0.06); }
.s-rank { font-size: 1.05em; }
.s-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.s-hcp  { font-size: 0.72em; color: #4a6a84; font-weight: normal; }
.s-pts  { text-align: right; font-weight: 600; }
.s-fin  { text-align: right; font-size: 0.8em; color: #27ae60; }
.s-nf   { text-align: right; font-size: 0.8em; color: #7f8c8d; }
.grade-badge {
    display: inline-block; font-size: 0.6em; padding: 1px 4px;
    border-radius: 4px; margin-left: 4px; vertical-align: middle;
    font-weight: 700; letter-spacing: 0.5px;
}
.gb-a { background: #1a5276; color: #aed6f1; }
.gb-b { background: #1e8449; color: #a9dfbf; }
.gb-c { background: #7d6608; color: #f9e79f; }

/* ── Empty / loading ── */
.loading { text-align: center; padding: 40px 20px; color: #4a6a84; font-size: 0.9em; }
.no-results { text-align: center; padding: 40px 20px; }
.no-results-icon { font-size: 2.5em; margin-bottom: 8px; }
.no-results-title { font-size: 1.1em; font-weight: 600; margin-bottom: 6px; }
.no-results-sub { font-size: 0.82em; color: #7f8c8d; }
</style>
</head>
<body>
<div id="root">

  <!-- List view -->
  <div id="list-view">
    <div class="page-hdr">
      <div>
        <div class="page-title">⛳ Past Results</div>
        <div class="page-sub">Wagga Wagga Country Club</div>
      </div>
      <a href="leaderboard.html" class="back-btn" style="margin-left:auto">Live ›</a>
    </div>
    <div id="comp-list"><div class="loading">Loading results...</div></div>
  </div>

  <!-- Detail view -->
  <div id="detail">
    <div class="page-hdr">
      <button class="back-btn" onclick="showList()">‹ Back</button>
      <div>
        <div class="detail-comp" id="det-comp"></div>
        <div class="detail-info" id="det-info"></div>
      </div>
    </div>
    <div id="det-grades" class="grade-section"></div>
    <div class="standings-title">Final Standings</div>
    <div class="standings-hdr"><span>Rank</span><span>Player</span><span style="text-align:right">Pts</span><span style="text-align:right">Thru</span></div>
    <div id="det-standings"></div>
  </div>

</div>
<script>
const INDEX_URL = './out/history/index.json';

const medals = ['🥇','🥈','🥉'];

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtHcp(hcp) {
    if (hcp == null) return '';
    return hcp % 1 === 0 ? hcp.toString() : hcp.toFixed(1);
}

// ── Countback (GA method: back9 -> back6 -> back3 -> hole by hole) ──
// Uses holePoints array (compact per-hole pts saved in archive from today forward).
// Falls back gracefully to no tiebreak if holePoints absent (older archives).
function countbackCompare(a, b, holeCount) {
    const aFin = a.thru >= holeCount;
    const bFin = b.thru >= holeCount;
    if (!aFin && !bFin) return 0;
    if (!aFin) return 1;
    if (!bFin) return -1;
    const ah = a.holePoints || [];
    const bh = b.holePoints || [];
    if (!ah.length && !bh.length) return 0;
    const sliceSum = (arr, n) => arr.slice(-n).reduce((s, v) => s + (v || 0), 0);
    for (const n of [9, 6, 3]) {
        const d = sliceSum(bh, n) - sliceSum(ah, n);
        if (d !== 0) return d;
    }
    for (let i = Math.max(ah.length, bh.length) - 1; i >= 0; i--) {
        const d = (bh[i] || 0) - (ah[i] || 0);
        if (d !== 0) return d;
    }
    return 0;
}

// ── Grade computation (mirrors leaderboard.html) ──────────────────
function computeGrades(players) {
    const withHcp = players.filter(p => p.hcp != null).sort((a, b) => a.hcp - b.hcp);
    const n = withHcp.length;
    if (n < 3) return null;
    const aEnd = Math.floor(n / 3);
    const bEnd = Math.floor(n * 2 / 3);
    function boundaryHcp(idx) {
        const hcp = withHcp[idx].hcp;
        if (idx + 1 < n && withHcp[idx + 1].hcp === hcp) {
            let i = idx - 1;
            while (i >= 0 && withHcp[i].hcp === hcp) i--;
            return i >= 0 ? withHcp[i].hcp : hcp - 1;
        }
        return hcp;
    }
    return { aMax: boundaryHcp(aEnd - 1), bMax: boundaryHcp(bEnd - 1) };
}

function playerGrade(hcp, grades) {
    if (!grades || hcp == null) return null;
    if (hcp <= grades.aMax) return 'A';
    if (hcp <= grades.bMax) return 'B';
    return 'C';
}

// ── List view ─────────────────────────────────────────────────────
async function loadIndex() {
    const el = document.getElementById('comp-list');
    try {
        const r = await fetch(INDEX_URL + '?_=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const index = await r.json();
        if (!index.length) {
            el.innerHTML = '<div class="no-results"><div class="no-results-icon">📋</div><div class="no-results-title">No past results yet</div><div class="no-results-sub">Results are archived automatically after each competition day.</div></div>';
            return;
        }
        el.innerHTML = index.map((c, i) => `
            <div class="comp-card" onclick="loadDetail(${i})">
              <div class="comp-main">
                <div class="comp-left">
                  <div class="comp-date">${esc(fmtDate(c.date))}</div>
                  <div class="comp-name">${esc(c.competition)}</div>
                  <div class="comp-meta">${c.playerCount} players &bull; ${c.courseHoles || c.holeCount} holes</div>
                </div>
                <div class="comp-right">
                  <div class="comp-leader-pts">${c.leaderPts}pts</div>
                  <div class="comp-leader-name">${esc(c.leader)}</div>
                </div>
                <div class="comp-arrow">›</div>
              </div>
            </div>`).join('');
        window._index = index;
    } catch (e) {
        el.innerHTML = '<div class="no-results"><div class="no-results-icon">⚠️</div><div class="no-results-title">Could not load results</div><div class="no-results-sub">' + esc(e.message) + '</div></div>';
    }
}

// ── Detail view ───────────────────────────────────────────────────
async function loadDetail(idx) {
    const entry = window._index[idx];
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('detail').style.display = 'block';
    document.getElementById('det-comp').textContent = entry.competition;
    document.getElementById('det-info').textContent = fmtDate(entry.date) + ' - ' + entry.playerCount + ' players';
    document.getElementById('det-grades').innerHTML = '<div class="loading">Loading...</div>';
    document.getElementById('det-standings').innerHTML = '';

    try {
        const r = await fetch('./' + entry.file + '?_=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        renderDetail(data);
    } catch (e) {
        document.getElementById('det-grades').innerHTML = '<div class="no-results"><div class="no-results-icon">⚠️</div><div class="no-results-title">Could not load result</div><div class="no-results-sub">' + esc(e.message) + '</div></div>';
    }
}

function renderDetail(data) {
    const players  = data.players || [];
    const holeCount = data.holeCount || 18;
    const grades   = computeGrades(players);

    // ── Grade winners ──
    const gradeEl = document.getElementById('det-grades');
    if (grades) {
        const byGrade = { A: [], B: [], C: [] };
        players.forEach(p => {
            const g = playerGrade(p.hcp, grades);
            if (g) byGrade[g].push(p);
        });
        ['A','B','C'].forEach(g => byGrade[g].sort((a, b) => {
            if (b.points !== a.points) return b.points - a.points;
            const cb = countbackCompare(a, b, holeCount);
            return cb !== 0 ? cb : a.player.localeCompare(b.player);
        }));

        const blockHtml = g => {
            const all = byGrade[g];
            const top = all.slice(0, 3);
            if (!top.length) return '<div class="grade-label">' + g + ' Grade</div><div style="color:#4a6a84;font-size:0.8em">-</div>';
            return '<div class="grade-label">' + g + ' Grade</div>' +
                top.map((p, i) => {
                    const nextPts = (all[i + 1] || {}).points;
                    const usedCB = (p.points === nextPts || (i > 0 && p.points === top[i - 1].points))
                        && p.thru >= holeCount && (p.holePoints || []).length > 0;
                    const cbMark = usedCB ? '<sup style="font-size:0.55em;color:#f39c12;vertical-align:super">CB</sup>' : '';
                    return '<div class="grade-winner"><span class="grade-medal">' + medals[i] + cbMark + '</span>' +
                        '<span class="grade-wname">' + esc(p.player.trim()) + '</span>' +
                        '<span class="grade-wpts">' + p.points + 'pts</span></div>';
                }).join('');
        };

        gradeEl.innerHTML = '<div class="grade-title">Grade Winners</div>' +
            '<div class="grade-blocks">' +
            ['A','B','C'].map(g => '<div class="grade-block">' + blockHtml(g) + '</div>').join('') +
            '</div>';
    } else {
        gradeEl.innerHTML = '';
    }

    // ── Standings ──
    const sorted = [...players].sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        const cb = countbackCompare(a, b, holeCount);
        return cb !== 0 ? cb : a.player.localeCompare(b.player);
    });
    // Flag every position where countback broke a tie
    const cbFlags = sorted.map((p, i) => {
        if (p.thru < holeCount || !(p.holePoints || []).length) return false;
        const prev = sorted[i - 1];
        const next = sorted[i + 1];
        return (prev && prev.points === p.points && prev.thru >= holeCount) ||
               (next && next.points === p.points && next.thru >= holeCount);
    });
    const standEl = document.getElementById('det-standings');
    standEl.innerHTML = sorted.map((p, i) => {
        const rank = i + 1;
        const cbMark = cbFlags[i] ? '<sup style="font-size:0.5em;color:#f39c12;vertical-align:super;font-weight:normal">CB</sup>' : '';
        let rankHtml;
        if      (rank === 1) rankHtml = '🥇' + cbMark;
        else if (rank === 2) rankHtml = '🥈' + cbMark;
        else if (rank === 3) rankHtml = '🥉' + cbMark;
        else                 rankHtml = rank + cbMark;
        const g = playerGrade(p.hcp, grades);
        const badge = g ? '<span class="grade-badge gb-' + g.toLowerCase() + '">' + g + '</span>' : '';
        const hcpTag = p.hcp != null ? '<span class="s-hcp"> [' + fmtHcp(p.hcp) + ']</span>' : '';
        const fin = p.thru >= holeCount;
        const thruTxt = fin ? 'F' : p.thru || '-';
        const thruCls = fin ? 's-fin' : 's-nf';
        return '<div class="s-row' + (rank <= 3 ? ' top3' : '') + '">' +
            '<span class="s-rank">' + rankHtml + '</span>' +
            '<span class="s-name">' + esc(p.player.trim()) + hcpTag + badge + '</span>' +
            '<span class="s-pts">' + p.points + '</span>' +
            '<span class="' + thruCls + '">' + thruTxt + '</span>' +
            '</div>';
    }).join('');
}

function showList() {
    document.getElementById('detail').style.display = 'none';
    document.getElementById('list-view').style.display = 'block';
}

loadIndex();
</script>
</body>
</html>
