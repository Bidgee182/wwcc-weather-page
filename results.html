<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWCC Past Results</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    background: #0a1628; color: #ecf0f1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px; min-height: 100vh;
}

#root { max-width: 640px; margin: 0 auto; padding: 14px 14px 40px; }

/* ── Header ── */
.page-hdr {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0 16px;
    border-bottom: 1px solid #1e3a5a;
    margin-bottom: 16px;
}
.back-btn {
    background: rgba(255,255,255,0.08); border: 1px solid #2a4a6a;
    color: #ecf0f1; border-radius: 8px; padding: 6px 14px;
    font-size: 0.9em; cursor: pointer; flex-shrink: 0;
    text-decoration: none; display: inline-block;
}
.back-btn:hover { background: rgba(255,255,255,0.14); }
.page-title { font-size: 1.25em; font-weight: 700; letter-spacing: 0.5px; }
.page-sub   { font-size: 0.78em; color: #7f8c8d; margin-top: 2px; }

/* ── Competition list ── */
.comp-card {
    background: rgba(255,255,255,0.05); border: 1px solid #1e3a5a;
    border-left: 3px solid #2a4a6a;
    border-radius: 12px; margin-bottom: 10px;
    cursor: pointer; transition: background 0.15s;
    overflow: hidden;
}
.comp-card:hover { background: rgba(255,255,255,0.09); }
.comp-card:active { background: rgba(255,255,255,0.13); }
.card-stableford { border-left-color: #27ae60; }
.card-stroke     { border-left-color: #3498db; }
.card-team       { border-left-color: #9b59b6; }

.comp-main { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 12px 16px; }
.comp-left { min-width: 0; flex: 1; }
.comp-date  { font-size: 0.72em; color: #7f8c8d; margin-bottom: 4px; }
.comp-name  { font-size: 1.05em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.comp-meta  { font-size: 0.75em; color: #4a6a84; margin-top: 3px; }

.comp-right { text-align: right; flex-shrink: 0; padding-left: 12px; width: 110px; min-width: 110px; }
.type-pill  { display: inline-block; font-size: 0.6em; font-weight: 700; padding: 2px 7px; border-radius: 10px;
              text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
.pill-stableford { background: rgba(39,174,96,0.2);  color: #2ecc71; }
.pill-stroke     { background: rgba(52,152,219,0.2);  color: #5dade2; }
.pill-team       { background: rgba(155,89,182,0.2);  color: #bb8fce; }
.pill-other      { background: rgba(127,140,141,0.2); color: #aab7b8; }
.comp-leader-pts  { font-size: 1.45em; font-weight: 700; color: #f1c40f; line-height: 1.1; }
.comp-leader-name { font-size: 0.7em; color: #bdc3c7; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.comp-arrow { color: #4a6a84; margin-left: 8px; font-size: 1.1em; flex-shrink: 0; }

/* ── Enriched card footer (grade winners + ball count) ── */
.comp-enrich { padding: 0 16px 10px; }
.enrich-row  { display: flex; align-items: center; flex-wrap: wrap; gap: 0 10px;
               padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.06); }
.enrich-grade-row  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; min-width: 0; }
.enrich-grade-item { display: flex; align-items: center; gap: 0; font-size: 0.71em; color: #bdc3c7; white-space: nowrap; }
.enrich-grade-pill { font-size: 0.8em; font-weight: 700; padding: 1px 5px; border-radius: 5px; margin-right: 4px; flex-shrink: 0; }
.gp-a { background: rgba(241,196,15,0.22);  color: #f1c40f; }
.gp-b { background: rgba(52,152,219,0.22);  color: #5dade2; }
.gp-c { background: rgba(39,174,96,0.22);   color: #2ecc71; }
.enrich-grade-score { color: #f1c40f; font-weight: 600; margin-left: 4px; }
.enrich-balls { font-size: 0.71em; color: #aab7b8; flex-shrink: 0; margin-left: auto; white-space: nowrap; }

/* ── Detail view ── */
#detail { display: none; }
.detail-hdr { margin-bottom: 16px; }
.detail-comp { font-size: 1.15em; font-weight: 700; }
.detail-info { font-size: 0.8em; color: #7f8c8d; margin-top: 4px; }

/* ── Grade strip ── */
.grade-section { margin-bottom: 16px; }
.grade-title { font-size: 0.72em; color: #4a6a84; text-transform: uppercase; letter-spacing: 1px; padding: 6px 0 8px; }
.grade-blocks { display: flex; gap: 8px; }
.grade-block {
    flex: 1; background: rgba(255,255,255,0.05); border: 1px solid #1e3a5a;
    border-radius: 10px; padding: 10px 10px;
}
.grade-label { font-size: 0.68em; color: #4a6a84; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.grade-winner { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
.grade-medal  { font-size: 1em; flex-shrink: 0; }
.grade-wname  { font-size: 0.82em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.grade-wpts   { font-size: 0.78em; color: #f1c40f; flex-shrink: 0; }

/* ── Standings table ── */
.standings-title { font-size: 0.72em; color: #4a6a84; text-transform: uppercase; letter-spacing: 1px; padding: 6px 0 8px; }
.standings-hdr {
    display: grid; grid-template-columns: 2.5em 1fr 3.5em 3em;
    font-size: 0.68em; color: #4a6a84; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 4px 12px; border-bottom: 1px solid #1e3a5a;
}
.standings-hdr span:nth-child(3), .standings-hdr span:nth-child(4) { text-align: right; }
.s-row {
    display: grid; grid-template-columns: 2.5em 1fr 3.5em 3em;
    padding: 7px 12px; align-items: center; font-size: 0.9em;
}
.s-row.top3 { background: rgba(241,196,15,0.06); }
.s-player-wrap { border-bottom: 1px solid rgba(30,58,90,0.5); }
.s-player-wrap:last-child { border-bottom: none; }
.s-player-wrap .s-row { cursor: pointer; transition: background 0.15s; }
.s-player-wrap .s-row.no-card { cursor: default; }
.s-player-wrap .s-row:not(.no-card):hover { background: rgba(255,255,255,0.05); }
.sc-chevron { font-size: 0.58em; color: #4a6a84; margin-left: 5px; display: inline-block; transition: transform 0.2s; vertical-align: middle; }
.sc-chevron.open { transform: rotate(90deg); }
.sc-outer { display: none; border-top: 1px solid #1a3a5a; }
.sc-wrap { overflow-x: auto; padding: 6px 4px 4px; }
.sc-table { border-collapse: collapse; font-size: 0.76em; font-variant-numeric: tabular-nums; }
.sc-table td { padding: 3px 6px; text-align: center; white-space: nowrap; color: #ecf0f1; }
.sc-hdr td { background: #082418; color: #fff; font-weight: 700; padding: 5px 6px; }
.sc-par td { color: #7f8c8d; }
.sc-row-label td:first-child { text-align: left; color: #4a6a84; font-size: 0.85em; min-width: 3.2em; }
.sc-pts-row td { color: #bdc3c7; }
.sc-nett-row td { color: #637074; }
.sc-total { font-weight: 700 !important; color: #f1c40f !important; }
.score-pill {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 6px; font-weight: 700;
    font-size: 0.92em; border: 1px solid rgba(0,0,0,0.18);
}
.sc-legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 6px 10px; }
.sc-leg-item { display: flex; align-items: center; gap: 4px; font-size: 0.66em; color: #7f8c8d; }
.sc-leg-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.12); }
.s-rank { font-size: 1.05em; }
.s-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.s-hcp  { font-size: 0.72em; color: #4a6a84; font-weight: normal; }
.s-pts  { text-align: right; font-weight: 600; }
.s-fin  { text-align: right; font-size: 0.8em; color: #27ae60; }
.s-nf   { text-align: right; font-size: 0.8em; color: #7f8c8d; }
.grade-badge {
    display: inline-block; font-size: 0.6em; padding: 1px 4px;
    border-radius: 4px; margin-left: 4px; vertical-align: middle;
    font-weight: 700; letter-spacing: 0.5px;
}
.gb-a { background: #1a5276; color: #aed6f1; }
.gb-b { background: #1e8449; color: #a9dfbf; }
.gb-c { background: #7d6608; color: #f9e79f; }

/* ── Empty / loading ── */
.loading { text-align: center; padding: 40px 20px; color: #4a6a84; font-size: 0.9em; }
.no-results { text-align: center; padding: 40px 20px; }
.no-results-icon { font-size: 2.5em; margin-bottom: 8px; }
.no-results-title { font-size: 1.1em; font-weight: 600; margin-bottom: 6px; }
.no-results-sub { font-size: 0.82em; color: #7f8c8d; }
</style>
</head>
<body>
<div id="root">

  <!-- List view -->
  <div id="list-view">
    <div class="page-hdr">
      <div>
        <div class="page-title">⛳ Past Results</div>
        <div class="page-sub">Wagga Wagga Country Club</div>
      </div>
      <a href="leaderboard.html" class="back-btn" style="margin-left:auto">Live ›</a>
    </div>
    <div id="comp-list"><div class="loading">Loading results...</div></div>
  </div>

  <!-- Detail view -->
  <div id="detail">
    <div class="page-hdr">
      <button class="back-btn" onclick="showList()">‹ Back</button>
      <div>
        <div class="detail-comp" id="det-comp"></div>
        <div class="detail-info" id="det-info"></div>
      </div>
    </div>
    <div id="det-grades" class="grade-section"></div>
    <div class="standings-title">Final Standings</div>
    <div class="standings-hdr"><span>Rank</span><span>Player</span><span id="pts-col-hdr" style="text-align:right">Pts</span><span style="text-align:right">Thru</span></div>
    <div id="det-standings"></div>
  </div>

</div>
<script>
const INDEX_URL = './out/history/index.json';

const medals = ['🥇','🥈','🥉'];

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtHcp(hcp) {
    if (hcp == null) return '';
    return hcp % 1 === 0 ? hcp.toString() : hcp.toFixed(1);
}

// ── Countback (GA method: back9 -> back6 -> back3 -> hole by hole) ──
// Uses holePoints array (compact per-hole pts saved in archive from today forward).
// Falls back gracefully to no tiebreak if holePoints absent (older archives).
function countbackCompare(a, b, holeCount, isStroke) {
    const aFin = a.thru >= holeCount;
    const bFin = b.thru >= holeCount;
    if (!aFin && !bFin) return 0;
    if (!aFin) return 1;
    if (!bFin) return -1;
    const ah = a.holePoints || [];
    const bh = b.holePoints || [];
    if (!ah.length && !bh.length) return 0;
    const sliceSum = (arr, n) => arr.slice(-n).reduce((s, v) => s + (v || 0), 0);
    for (const n of [9, 6, 3]) {
        // Stroke: lower score over back holes wins; Stableford: higher pts over back holes wins
        const d = isStroke ? sliceSum(ah, n) - sliceSum(bh, n) : sliceSum(bh, n) - sliceSum(ah, n);
        if (d !== 0) return d;
    }
    for (let i = Math.max(ah.length, bh.length) - 1; i >= 0; i--) {
        const d = isStroke ? (ah[i] || 0) - (bh[i] || 0) : (bh[i] || 0) - (ah[i] || 0);
        if (d !== 0) return d;
    }
    return 0;
}

// ── WWCC Course (par 71, hole 20 = temp cover for hole 18) ────────
const WWCC_HOLES = [
    {hole:1,  par:4, mensSI:5,  womensSI:1},
    {hole:2,  par:3, mensSI:17, womensSI:16},
    {hole:3,  par:5, mensSI:9,  womensSI:6},
    {hole:4,  par:4, mensSI:11, womensSI:5},
    {hole:5,  par:4, mensSI:1,  womensSI:13},
    {hole:6,  par:5, mensSI:15, womensSI:14},
    {hole:7,  par:3, mensSI:13, womensSI:18},
    {hole:8,  par:4, mensSI:3,  womensSI:8},
    {hole:9,  par:4, mensSI:7,  womensSI:3},
    {hole:10, par:3, mensSI:4,  womensSI:15},
    {hole:11, par:4, mensSI:12, womensSI:7},
    {hole:12, par:5, mensSI:16, womensSI:11},
    {hole:13, par:4, mensSI:10, womensSI:10},
    {hole:14, par:3, mensSI:14, womensSI:17},
    {hole:15, par:5, mensSI:6,  womensSI:2},
    {hole:16, par:5, mensSI:18, womensSI:4},
    {hole:17, par:3, mensSI:2,  womensSI:9},
    {hole:18, par:3, mensSI:8,  womensSI:12},
];

function detectGender(comp) {
    const c = (comp || '').toLowerCase();
    return (c.includes('women') || c.includes('ladies')) ? 'women' : 'men';
}

function scoreColour(gross, par) {
    if (gross == null || par == null) return null;
    const d = gross - par;
    if (d <= -2) return {bg:'#f5c518', tx:'#3d2f00'};
    if (d === -1) return {bg:'#7dd3fc', tx:'#0b3a52'};
    if (d ===  0) return {bg:'#ffffff', tx:'#1c2620'};
    if (d ===  1) return {bg:'#f59e42', tx:'#3a1d00'};
    return            {bg:'#f2a89c', tx:'#5a1810'};
}

// Colour by stableford points result (used for score pills in scorecard)
function ptColour(pts) {
    if (pts == null || pts === 0) return {bg:'#e74c3c', tx:'#ffffff'}; // wipe/pickup
    if (pts >= 4)  return {bg:'#f5c518', tx:'#3d2f00'}; // eagle+
    if (pts === 3) return {bg:'#7dd3fc', tx:'#0b3a52'}; // birdie
    if (pts === 2) return {bg:'#ffffff', tx:'#1c2620'}; // par
    return             {bg:'#f59e42', tx:'#3a1d00'};    // 1pt = bogey
}

// Detect which nine from par pattern (back nine = 3,4,5,4,3,5,5,3,3)
function detectNine(pars) {
    const BACK = [3,4,5,4,3,5,5,3,3];
    return (pars || []).length === 9 && pars.every((p,i) => p === BACK[i]) ? 'back' : 'front';
}

// Strokes received on a hole. For 9-hole: re-rank SI within the nine played.
function strokesReceived(hcp, courseIdx, gender, isNine, nineIdxs) {
    if (hcp == null) return 0;
    const ch = WWCC_HOLES[courseIdx];
    if (!ch) return 0;
    const si = gender === 'women' ? ch.womensSI : ch.mensSI;
    if (!isNine) {
        const base = Math.floor(hcp / 18), extra = hcp % 18;
        return base + (si <= extra ? 1 : 0);
    }
    const nineSIs = (nineIdxs || []).map(ci => {
        const h = WWCC_HOLES[ci]; return h ? (gender === 'women' ? h.womensSI : h.mensSI) : 99;
    });
    const rank = [...nineSIs].sort((a,b) => a - b).indexOf(si) + 1;
    const base = Math.floor(hcp / 9), extra = hcp % 9;
    return base + (rank <= extra ? 1 : 0);
}

// ── Grade computation (mirrors leaderboard.html) ──────────────────
function computeGrades(players) {
    const withHcp = players.filter(p => p.hcp != null).sort((a, b) => a.hcp - b.hcp);
    const n = withHcp.length;
    if (n < 3) return null;
    const aEnd = Math.floor(n / 3);
    const bEnd = Math.floor(n * 2 / 3);
    function boundaryHcp(idx) {
        const hcp = withHcp[idx].hcp;
        if (idx + 1 < n && withHcp[idx + 1].hcp === hcp) {
            let i = idx - 1;
            while (i >= 0 && withHcp[i].hcp === hcp) i--;
            return i >= 0 ? withHcp[i].hcp : hcp - 1;
        }
        return hcp;
    }
    return { aMax: boundaryHcp(aEnd - 1), bMax: boundaryHcp(bEnd - 1) };
}

function playerGrade(hcp, grades) {
    if (!grades || hcp == null) return null;
    if (hcp <= grades.aMax) return 'A';
    if (hcp <= grades.bMax) return 'B';
    return 'C';
}

// ── List view helpers ─────────────────────────────────────────────
function fmtListScore(pts, type) {
    if (type === 'Stroke') return (pts > 0 ? '+' : '') + pts;
    return pts + 'pts';
}

function cardTypeClass(type) {
    if (!type) return 'other';
    const t = type.toLowerCase();
    if (t.includes('stroke')) return 'stroke';
    if (t.includes('4bbb') || t.includes('ambrose')) return 'team';
    return 'stableford';
}

function shortName(full) {
    const parts = (full || '').trim().split(/\s+/);
    if (parts.length <= 1) return parts[0] || '';
    return parts[0][0] + '. ' + parts.slice(1).join(' ');
}

function buildCard(c, i) {
    const tc = cardTypeClass(c.type);
    const pillLabel = c.type || 'Golf';
    return `<div class="comp-card card-${tc}" id="card-${i}" onclick="loadDetail(${i})">
      <div class="comp-main">
        <div class="comp-left">
          <div class="comp-date">${esc(fmtDate(c.date))}</div>
          <div class="comp-name">${esc(c.competition)}</div>
          <div class="comp-meta">${c.playerCount} players &bull; ${c.courseHoles || c.holeCount} holes</div>
        </div>
        <div class="comp-right">
          <div class="type-pill pill-${tc}">${esc(pillLabel)}</div>
          <div class="comp-leader-pts">${esc(fmtListScore(c.leaderPts, c.type))}</div>
          <div class="comp-leader-name">${esc(c.leader)}</div>
        </div>
        <div class="comp-arrow">›</div>
      </div>
      <div class="comp-enrich" id="enrich-${i}"></div>
    </div>`;
}

function buildEnrich(data, indexEntry) {
    const isStroke  = data.isStableford === false;
    const isTeam    = /4bbb|ambrose/i.test(indexEntry.competition || '') || /4bbb|ambrose/i.test(indexEntry.type || '');
    const balls     = (data.ballWinners || []).length;

    let gradeHtml = '';
    if (!isTeam) {
        const players = data.players || [];
        const grades  = computeGrades(players);
        if (grades) {
            const byGrade = { A: [], B: [], C: [] };
            players.forEach(p => { const g = playerGrade(p.hcp, grades); if (g) byGrade[g].push(p); });
            ['A','B','C'].forEach(g => byGrade[g].sort((a, b) => isStroke ? a.points - b.points : b.points - a.points));
            const items = ['A','B','C'].map(g => {
                const w = byGrade[g][0];
                if (!w) return '';
                const score = fmtListScore(w.points, isStroke ? 'Stroke' : 'Stableford');
                return `<span class="enrich-grade-item"><span class="enrich-grade-pill gp-${g.toLowerCase()}">${g}</span>${esc(shortName(w.player))}<span class="enrich-grade-score">${esc(score)}</span></span>`;
            }).filter(Boolean);
            if (items.length) gradeHtml = `<span class="enrich-grade-row">${items.join('')}</span>`;
        }
    }

    const ballHtml = balls > 0 && !isTeam
        ? `<span class="enrich-balls">&#9898; ${balls} ball${balls !== 1 ? 's' : ''}</span>` : '';

    if (!gradeHtml && !ballHtml) return '';
    return `<div class="enrich-row">${gradeHtml}${ballHtml}</div>`;
}

// ── List view ─────────────────────────────────────────────────────
async function loadIndex() {
    const el = document.getElementById('comp-list');
    try {
        const r = await fetch(INDEX_URL + '?_=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const index = await r.json();
        if (!index.length) {
            el.innerHTML = '<div class="no-results"><div class="no-results-icon">📋</div><div class="no-results-title">No past results yet</div><div class="no-results-sub">Results are archived automatically after each competition day.</div></div>';
            return;
        }
        el.innerHTML = index.map((c, i) => buildCard(c, i)).join('');
        window._index = index;

        // Enrich each card with grade winners + ball count (parallel fetches)
        index.forEach((c, i) => {
            fetch('./' + c.file + '?_=' + Date.now())
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (!data) return;
                    const enrichEl = document.getElementById('enrich-' + i);
                    if (!enrichEl) return;
                    const html = buildEnrich(data, c);
                    if (html) enrichEl.innerHTML = html;
                })
                .catch(() => {});
        });
    } catch (e) {
        el.innerHTML = '<div class="no-results"><div class="no-results-icon">⚠️</div><div class="no-results-title">Could not load results</div><div class="no-results-sub">' + esc(e.message) + '</div></div>';
    }
}

// ── Detail view ───────────────────────────────────────────────────
async function loadDetail(idx) {
    const entry = window._index[idx];
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('detail').style.display = 'block';
    document.getElementById('det-comp').textContent = entry.competition;
    document.getElementById('det-info').textContent = fmtDate(entry.date) + ' - ' + entry.playerCount + ' players';
    document.getElementById('det-grades').innerHTML = '<div class="loading">Loading...</div>';
    document.getElementById('det-standings').innerHTML = '';

    try {
        const r = await fetch('./' + entry.file + '?_=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        renderDetail(data);
    } catch (e) {
        document.getElementById('det-grades').innerHTML = '<div class="no-results"><div class="no-results-icon">⚠️</div><div class="no-results-title">Could not load result</div><div class="no-results-sub">' + esc(e.message) + '</div></div>';
    }
}

function renderDetail(data) {
    const players  = data.players || [];
    const holeCount = data.holeCount || 18;
    const grades   = computeGrades(players);
    const isStroke = data.isStableford === false;
    window._scIsStroke = isStroke;

    // Update column header label
    const ptsHdr = document.getElementById('pts-col-hdr');
    if (ptsHdr) ptsHdr.textContent = isStroke ? 'Score' : 'Pts';

    // Format a player's score for display
    const fmtPts = pts => isStroke ? (pts > 0 ? '+' + pts : String(pts)) : pts + 'pts';

    // Sort helper: lower is better for stroke, higher for stableford
    const sortPlayers = (a, b) => {
        if (a.points !== b.points) return isStroke ? a.points - b.points : b.points - a.points;
        const cb = countbackCompare(a, b, holeCount, isStroke);
        return cb !== 0 ? cb : a.player.localeCompare(b.player);
    };

    // ── Grade winners ──
    const gradeEl = document.getElementById('det-grades');
    if (grades) {
        const byGrade = { A: [], B: [], C: [] };
        players.forEach(p => {
            const g = playerGrade(p.hcp, grades);
            if (g) byGrade[g].push(p);
        });
        ['A','B','C'].forEach(g => byGrade[g].sort(sortPlayers));

        const blockHtml = g => {
            const all = byGrade[g];
            const top = all.slice(0, 3);
            if (!top.length) return '<div class="grade-label">' + g + ' Grade</div><div style="color:#4a6a84;font-size:0.8em">-</div>';
            return '<div class="grade-label">' + g + ' Grade</div>' +
                top.map((p, i) => {
                    const nextPts = (all[i + 1] || {}).points;
                    const usedCB = (p.points === nextPts || (i > 0 && p.points === top[i - 1].points))
                        && p.thru >= holeCount && (p.holePoints || []).length > 0;
                    const cbMark = usedCB ? '<sup style="font-size:0.55em;color:#f39c12;vertical-align:super">CB</sup>' : '';
                    return '<div class="grade-winner"><span class="grade-medal">' + medals[i] + cbMark + '</span>' +
                        '<span class="grade-wname">' + esc(p.player.trim()) + '</span>' +
                        '<span class="grade-wpts">' + fmtPts(p.points) + '</span></div>';
                }).join('');
        };

        gradeEl.innerHTML = '<div class="grade-title">Grade Winners</div>' +
            '<div class="grade-blocks">' +
            ['A','B','C'].map(g => '<div class="grade-block">' + blockHtml(g) + '</div>').join('') +
            '</div>';
    } else {
        gradeEl.innerHTML = '';
    }

    // ── Standings ──
    const sorted = [...players].sort(sortPlayers);
    // Flag every position where countback broke a tie
    const cbFlags = sorted.map((p, i) => {
        if (p.thru < holeCount || !(p.holePoints || []).length) return false;
        const prev = sorted[i - 1];
        const next = sorted[i + 1];
        return (prev && prev.points === p.points && prev.thru >= holeCount) ||
               (next && next.points === p.points && next.thru >= holeCount);
    });
    // Store for scorecard lookups
    window._scPlayers   = sorted;
    window._scComp      = data.competition;
    window._scHoleCount = holeCount;
    window._scIsStroke  = isStroke;
    const isTeamComp = /4bbb|ambrose/i.test(data.competition || '') || /4bbb|ambrose/i.test(data.type || '');
    const ballCount = isTeamComp ? 0 : Math.ceil(sorted.length * 0.4);
    const BALL_SVG = '<svg width="13" height="13" viewBox="0 0 14 14" style="vertical-align:middle;margin-right:4px;flex-shrink:0" title="Ball winner"><circle cx="7" cy="7" r="6.2" fill="#ffffff" stroke="#b0b0b0" stroke-width="0.8"/><circle cx="5" cy="5.5" r="1.1" fill="rgba(0,0,0,0.12)"/><circle cx="9" cy="5.5" r="1.1" fill="rgba(0,0,0,0.12)"/><circle cx="7" cy="9.2" r="1.1" fill="rgba(0,0,0,0.12)"/></svg>';
    const standEl = document.getElementById('det-standings');
    standEl.innerHTML = sorted.map((p, i) => {
        const rank = i + 1;
        const cbMark = cbFlags[i] ? '<sup style="font-size:0.5em;color:#f39c12;vertical-align:super;font-weight:normal">CB</sup>' : '';
        let rankHtml;
        if      (rank === 1) rankHtml = '🥇' + cbMark;
        else if (rank === 2) rankHtml = '🥈' + cbMark;
        else if (rank === 3) rankHtml = '🥉' + cbMark;
        else                 rankHtml = rank + cbMark;
        const g = playerGrade(p.hcp, grades);
        const badge = g ? '<span class="grade-badge gb-' + g.toLowerCase() + '">' + g + '</span>' : '';
        const hcpTag = p.hcp != null ? '<span class="s-hcp"> [' + fmtHcp(p.hcp) + ']</span>' : '';
        const fin = p.thru >= holeCount;
        const thruTxt = fin ? 'F' : p.thru || '-';
        const thruCls = fin ? 's-fin' : 's-nf';
        const hasCard = (p.holeStrokes || []).length > 0;
        const chev = hasCard ? ' <span class="sc-chevron">&#9654;</span>' : '';
        const rowClick = hasCard ? ' onclick="toggleScorecard(this,' + i + ')"' : '';
        const ball = i < ballCount ? BALL_SVG : '';
        return '<div class="s-player-wrap">' +
            '<div class="s-row' + (rank <= 3 ? ' top3' : '') + (hasCard ? '' : ' no-card') + '"' + rowClick + '>' +
            '<span class="s-rank">' + rankHtml + '</span>' +
            '<span class="s-name">' + ball + esc(p.player.trim()) + hcpTag + badge + chev + '</span>' +
            '<span class="s-pts">' + fmtPts(p.points) + '</span>' +
            '<span class="' + thruCls + '">' + thruTxt + '</span>' +
            '</div>' +
            '<div id="sc-' + i + '" class="sc-outer"></div>' +
            '</div>';
    }).join('');
}

function showList() {
    document.getElementById('detail').style.display = 'none';
    document.getElementById('list-view').style.display = 'block';
}

// ── Scorecard expand / collapse ───────────────────────────────────
function toggleScorecard(rowEl, idx) {
    const outer = document.getElementById('sc-' + idx);
    const chev  = rowEl.querySelector('.sc-chevron');
    if (!outer) return;
    const opening = outer.style.display !== 'block';
    if (opening) {
        if (!outer.innerHTML) {
            outer.innerHTML = buildScorecard(window._scPlayers[idx], window._scComp, window._scHoleCount);
        }
        outer.style.display = 'block';
        if (chev) chev.classList.add('open');
    } else {
        outer.style.display = 'none';
        if (chev) chev.classList.remove('open');
    }
}

function buildScorecard(player, comp, holeCount) {
    const strokes  = player.holeStrokes  || [];
    const strokes2 = player.holeStrokes2 || null;
    const points   = player.holePoints   || [];
    const pars     = player.holePars     || [];
    const hcp      = player.hcp;
    const isTeam   = !!strokes2;
    const isStroke = window._scIsStroke || false;
    const n        = Math.max(strokes.length, points.length, pars.length);

    if (!strokes.length && !pars.length) {
        return '<div style="padding:10px 10px 14px;font-size:0.8em;color:#4a6a84">' +
            'Hole-by-hole data is saved from the next competition onwards.' +
            '</div>';
    }

    const gender     = detectGender(comp);
    const isNine     = n <= 9;
    const nine       = isNine ? detectNine(pars) : null;
    const courseIdxs = isNine
        ? (nine === 'back' ? [9,10,11,12,13,14,15,16,17] : [0,1,2,3,4,5,6,7,8])
        : Array.from({length: n}, (_, i) => i);
    const holeNums = courseIdxs.map(i => WWCC_HOLES[i] ? WWCC_HOLES[i].hole : i + 1);

    // For 4BBB use first-name labels
    const names   = isTeam ? player.player.split(' & ') : [];
    const p1Label = isTeam ? (names[0] || 'P1').split(' ')[0] : 'Score';
    const p2Label = isTeam ? (names[1] || 'P2').split(' ')[0] : '';

    function half(start, len, label) {
        if (len <= 0) return '';
        const idxs  = Array.from({length: len}, (_, k) => start + k);
        const sumPar = idxs.reduce((s, i) => s + (pars[i]    || 0), 0);
        const sumPts = idxs.reduce((s, i) => s + (points[i]  || 0), 0);
        const sumS1  = idxs.reduce((s, i) => s + (strokes[i]  != null ? strokes[i]  : 0), 0);
        const sumS2  = isTeam ? idxs.reduce((s, i) => s + (strokes2[i] != null ? strokes2[i] : 0), 0) : null;
        const anyS1  = idxs.some(i => strokes[i]  != null);
        const anyS2  = isTeam && idxs.some(i => strokes2[i] != null);

        let h = '<table class="sc-table"><tbody>';

        // Hole header
        h += '<tr class="sc-hdr sc-row-label"><td>' + label + '</td>';
        idxs.forEach(i => { h += '<td>' + holeNums[i] + '</td>'; });
        h += '<td>' + label + '</td></tr>';

        // Par
        h += '<tr class="sc-par sc-row-label"><td>Par</td>';
        idxs.forEach(i => { h += '<td>' + (pars[i] != null ? pars[i] : '-') + '</td>'; });
        h += '<td class="sc-total">' + sumPar + '</td></tr>';

        // Score row P1 (or solo player)
        h += '<tr class="sc-row-label"><td>' + p1Label + '</td>';
        idxs.forEach(i => {
            const g = strokes[i];
            if (g == null) {
                if (!isTeam) {
                    h += '<td><span class="score-pill" style="background:#e74c3c;color:#fff">-</span></td>';
                } else {
                    h += '<td style="color:#4a6a84">-</td>';
                }
                return;
            }
            // Stroke: colour gross strokes vs par; Stableford: colour by stableford pts
            const col = isStroke ? (scoreColour(g, pars[i]) || {bg:'#fff',tx:'#1c2620'}) : ptColour(points[i]);
            h += '<td><span class="score-pill" style="background:' + col.bg + ';color:' + col.tx + '">' + g + '</span></td>';
        });
        h += '<td class="sc-total">' + (anyS1 ? sumS1 : '-') + '</td></tr>';

        // Score row P2 (4BBB only)
        if (isTeam) {
            h += '<tr class="sc-row-label"><td>' + p2Label + '</td>';
            idxs.forEach(i => {
                const g = strokes2[i];
                if (g == null) { h += '<td style="color:#4a6a84">-</td>'; return; }
                const col = isStroke ? (scoreColour(g, pars[i]) || {bg:'#fff',tx:'#1c2620'}) : ptColour(points[i]);
                h += '<td><span class="score-pill" style="background:' + col.bg + ';color:' + col.tx + '">' + g + '</span></td>';
            });
            h += '<td class="sc-total">' + (anyS2 ? sumS2 : '-') + '</td></tr>';
        }

        // Score vs par row (stroke) or Stableford points row
        if (isStroke) {
            h += '<tr class="sc-pts-row sc-row-label"><td>Score</td>';
            idxs.forEach(i => { h += '<td>' + (points[i] != null ? (points[i] > 0 ? '+' + points[i] : points[i]) : '-') + '</td>'; });
            h += '<td class="sc-total">' + (sumPts > 0 ? '+' + sumPts : sumPts) + '</td></tr>';
        } else {
            h += '<tr class="sc-pts-row sc-row-label"><td>Pts</td>';
            idxs.forEach(i => { h += '<td>' + (points[i] != null ? points[i] : '-') + '</td>'; });
            h += '<td class="sc-total">' + sumPts + '</td></tr>';
        }

        // Nett (individual only, when hcp is known)
        if (!isTeam && hcp != null) {
            h += '<tr class="sc-nett-row sc-row-label"><td>Nett</td>';
            idxs.forEach(i => {
                const g = strokes[i], p = pars[i];
                if (g == null) { h += '<td>-</td>'; return; }
                const recv = strokesReceived(hcp, courseIdxs[i], gender, isNine, isNine ? courseIdxs : null);
                h += '<td>' + (g - recv) + '</td>';
            });
            h += '<td>-</td></tr>';
        }

        h += '</tbody></table>';
        return h;
    }

    const frontN = Math.min(9, n);
    const backN  = n > 9 ? n - 9 : 0;

    const legendItems = isStroke
        ? [['#f5c518','Eagle+'],['#7dd3fc','Birdie'],['#ffffff','Par'],['#f59e42','Bogey'],['#f2a89c','Dbl+']]
        : [['#f5c518','Eagle+'],['#7dd3fc','Birdie'],['#ffffff','Par'],['#f59e42','Bogey'],['#e74c3c','Wipe']];
    const legend = '<div class="sc-legend">' +
        legendItems.map(([bg, lbl]) => '<div class="sc-leg-item"><div class="sc-leg-dot" style="background:' + bg + '"></div>' + lbl + '</div>')
        .join('') + '</div>';

    return '<div class="sc-wrap">' +
        half(0, frontN, 'Out') +
        (backN > 0 ? '<div style="margin-top:6px">' + half(9, backN, 'In') + '</div>' : '') +
        '</div>' + legend;
}

loadIndex();
</script>
