name: Lake meter rebuild

# Rebuild data/lake_meter.json (the Lake Extraction explorer's data) whenever a
# DAS export lands in data/das_exports/. The admin "Upload DAS CSV" writes the
# raw CSV there; this runs build_lake_data.py (stdlib only) and commits the result.
on:
  push:
    paths:
      - 'data/das_exports/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lake-meter
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build lake_meter.json from the DAS exports
        run: python build_lake_data.py data/das_exports data/lake_meter.json

      - name: Commit if the data changed
        run: |
          if [ -n "$(git status --porcelain data/lake_meter.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/lake_meter.json
            git commit -m "Rebuild lake_meter.json from DAS export"
            git push
          else
            echo "lake_meter.json unchanged - nothing to commit"
          fi
