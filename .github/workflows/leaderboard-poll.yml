name: Live Golf Leaderboard Poll

on:
  schedule:
    # Fallback cron - self-chaining keeps it running every ~5 min during the day.
    # Cron fires on startup each morning and as a safety net if the chain breaks.
    - cron: '*/10 17-23,0-11 * * *'

  workflow_dispatch:

concurrency:
  group: leaderboard-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WWCC_USERNAME: ${{ secrets.WWCC_USERNAME }}
      WWCC_PASSWORD: ${{ secrets.WWCC_PASSWORD }}

    steps:
      - name: Check sunrise/sunset window (Wagga Wagga -35.12, 147.37)
        id: window
        run: |
          python3 - << 'PYEOF'
          import math, datetime, zoneinfo, os

          LAT, LON, MARGIN_MIN = -35.12, 147.37, 240  # 4h after sunset covers evening prize publication
          TZ = zoneinfo.ZoneInfo("Australia/Sydney")

          def sun_local_hours(lat, lon, tz, local_date):
              n = local_date.timetuple().tm_yday
              d = math.asin(math.sin(math.radians(23.45))
                            * math.sin(math.radians(360 / 365 * (n - 81))))
              cos_h = ((math.sin(math.radians(-0.833)) - math.sin(math.radians(lat)) * math.sin(d))
                       / (math.cos(math.radians(lat)) * math.cos(d)))
              h_deg = math.degrees(math.acos(max(-1.0, min(1.0, cos_h))))
              B = math.radians(360 / 365 * (n - 81))
              eot_min = 9.87 * math.sin(2 * B) - 7.53 * math.cos(B) - 1.5 * math.sin(B)
              noon_utc = 12 - lon / 15 - eot_min / 60
              utc_off_h = datetime.datetime.now(tz).utcoffset().total_seconds() / 3600
              noon_local = noon_utc + utc_off_h
              return noon_local - h_deg / 15, noon_local + h_deg / 15

          now        = datetime.datetime.now(TZ)
          rise, sset = sun_local_hours(LAT, LON, TZ, now.date())
          cur        = now.hour + now.minute / 60
          start      = rise - MARGIN_MIN / 60
          end        = sset + MARGIN_MIN / 60
          manual     = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          within     = manual or (start <= cur <= end)

          def fmt(h):
              h = abs(h)
              return f"{int(h):02d}:{int(h % 1 * 60):02d} AEST/AEDT"

          print(f"Sunrise {fmt(rise)}  Sunset {fmt(sset)}")
          print(f"Window  {fmt(start)} - {fmt(end)}")
          print(f"Now     {fmt(cur)}  within={within}")

          gho = os.environ.get("GITHUB_OUTPUT")
          if gho:
              with open(gho, "a") as fh:
                  fh.write(f"within={'true' if within else 'false'}\n")
          PYEOF

      - name: Checkout repository
        if: steps.window.outputs.within == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.window.outputs.within == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        if: steps.window.outputs.within == 'true'
        run: |
          git config user.name  "WWCC Weather Bot"
          git config user.email "bot@wwcc.com.au"

      - name: Poll and commit (8 rounds, ~20s apart)
        if: steps.window.outputs.within == 'true'
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== Poll $i/8 at $(date -u +%H:%M:%S) ==="
            python -m miscore.live --once

            git add out/live-leaderboard.json out/last-results.json
            if git diff --staged --quiet; then
              echo "No score changes in poll $i"
            else
              git commit -m "Leaderboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              ok=""
              for j in 1 2 3 4 5; do
                if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
                echo "Push attempt $j failed, retrying in $((j*5))s..."
                sleep $((j * 5))
              done
              if [ -z "$ok" ]; then
                echo "WARNING: push failed in poll $i after 5 attempts - continuing"
              fi
            fi

            # Queue next chain after poll 1 so it starts as soon as this run ends
            if [ "$i" -eq 1 ]; then
              gh workflow run leaderboard-poll.yml --ref main \
                && echo "Next chain queued at poll $i" \
                || echo "Chain dispatch failed (non-fatal)"
            fi

            if [ "$i" -lt 8 ]; then sleep 20; fi
          done
