name: Grundfos Temperature Scan (one-shot)

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pymodbus==3.14.0

      - name: Run wide register scan
        env:
          GRUNDFOS_HOST: ${{ secrets.GRUNDFOS_HOST }}
        run: |
          python - <<'PYEOF'
          import os, json
          from pymodbus.client import ModbusTcpClient

          HOST = os.environ["GRUNDFOS_HOST"]
          NA   = 65535

          client = ModbusTcpClient(HOST, port=502, timeout=10)
          if not client.connect():
              raise SystemExit("FAILED to connect")

          def rhr(addr, count):
              # Read in 125-register chunks (Modbus limit)
              result = []
              while count > 0:
                  chunk = min(count, 125)
                  r = client.read_holding_registers(addr, count=chunk, device_id=1)
                  if r.isError():
                      result.extend([None] * chunk)
                  else:
                      result.extend(r.registers)
                  addr += chunk
                  count -= chunk
              return result

          def k_to_c(raw):
              if raw is None or raw == NA:
                  return None
              return round(raw * 0.01 - 273.15, 1)

          results = {}

          # Full sweep addr 0-800, record every non-NA, non-zero value
          print("Scanning addr 0-800...")
          full = rhr(0, 800)
          live = {}
          for i, raw in enumerate(full):
              if raw is not None and raw != 0 and raw != NA:
                  live[i] = raw  # key = addr offset from 0
          results["live_registers"] = live
          print(f"Found {len(live)} live registers")

          # Decode pump blocks 0-9 AND extended 10-19 for each pump
          # In case GENIECON uses 20-reg blocks instead of 10
          PUMP_BASES = [
              ("P1", 400), ("P2", 410), ("P3", 420),
              ("P4", 430), ("P5", 440), ("P6", 450),
              ("Pilot", 460), ("Backup", 470),
          ]
          pump_detail = {}
          pump_ext = rhr(400, 160)  # 8 pumps x 20 regs
          for label, base in PUMP_BASES:
              ofs = base - 400
              block = pump_ext[ofs:ofs+20] if ofs+20 <= len(pump_ext) else []
              decoded = {}
              for j, raw in enumerate(block):
                  decoded[f"+{j}"] = raw
                  # Try temperature decode on every register
                  if raw is not None and raw != NA and raw != 0:
                      tc = k_to_c(raw)
                      if tc is not None and -50 < tc < 200:
                          decoded[f"+{j}_as_degC"] = tc
              pump_detail[label] = decoded
          results["pump_blocks_extended"] = pump_detail

          # Also scan addr 480-600 (beyond standard pump blocks)
          extra = rhr(480, 120)
          extra_live = {}
          for i, raw in enumerate(extra):
              if raw is not None and raw != 0 and raw != NA:
                  extra_live[str(480+i)] = raw
          results["live_480_600"] = extra_live

          # Any register in 0-200 that has a value?
          early = rhr(0, 200)
          early_live = {}
          for i, raw in enumerate(early):
              if raw is not None and raw != 0 and raw != NA:
                  early_live[str(i)] = raw
          results["live_0_200"] = early_live

          client.close()

          out = "data/scan_temps_result.json"
          with open(out, "w") as f:
              json.dump(results, f, indent=2)
          print("Saved to", out)
          print("Live registers:", json.dumps({str(k): v for k,v in live.items()}, indent=2))
          PYEOF

      - name: Commit scan result
        run: |
          git config user.name  "WWCC Weather Bot"
          git config user.email "bot@wwcc.com.au"
          git add data/scan_temps_result.json
          git diff --staged --quiet || git commit -m "Wide register scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
