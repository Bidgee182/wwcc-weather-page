name: Leaderboard Daily Reset

on:
  schedule:
    # 1am AEST (UTC+10) = 2am AEDT (UTC+11) - safely overnight year-round
    - cron: '0 15 * * *'

  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive today's leaderboard then reset
        run: |
          python3 - << 'PYEOF'
          import json, datetime, os, pathlib

          live_path = "out/live-leaderboard.json"
          history_dir = pathlib.Path("out/history")
          index_path = history_dir / "index.json"

          with open(live_path) as f:
              data = json.load(f)

          # Only archive if there was a real competition today
          if data.get("competition") and data.get("players"):
              history_dir.mkdir(exist_ok=True)

              date_str = data.get("date") or datetime.date.today().isoformat()
              lb_id    = data.get("leaderboardId", "unknown")
              archive_name = f"{date_str}-{lb_id}.json"
              archive_path = history_dir / archive_name

              # Strip bulky per-hole detail but keep compact holePoints array for countback.
              # holePoints = list of per-hole stableford points (or null for unplayed).
              # Reduces archive from ~180KB (full) to ~25KB, vs ~10KB (no holes at all).
              def slim_player(p):
                  d = {k: v for k, v in p.items() if k not in ("holes", "last")}
                  if p.get("holes"):
                      d["holePoints"]  = [h.get("points")  for h in p["holes"]]
                      d["holePars"]    = [h.get("par")     for h in p["holes"]]
                      d["holeStrokes"] = [h.get("strokes") for h in p["holes"]]
                      s2s = [h.get("strokes2") for h in p["holes"]]
                      if any(s is not None for s in s2s):
                          d["holeStrokes2"] = s2s
                  return d

              slim = {k: v for k, v in data.items() if k not in ("events", "companions")}
              slim["players"] = [slim_player(p) for p in data.get("players", [])]
              slim["leaders"] = [slim_player(p) for p in data.get("leaders", [])]
              with open(archive_path, "w") as f:
                  json.dump(slim, f, separators=(",", ":"))
              print(f"Archived to {archive_path} ({archive_path.stat().st_size} bytes)")

              # Update index
              index = []
              if index_path.exists():
                  with open(index_path) as f:
                      index = json.load(f)

              def make_index_entry(d, lb_id, archive_name):
                  is_sf = d.get("isStableford", True)
                  players = d.get("players", [])
                  leaders = d.get("leaders", [])
                  if leaders:
                      leader, leader_pts = leaders[0]["player"], leaders[0]["points"]
                  elif players:
                      sorted_p = sorted(players, key=lambda p: -(p.get("points") or 0) if is_sf else (p.get("points") or 0))
                      leader, leader_pts = sorted_p[0]["player"], sorted_p[0]["points"]
                  else:
                      leader, leader_pts = "", 0
                  return {
                      "date":          date_str,
                      "competition":   d.get("competition", ""),
                      "type":          d.get("type"),
                      "playerCount":   d.get("playerCount", len(players)),
                      "holeCount":     d.get("holeCount", 0),
                      "courseHoles":   d.get("courseHoles") or d.get("holeCount", 0),
                      "leader":        leader,
                      "leaderPts":     leader_pts,
                      "leaderboardId": lb_id,
                      "file":          f"out/history/{archive_name}",
                  }

              # Collect new entries: primary first, then companions
              new_entries = []
              if not any(e.get("leaderboardId") == lb_id for e in index):
                  new_entries.append(make_index_entry(data, lb_id, archive_name))

              # Archive companion boards (women's, 4BBB, etc.)
              for companion in data.get("companions", []):
                  c_lb_id = companion.get("leaderboardId")
                  if not c_lb_id:
                      continue
                  c_archive_name = f"{date_str}-{c_lb_id}.json"
                  c_archive_path = history_dir / c_archive_name
                  c_slim = {k: v for k, v in companion.items() if k not in ("events", "stories")}
                  c_slim["players"] = [slim_player(p) for p in companion.get("players", [])]
                  with open(c_archive_path, "w") as f:
                      json.dump(c_slim, f, separators=(",", ":"))
                  print(f"Companion archived to {c_archive_path} ({c_archive_path.stat().st_size} bytes)")
                  if not any(e.get("leaderboardId") == c_lb_id for e in index):
                      new_entries.append(make_index_entry(companion, c_lb_id, c_archive_name))

              if new_entries:
                  index = new_entries + index
                  with open(index_path, "w") as f:
                      json.dump(index, f, indent=2)
                  print(f"Index updated: {len(index)} competitions ({len(new_entries)} new)")
          else:
              print("No competition data to archive - skipping")

          # Write the blank reset JSON
          payload = {
              "competition": None,
              "type": None,
              "date": None,
              "leaderboardId": None,
              "holeCount": 0,
              "par": 0,
              "generatedAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "playerCount": 0,
              "started": False,
              "players": [],
              "leaders": [],
              "heaters": [],
              "comingLast": [],
              "events": [],
          }
          with open(live_path, "w") as f:
              json.dump(payload, f, indent=2)
          print("Leaderboard reset complete")
          PYEOF

      - name: Configure git
        run: |
          git config user.name  "WWCC Weather Bot"
          git config user.email "bot@wwcc.com.au"

      - name: Commit and push
        run: |
          git add out/live-leaderboard.json out/history/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Leaderboard archive + reset $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then break; fi
              echo "Push attempt $i failed, retrying..."; sleep 3
            done
          fi
