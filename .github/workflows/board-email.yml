name: Board Lake Update Email

on:
  schedule:
    # EVERY board send fires at 7:00 AM Sydney (weekly report is still MANUAL:
    # enter pump meter -> Dry Run -> Send to Board; Wednesday is the safety-net).
    # 7am Sydney = 20:00 UTC (AEDT) or 21:00 UTC (AEST) the PRIOR day, so "7am on
    # the 1st" cannot be written as a day-of-month cron - we fire daily at both UTC
    # times and let the "Decide mode" step below pick reminder (Mon) / weekly (Wed)
    # / monthly (1st) by the Sydney DATE. The guard keys off the date, NOT the clock
    # hour, so a late GitHub run still counts (the 1 Oct 2026 miss was hour-based);
    # board_email.py's once-a-week and once-a-month sent-guards dedup the two daily
    # fires (an hour apart, so the first commits its guard before the second runs)
    # and any delayed re-fire.
    - cron: '0 20 * * *'   # 7am AEDT / 6am AEST
    - cron: '0 21 * * *'   # 8am AEDT / 7am AEST

  workflow_dispatch:
    inputs:
      report:
        description: 'Report type to send'
        required: false
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly
      dry_run:
        description: 'Build HTML preview only — do not send email'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      test:
        description: 'Send test email to andrew@bidgeepumps.com.au only'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force:
        description: 'Ignore sent guard and send regardless'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  # Shared with all repo-writing workflows: GitHub queues them so a poll can
  # never push mid-way through an email run (and vice versa)
  group: repo-writes
  cancel-in-progress: false

jobs:
  board-email:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Decide mode (reminder / weekly / monthly)
        id: cfg
        run: |
          python3 - <<'PY'
          import json, pathlib, os, datetime, zoneinfo
          ev  = "${{ github.event_name }}"
          now = datetime.datetime.now(zoneinfo.ZoneInfo("Australia/Sydney"))
          mode = "skip"
          if ev == "workflow_dispatch":
              rep  = "${{ github.event.inputs.report }}" or "weekly"
              mode = "monthly" if rep == "monthly" else "weekly"
          else:
              # Gate by the Sydney DATE, not the clock hour: GitHub can run a scheduled
              # job hours late, and an hour-based guard then skipped the send entirely
              # (the 1 Oct 2026 miss). The two daily crons fire an hour apart, so the
              # once-a-month / once-a-week sent-guards in board_email.py dedup to a
              # single send (first fire commits its guard before the second runs) and
              # also absorb any delayed re-fire. Monthly is checked first so it wins
              # when the 1st lands on a Monday or Wednesday.
              wd, hr, dom = now.weekday(), now.hour, now.day   # Mon=0 .. Sun=6
              if dom == 1:
                  mode = "monthly"         # 1st of month (any hour -> survives late runs)
              elif wd == 2:
                  mode = "weekly"          # Wednesday safety-net send (any hour; week-guard dedups)
              elif wd == 0 and hr == 7:
                  mode = "reminder"        # Monday 7am nudge to Andrew (one DST twin; no guard)
              # any other firing is the off-DST twin / an ordinary day -> skip
          # Enabled toggle (manual dispatch always runs)
          cfg = {}
          p = pathlib.Path("data/email_config.json")
          if p.exists():
              cfg = json.loads(p.read_text())
          enabled = cfg.get("email_enabled", {})
          flag = "board_monthly" if mode == "monthly" else "board_weekly"
          ok = enabled.get(flag, True) if mode in ("weekly", "monthly", "reminder") else False
          if ev == "workflow_dispatch":
              ok = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"mode={mode}\n")
              f.write(f"ok={'true' if (ok and mode != 'skip') else 'false'}\n")
          print(f"mode={mode} ok={ok}")
          PY

      - name: Run board email
        if: steps.cfg.outputs.ok == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_BOARD_TO:   ${{ secrets.EMAIL_BOARD_TO }}
          EMAIL_BOARD_CC:   ${{ secrets.EMAIL_BOARD_CC }}
          EMAIL_BOARD_BCC:  ${{ secrets.EMAIL_BOARD_BCC }}
          RECIPIENTS_KEY:   ${{ secrets.RECIPIENTS_KEY }}
        run: |
          ARGS=""
          MODE="${{ steps.cfg.outputs.mode }}"
          if [ "$MODE" = "monthly" ];  then ARGS="$ARGS --monthly";  fi
          if [ "$MODE" = "reminder" ]; then ARGS="$ARGS --reminder"; fi
          # Manual-dispatch flags (apply to the weekly/monthly send paths)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            ARGS="$ARGS --test"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "Running board_email with:$ARGS"
          python scripts/board_email.py $ARGS

      - name: Commit sent guards
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.test != 'true' }}
        run: |
          git config user.name  "WWCC Weather Bot"
          git config user.email "bot@wwcc.com.au"
          # One git add per file: a single missing pathspec makes git stage
          # NOTHING (exit 128), and '|| true' on a combined add silently threw
          # away the sent guard + email log after every real send
          git add data/board_sent_week.json  || true
          git add data/board_sent_month.json || true
          git add data/email_log.csv         || true
          git add data/evap_variance_log.json || true
          if git diff --staged --quiet; then
            echo "No guard changes to commit"
          else
            git commit -m "Board email sent guard $(date -u +%Y-%m-%d)"
            ok=""
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push; then ok=1; break; fi
              echo "Push attempt $i failed, retrying..."; sleep 5
            done
            [ -n "$ok" ]
          fi

      - name: Commit dry-run preview
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          git config user.name  "WWCC Weather Bot"
          git config user.email "bot@wwcc.com.au"
          git add data/reports/
          # Commit BEFORE pull --rebase: rebasing with a staged-but-uncommitted
          # index makes git die (exit 128) whenever another push lands mid-run
          if git diff --staged --quiet; then
            echo "No preview changes to commit"
          else
            git commit -m "Board email preview $(date -u +%Y-%m-%d)"
            ok=""
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push; then ok=1; break; fi
              echo "Push attempt $i failed, retrying..."; sleep 5
            done
            [ -n "$ok" ]
          fi
