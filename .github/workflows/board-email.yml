name: Board Lake Update Email

on:
  schedule:
    # Weekly — Monday 7:00 AM AEST (UTC+10): Sunday 21:00 UTC
    - cron: '0 21 * * 0'
    # Weekly — Monday 7:00 AM AEDT (UTC+11): Sunday 20:00 UTC
    - cron: '0 20 * * 0'
    # Monthly — 1st of month 7:00 PM AEST: 09:00 UTC same day
    - cron: '0 9 1 * *'
    # Monthly — 1st of month 7:00 PM AEDT: 08:00 UTC same day
    - cron: '0 8 1 * *'
    # Weekly and monthly guards prevent double-sends.

  workflow_dispatch:
    inputs:
      report:
        description: 'Report type to send'
        required: false
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly
      dry_run:
        description: 'Build HTML preview only — do not send email'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      test:
        description: 'Send test email to andrew@bidgeepumps.com.au only'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force:
        description: 'Ignore sent guard and send regardless'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  # Shared with all repo-writing workflows: GitHub queues them so a poll can
  # never push mid-way through an email run (and vice versa)
  group: repo-writes
  cancel-in-progress: false

jobs:
  board-email:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check if board email is enabled
        id: cfg
        run: |
          python3 - <<'PY'
          import json, pathlib, os, datetime, zoneinfo
          p = pathlib.Path("data/email_config.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          enabled = cfg.get("email_enabled", {})
          # Determine whether this is a weekly or monthly run (same logic as main script)
          report_input = "${{ github.event.inputs.report }}"
          if report_input:
              is_monthly = report_input == "monthly"
          else:
              now = datetime.datetime.now(zoneinfo.ZoneInfo("Australia/Sydney"))
              is_monthly = now.day == 1
          flag = "board_monthly" if is_monthly else "board_weekly"
          ok = enabled.get(flag, True)
          # Manual dispatch always runs regardless of toggle
          if "${{ github.event_name }}" == "workflow_dispatch":
              ok = True
          val = "true" if ok else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ok={val}\n")
          print(f"{'monthly' if is_monthly else 'weekly'} board email enabled: {val}")
          PY

      - name: Run board email
        if: steps.cfg.outputs.ok == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_BOARD_TO:   ${{ secrets.EMAIL_BOARD_TO }}
          EMAIL_BOARD_CC:   ${{ secrets.EMAIL_BOARD_CC }}
          EMAIL_BOARD_BCC:  ${{ secrets.EMAIL_BOARD_BCC }}
          RECIPIENTS_KEY:   ${{ secrets.RECIPIENTS_KEY }}
        run: |
          ARGS=""
          # On the 1st of the month (scheduled) or when manually requesting monthly, add --monthly
          DAY=$(TZ='Australia/Sydney' date +%d)
          REPORT="${{ github.event.inputs.report }}"
          if [ "$DAY" = "01" ] || [ "$REPORT" = "monthly" ]; then
            ARGS="$ARGS --monthly"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            ARGS="$ARGS --test"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/board_email.py $ARGS

      - name: Commit sent guards
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.test != 'true' }}
        run: |
          git config user.name  "WWCC Weather Bot"
          git config user.email "bot@wwcc.com.au"
          # One git add per file: a single missing pathspec makes git stage
          # NOTHING (exit 128), and '|| true' on a combined add silently threw
          # away the sent guard + email log after every real send
          git add data/board_sent_week.json  || true
          git add data/board_sent_month.json || true
          git add data/email_log.csv         || true
          git add data/evap_variance_log.json || true
          if git diff --staged --quiet; then
            echo "No guard changes to commit"
          else
            git commit -m "Board email sent guard $(date -u +%Y-%m-%d)"
            ok=""
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "Push attempt $i failed, retrying..."; sleep 5
            done
            [ -n "$ok" ]
          fi

      - name: Commit dry-run preview
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          git config user.name  "WWCC Weather Bot"
          git config user.email "bot@wwcc.com.au"
          git add data/reports/
          # Commit BEFORE pull --rebase: rebasing with a staged-but-uncommitted
          # index makes git die (exit 128) whenever another push lands mid-run
          if git diff --staged --quiet; then
            echo "No preview changes to commit"
          else
            git commit -m "Board email preview $(date -u +%Y-%m-%d)"
            ok=""
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "Push attempt $i failed, retrying..."; sleep 5
            done
            [ -n "$ok" ]
          fi
