name: Pump Station Weekly Summary Email

on:
  schedule:
    - cron: '0 21 * * 0'   # Monday 7:00am AEST (UTC+10) - Sunday 21:00 UTC, same slot as the board email

  workflow_dispatch:
    inputs:
      test:
        description: 'Send test email to Andrew only (real data, single recipient)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force:
        description: 'Send regardless of email_config.json toggle'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  # Shared queue with the other repo-writing workflows so the email-log commit
  # never collides with a poll or another report push.
  group: repo-writes
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: echo "stdlib only - no extra deps"

      - name: Send daily summary email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PUMP_EMAIL_RECIPIENTS: ${{ secrets.PUMP_EMAIL_RECIPIENTS }}
          PUMP_EMAIL_CC: ${{ secrets.PUMP_EMAIL_CC }}
          PUMP_EMAIL_BCC: ${{ secrets.PUMP_EMAIL_BCC }}
          TEST_SEND: ${{ github.event.inputs.test || 'false' }}
          FORCE_SEND: ${{ github.event.inputs.force || 'false' }}
        run: python3 scripts/pump_daily_email.py

      - name: Commit email log
        run: |
          git config user.name  "WWCC Weather Bot"
          git config user.email "bot@wwcc.com.au"
          git add data/email_log.csv || true
          if git diff --staged --quiet; then
            echo "No email-log changes to commit"
          else
            git commit -m "Pump daily email log $(date -u +%Y-%m-%d)"
            ok=""
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "Push attempt $i failed, retrying..."; sleep 5
            done
            [ -n "$ok" ]
          fi
