name: Pump Station Daily Summary Email

on:
  schedule:
    - cron: '0 21 * * *'   # 7:00am AEST (UTC+10) - runs at 21:00 UTC previous evening

  workflow_dispatch:
    inputs:
      test:
        description: 'Send test email to Andrew only (real data, single recipient)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force:
        description: 'Send regardless of email_config.json toggle'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  send:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install sendgrid

      - name: Send daily summary email
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PUMP_EMAIL_RECIPIENTS: ${{ secrets.PUMP_EMAIL_RECIPIENTS }}
          PUMP_EMAIL_CC: ${{ secrets.PUMP_EMAIL_CC }}
          PUMP_EMAIL_BCC: ${{ secrets.PUMP_EMAIL_BCC }}
          TEST_SEND: ${{ github.event.inputs.test || 'false' }}
          FORCE_SEND: ${{ github.event.inputs.force || 'false' }}
        run: python3 scripts/pump_daily_email.py
