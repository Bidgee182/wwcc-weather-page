name: Grundfos Pump Station Poll

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'   # Every 5 minutes, offset by 2 min

  workflow_dispatch:

concurrency:
  group: grundfos-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymodbus==3.14.0

      - name: Poll Grundfos CIM 500
        env:
          GRUNDFOS_HOST: ${{ secrets.GRUNDFOS_HOST }}
          GRUNDFOS_PORT: '502'
        run: python scripts/poll_grundfos.py

      - name: Push pump data via GitHub API (conflict-free)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Detect which pump data files changed vs checkout baseline
          git add data/pump_station_latest.json \
                  data/pump_station_history.json \
                  data/pump_station_daily.json \
                  data/pump_alarm_history.json \
                  data/pump_commands.json \
                  data/pump_starts.json \
                  data/raw/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No data changes -- skipping"
            exit 0
          fi

          changed=$(git diff --staged --name-only)
          commit_msg="Grundfos poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pushed=0
          failed=0

          # Push each changed file directly via the GitHub Contents API.
          # This is atomic and never conflicts with other workflow pushes because
          # only this workflow writes pump data files.
          while IFS= read -r f; do
            [ -f "$f" ] || continue

            # Fetch the file's current SHA on remote (required by the PUT endpoint)
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$f" --jq '.sha' 2>/dev/null || echo "")
            if [ -z "$sha" ]; then
              echo "WARNING: no remote SHA for $f -- skipping"
              failed=1
              continue
            fi

            content=$(base64 -w 0 < "$f")

            if gh api "repos/$GITHUB_REPOSITORY/contents/$f" \
                --method PUT \
                --field "message=$commit_msg" \
                --field "content=$content" \
                --field "sha=$sha" \
                --silent; then
              echo "Pushed: $f"
              pushed=1
            else
              echo "WARNING: API push failed for $f"
              failed=1
            fi
          done <<< "$changed"

          [ "$pushed"  -eq 1 ] && echo "API push complete" || true
          [ "$failed"  -eq 1 ] && echo "NOTE: some files failed -- will retry next poll" || true

      - name: Queue next poll (self-chain, ~5 min gap)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 260
          gh workflow run poll-grundfos.yml --ref main \
            && echo "Next poll queued" \
            || echo "Self-chain dispatch failed (non-fatal)"
