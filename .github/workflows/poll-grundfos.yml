name: Grundfos Pump Station Poll

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'   # Every 5 minutes, offset by 2 min

  workflow_dispatch:

concurrency:
  group: grundfos-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymodbus==3.14.0

      - name: Poll Grundfos CIM 500
        env:
          GRUNDFOS_HOST: ${{ secrets.GRUNDFOS_HOST }}
          GRUNDFOS_PORT: '502'
        run: python scripts/poll_grundfos.py

      - name: Commit updated data to repository
        run: |
          git config user.name  "WWCC Weather Bot"
          git config user.email "bot@wwcc.com.au"
          git add data/pump_station_latest.json \
                  data/pump_station_history.json \
                  data/pump_station_daily.json \
                  data/pump_alarm_history.json \
                  data/raw/
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit"
          else
            git commit -m "Grundfos poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ok=""
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then ok=1; break; fi
              echo "Push attempt $i failed, retrying..."; sleep 5
            done
            [ -n "$ok" ]
          fi

      - name: Queue next poll (self-chain, ~5 min gap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 260
          gh workflow run poll-grundfos.yml --ref main \
            && echo "Next poll queued" \
            || echo "Self-chain dispatch failed (non-fatal)"
