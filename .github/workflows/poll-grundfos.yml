name: Grundfos Pump Station Poll

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'   # Every 5 minutes, offset by 2 min

  workflow_dispatch:

concurrency:
  group: grundfos-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymodbus==3.14.0

      - name: Poll Grundfos CIM 500
        env:
          GRUNDFOS_HOST: ${{ secrets.GRUNDFOS_HOST }}
          GRUNDFOS_PORT: '502'
        run: python scripts/poll_grundfos.py

      - name: Push pump data via GitHub API (conflict-free)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add data/pump_station_latest.json \
                  data/pump_station_history.json \
                  data/pump_station_daily.json \
                  data/pump_alarm_history.json \
                  data/pump_commands.json \
                  data/pump_starts.json \
                  data/raw/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No data changes -- skipping"
            exit 0
          fi

          export CHANGED_FILES
          CHANGED_FILES="$(git diff --staged --name-only)"
          python3 scripts/push_pump_data.py

      - name: Queue next poll (self-chain, ~5 min gap)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 260
          gh workflow run poll-grundfos.yml --ref main \
            && echo "Next poll queued" \
            || echo "Self-chain dispatch failed (non-fatal)"
