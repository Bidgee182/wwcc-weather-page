name: Grundfos Pump Station Poll

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'   # Every 5 minutes, offset by 2 min

  workflow_dispatch:
    inputs:
      router_ip:
        description: >-
          Optional: the modem's CURRENT public IP (from the Telstra/Jasper portal
          "Device IPv4"). If given, DuckDNS is re-pointed to it and the station
          is re-polled immediately. Leave blank for a normal poll.
        required: false
        default: ''

concurrency:
  group: grundfos-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymodbus==3.14.0

      - name: Poll Grundfos CIM 500
        env:
          GRUNDFOS_HOST: ${{ secrets.GRUNDFOS_HOST }}
          GRUNDFOS_PORT: '502'
        run: python scripts/poll_grundfos.py

      # Self-heal: if offline because DuckDNS is stale (Telstra reissued the
      # SIM IP and the modem's DDNS client missed it), find the real IP
      # (manual input / on-site Pi heartbeat / Jasper API), prove it is ours,
      # re-point DuckDNS and re-poll straight away. No-op when online.
      - name: Self-heal DuckDNS if the modem IP changed
        id: selfheal
        env:
          DUCKDNS_TOKEN:      ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN:     ${{ secrets.DUCKDNS_DOMAIN || 'bidgee-pumps' }}
          DDNS_HOST:          ${{ secrets.GRUNDFOS_HOST }}
          ROUTER_IP_OVERRIDE: ${{ github.event.inputs.router_ip }}
          JASPER_API_BASE:    ${{ secrets.JASPER_API_BASE }}
          JASPER_API_USER:    ${{ secrets.JASPER_API_USER }}
          JASPER_API_KEY:     ${{ secrets.JASPER_API_KEY }}
          JASPER_ICCID:       ${{ secrets.JASPER_ICCID }}
        run: python scripts/ddns_selfheal.py

      - name: Re-poll immediately after a DNS repair
        if: steps.selfheal.outputs.new_ip != ''
        env:
          GRUNDFOS_HOST: ${{ steps.selfheal.outputs.new_ip }}
          GRUNDFOS_PORT: '502'
        run: python scripts/poll_grundfos.py

      - name: Send alerts (offline / fault / IP change)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PUMP_EMAIL_RECIPIENTS: ${{ secrets.PUMP_EMAIL_RECIPIENTS }}
          PUMP_EMAIL_CC: ${{ secrets.PUMP_EMAIL_CC }}
          PUMP_EMAIL_BCC: ${{ secrets.PUMP_EMAIL_BCC }}
          DDNS_HOST: ${{ secrets.GRUNDFOS_HOST }}
        run: |
          python3 scripts/pump_alert_email.py

      - name: Push pump data via GitHub API (conflict-free)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One add per path - a combined `git add` stages NOTHING and aborts if
          # ANY path is missing (e.g. pump_ip_log.json before the first IP change).
          for f in data/pump_station_latest.json \
                   data/pump_station_history.json \
                   data/pump_station_daily.json \
                   data/pump_alarm_history.json \
                   data/pump_commands.json \
                   data/pump_starts.json \
                   data/pump_email_state.json \
                   data/pump_ip_log.json \
                   data/email_log.csv; do
            git add "$f" 2>/dev/null || true
          done
          git add data/raw/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No data changes -- skipping"
            exit 0
          fi

          export CHANGED_FILES
          CHANGED_FILES="$(git diff --staged --name-only)"
          python3 scripts/push_pump_data.py

      - name: Queue next poll (self-chain, ~5 min gap)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 260
          gh workflow run poll-grundfos.yml --ref main \
            && echo "Next poll queued" \
            || echo "Self-chain dispatch failed (non-fatal)"
