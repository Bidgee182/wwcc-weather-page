<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWCC Live Golf Leaderboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%; overflow: hidden;
    background: #0a1628; color: #ecf0f1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 22px;
}

#root {
    display: flex; flex-direction: column;
    height: 100vh; padding: 16px 24px 12px; gap: 12px;
}

/* ── Header ──────────────────────────────────────────────────────── */
.hdr {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 20px;
    padding-bottom: 12px; border-bottom: 2px solid #27ae60;
    flex-shrink: 0;
}
.hdr-logo { height: 58px; width: auto; }
.hdr-center { text-align: center; min-width: 0; }
.hdr-comp {
    font-size: 1.45em; font-weight: bold; letter-spacing: 3px;
    color: #ecf0f1; text-transform: uppercase; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hdr-meta { font-size: 0.78em; color: #7f8c8d; letter-spacing: 1px; margin-top: 4px; }
.hdr-right { text-align: right; flex-shrink: 0; }
.hdr-clock {
    font-size: 2.3em; font-weight: bold; color: #27ae60;
    line-height: 1; font-variant-numeric: tabular-nums;
}
.hdr-date { font-size: 0.8em; color: #bdc3c7; margin-top: 4px; }

/* ── Main layout ─────────────────────────────────────────────────── */
.main { flex: 1; display: flex; gap: 14px; min-height: 0; overflow: hidden; }

/* ── Leaderboard panel ───────────────────────────────────────────── */
.lb-panel {
    flex: 3; display: flex; flex-direction: column; min-height: 0;
    background: #1e2f3e; border: 2px solid #4a6a84; border-top: 4px solid #27ae60;
    border-radius: 12px; overflow: hidden;
}

.panel-title-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,0.4); padding: 7px 16px; flex-shrink: 0;
}
.panel-title { font-size: 0.78em; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; }

.live-badge {
    font-size: 0.65em; font-weight: bold; letter-spacing: 2px;
    padding: 3px 9px; border-radius: 4px; text-transform: uppercase;
}
.live-badge.live    { background: #27ae60; color: #fff; animation: badge-pulse 2s ease-in-out infinite; }
.live-badge.waiting { background: #4a6a84; color: #bdc3c7; }
.live-badge.offline { background: #7d1a00; color: #fff; }
.live-badge.loading { background: #2c3e50; color: #7f8c8d; }
@keyframes badge-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

.col-hdr {
    display: grid;
    grid-template-columns: 3em 1fr 3.5em 3.2em;
    gap: 6px; padding: 5px 16px;
    background: rgba(0,0,0,0.25); flex-shrink: 0;
    font-size: 1.02em; font-weight: bold; letter-spacing: 1.5px;
    text-transform: uppercase; color: #4a6a84;
    border-bottom: 1px solid #2a3f52;
}
.col-hdr-rank { text-align: center; }
.col-hdr-pts  { text-align: right; }
.col-hdr-thru { text-align: right; }

.lb-scroll-clip {
    flex: 1; display: flex; flex-direction: column; position: relative;
    transition: opacity 0.25s ease; overflow: hidden;
}
#lb-top3 {
    flex-shrink: 0;
    border-bottom: 2px solid rgba(39,174,96,0.35);
}
.lb-rest-clip {
    flex: 1; overflow: hidden; position: relative;
}
.lb-scroll-inner { width: 100%; }

@keyframes lb-scroll {
    from { transform: translateY(0); }
    to   { transform: translateY(-50%); }
}
.lb-scroll-inner.scrolling { animation: lb-scroll linear infinite; }
.lb-gap { height: 80px; }

.lb-row {
    display: grid;
    grid-template-columns: 3em 1fr 3.5em 3.2em;
    gap: 6px; padding: 10px 16px;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.lb-row:nth-child(even) { background: rgba(255,255,255,0.03); }
.lb-row.top3 { background: rgba(39,174,96,0.07) !important; }

.r-rank { text-align: center; font-size: 1.32em; color: #4a6a84; font-weight: bold; line-height: 1; }
.r-rank.gold   { color: #f1c40f; font-size: 1.5em; }
.r-rank.silver { color: #bdc3c7; }
.r-rank.bronze { color: #cd7f32; }
.r-name  { font-size: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-hcp-inline { font-size: 0.72em; color: #4a6a84; font-weight: normal; margin-left: 4px; }
.r-hcp-token  { font-size: 0.72em; color: #4a6a84; font-weight: normal; }
.r-pts   { text-align: right; font-size: 1.65em; font-weight: bold; color: #27ae60; }
.r-pts.dim { color: #4a6a84; }
.r-thru  { text-align: right; font-size: 1.2em; color: #7f8c8d; }
.r-thru.fin { color: #27ae60; font-weight: bold; font-size: 1.32em; }

/* ── Side panels ─────────────────────────────────────────────────── */
.side-panels {
    flex: 1.5; display: flex; flex-direction: column; gap: 12px; min-height: 0;
}
.side-card {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: #1e2f3e; border: 2px solid #4a6a84;
    border-radius: 12px; overflow: hidden;
}
.heater-card { border-top: 4px solid #e74c3c; }
.last-card   { border-top: 4px solid #3498db; }

.side-title-bar {
    background: rgba(0,0,0,0.4); padding: 7px 14px; flex-shrink: 0;
    font-size: 0.78em; font-weight: bold; letter-spacing: 2.5px; text-transform: uppercase;
}
/* Side panel scroll - same infinite-loop technique as main leaderboard */
.side-list { flex: 1; overflow: hidden; padding: 0; position: relative; }
.side-list-inner { padding: 8px 14px 6px; width: 100%; }
@keyframes side-scroll { from { transform: translateY(0); } to { transform: translateY(-50%); } }
.side-list-inner.scrolling { animation: side-scroll linear infinite; }

.story-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.story-row:last-child { border-bottom: none; }
.story-left  { flex: 1; min-width: 0; }
.story-right { text-align: right; flex-shrink: 0; padding-left: 8px; }
.story-name   { font-size: 1.25em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.story-title  { font-size: 1.05em; font-weight: 600; color: #ecf0f1; margin-top: 3px; }
.story-detail { font-size: 0.88em; color: #7f8c8d; margin-top: 1px; }
.story-pts    { font-size: 1.43em; font-weight: bold; color: #27ae60; }
.story-thru   { font-size: 1.02em; color: #7f8c8d; margin-top: 1px; }

.last-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.last-row:last-child { border-bottom: none; }
.last-left  { min-width: 0; }
.last-name  { font-size: 1.32em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.last-thru  { font-size: 1.02em; color: #7f8c8d; margin-top: 2px; }
.last-thru.fin { color: #27ae60; font-weight: bold; }
.last-pts   { font-size: 1.43em; font-weight: bold; color: #f39c12; flex-shrink: 0; padding-left: 8px; }

.empty-note {
    color: #4a6a84; font-size: 1.2em; text-align: center;
    padding: 16px 0; font-style: italic;
}

/* ── Footer ──────────────────────────────────────────────────────── */
.ftr {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 8px; border-top: 1px solid #2a3f52; flex-shrink: 0;
    font-size: 1.08em; color: #7f8c8d;
}
.ftr-updated { color: #bdc3c7; }
.ftr-results { color: #4a6a84; font-size: 0.75em; text-decoration: none; }
.ftr-results:hover { color: #7f8c8d; }

/* ── No-data placeholder ─────────────────────────────────────────── */
.no-data-comp {
    font-size: 2em; font-weight: 800; color: #ecf0f1;
    text-align: center; padding: 32px 20px 4px; letter-spacing: 0.5px;
}
.no-data-msg {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; text-align: center; padding: 32px;
    color: #4a6a84;
}
.no-data-icon  { font-size: 3.6em; margin-bottom: 14px; }
.no-data-title { font-size: 1.5em; color: #ecf0f1; margin-bottom: 6px; font-weight: bold; }
.no-data-sub   { font-size: 1.1em; color: #7f8c8d; line-height: 1.5; white-space: pre-line; }
.no-data-err   { font-size: 1.05em; color: #e74c3c; margin-top: 8px; }

/* ── Grade leader strip ──────────────────────────────────────────── */
.grade-strip {
    flex-shrink: 0; display: none;
    background: rgba(0,0,0,0.2);
    border-bottom: 2px solid #2a3f52;
}
.grade-strip.visible { display: block; }
.grade-row {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.grade-row:last-child { border-bottom: none; }
.grade-label {
    font-size: 0.9em; font-weight: bold; letter-spacing: 1px;
    color: #4a6a84; width: 6em; flex-shrink: 0; text-transform: uppercase;
}
.grade-leaders-list { display: flex; gap: 18px; min-width: 0; overflow: hidden; align-items: center; }
.grade-item { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.grade-medal-sm { font-size: 1.17em; }
.grade-name-sm  { font-size: 1.08em; color: #ecf0f1; }
.grade-pts-sm   { font-size: 1.08em; font-weight: bold; color: #27ae60; }

/* Grade badge in scrolling rows */
.grade-badge { display: inline-block; font-size: 0.52em; vertical-align: middle; margin-right: 4px; }

/* Scoreboard Stories tier colours */
@keyframes story-pulse-orange { 0%,100% { color: #e67e22; } 50% { color: #f39c12; opacity: 0.75; } }
@keyframes story-flash-gold   { 0%,100% { color: #f1c40f; } 45%,55% { color: #fff; } }
.story-name-gold   { animation: story-flash-gold   1.2s ease-in-out infinite; color: #f1c40f; }
.story-name-orange { animation: story-pulse-orange 2.5s ease-in-out infinite; color: #e67e22; }
.story-name-red    { color: #e74c3c; }
.story-name-blue   { color: #5dade2; }

/* ── Mobile / small screen responsive ───────────────────────────── */
@media (max-width: 900px) {
    /* Allow the page to scroll on mobile - TV keeps its 100vh lock */
    html, body { font-size: 16px; overflow-y: auto; height: auto; }
    #root { height: auto; min-height: 100vh; overflow: visible; padding: 10px 12px 8px; gap: 8px; }
    .main { overflow: visible; flex-direction: column; gap: 8px; }

    /* Mobile header: stack comp name on top centred, clock+date row below */
    .hdr { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .hdr-logo { display: none; }
    .hdr-center { text-align: center; width: 100%; }
    .hdr-comp { font-size: 1.45em; letter-spacing: 1px; }
    .hdr-right { display: flex; align-items: baseline; gap: 10px; justify-content: center; }
    .hdr-clock { font-size: 1.6em; font-weight: bold; color: #27ae60; }
    .hdr-date  { font-size: 0.75em; margin-top: 0; }

    .lb-panel { flex: none; height: 55vh; }

    /* Stack side panels vertically so names have full width */
    .side-panels { flex: none; flex-direction: column; height: auto; gap: 8px; }
    .side-card { flex: none; }
    /* On mobile disable the infinite-scroll animation - just regular scroll so names don't duplicate */
    .side-list { height: 220px; padding: 6px 10px 4px; overflow-y: auto; }
    .side-list-inner.scrolling { animation: none; }
    .side-list-inner { padding: 0; }

    .grade-strip { display: none !important; }

    .col-hdr { grid-template-columns: 2.5em 1fr 3.5em 3em; }
    .lb-row  { grid-template-columns: 2.5em 1fr 3.5em 3em; padding: 6px 10px; }
    .lb-row .r-pts  { font-size: 1em; }

    .panel-title-bar { padding: 5px 10px; }
    .col-hdr { padding: 4px 10px; }
    .side-title-bar { padding: 5px 10px; font-size: 0.72em; }
    .story-row { padding: 5px 0; }
    .last-row  { padding: 5px 0; }

    /* Leaderboard: allow team names to wrap and reduce font size */
    .r-name { white-space: normal; overflow: visible; font-size: 1.15em; }

    /* Stories: static colours on mobile, no animation */
    .story-name-gold   { animation: none; color: #f1c40f; }
    .story-name-orange { animation: none; color: #e67e22; }
    .story-name  { font-size: 1.05em; }
    .story-title { font-size: 0.95em; }
    .story-detail { font-size: 0.8em; }
}

@media (max-width: 480px) {
    html, body { font-size: 13px; }
    .hdr-comp { font-size: 1.2em; }
    .hdr-clock { font-size: 1.35em; }
    .lb-panel { height: 52vh; }
    .side-list { height: 200px; }
    .ftr { font-size: 0.65em; }
}
</style>
</head>
<body>
<div id="root">

  <header class="hdr">
    <img class="hdr-logo"
         src="https://wwcc.com.au/cms/wp-content/themes/contemporary/assets/images/logo.png"
         alt="WWCC" onerror="this.style.display='none'">
    <div class="hdr-center">
      <div class="hdr-comp" id="hdr-comp">⛳ Live Golf Leaderboard</div>
      <div class="hdr-meta" id="hdr-meta">Wagga Wagga Country Club</div>
    </div>
    <div class="hdr-right">
      <div class="hdr-clock" id="clock">--:-- --</div>
      <div class="hdr-date"  id="date-str">---</div>
    </div>
  </header>

  <main class="main">

    <section class="lb-panel">
      <div class="panel-title-bar">
        <span class="panel-title">Leaderboard</span>
        <span class="live-badge loading" id="live-badge">Loading</span>
      </div>
      <div class="col-hdr">
        <span class="col-hdr-rank">#</span>
        <span class="col-hdr-name">Player</span>
        <span class="col-hdr-pts">Pts</span>
        <span class="col-hdr-thru">Thru</span>
      </div>
      <div class="grade-strip" id="grade-strip">
        <div class="grade-row">
          <span class="grade-label">A Grade</span>
          <div class="grade-leaders-list" id="grade-a"></div>
        </div>
        <div class="grade-row">
          <span class="grade-label">B Grade</span>
          <div class="grade-leaders-list" id="grade-b"></div>
        </div>
        <div class="grade-row">
          <span class="grade-label">C Grade</span>
          <div class="grade-leaders-list" id="grade-c"></div>
        </div>
      </div>
      <div class="lb-scroll-clip" id="lb-clip">
        <div id="lb-top3"></div>
        <div class="lb-rest-clip" id="lb-rest-clip">
          <div class="lb-scroll-inner" id="lb-inner">
            <div class="no-data-msg">
              <div class="no-data-icon">⛳</div>
              <div class="no-data-title">Loading leaderboard...</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="side-panels">
      <div class="side-card heater-card">
        <div class="side-title-bar">📖 Scoreboard Stories</div>
        <div class="side-list" id="heater-list">
          <div class="side-list-inner"><div class="no-data-msg"><div class="no-data-sub">Waiting...</div></div></div>
        </div>
      </div>
      <div class="side-card last-card" id="blue-ball-card">
        <div class="side-title-bar">🔵🔵 Blue Ball Contenders</div>
        <div class="side-list" id="last-list">
          <div class="side-list-inner"><div class="no-data-msg"><div class="no-data-sub">Waiting...</div></div></div>
        </div>
      </div>
    </aside>

  </main>

  <footer class="ftr">
    <span class="ftr-updated" id="ftr-updated">Not yet loaded</span>
    <span id="ftr-status"></span>
    <span id="ftr-countdown">Fetching data...</span>
    <a href="results.html" class="ftr-results">Past Results</a>
  </footer>

</div>
<script>
const LB_URL      = new URLSearchParams(location.search).get('lb') || './out/live-leaderboard.json';
const REFRESH_SEC = 15;

let _countdown    = REFRESH_SEC;
let _hasData      = false;
let _animRunning  = false;

// ── Clock ─────────────────────────────────────────────────────────
function updateClock() {
    const syd = { timeZone: 'Australia/Sydney' };
    const clk = document.getElementById('clock');
    const dat = document.getElementById('date-str');
    if (clk) clk.textContent = new Date().toLocaleTimeString('en-AU', { ...syd, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
    if (dat) dat.textContent = new Date().toLocaleDateString('en-AU', { ...syd, weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
}

// ── Countdown ─────────────────────────────────────────────────────
function tickCountdown() {
    _countdown--;
    const el = document.getElementById('ftr-countdown');
    if (_countdown <= 0) {
        _countdown = REFRESH_SEC;
        if (el) el.textContent = 'Refreshing...';
        fetchData();
    } else {
        if (el) el.textContent = 'Next refresh in ' + _countdown + 's';
    }
}

// ── Fetch ─────────────────────────────────────────────────────────
async function fetchData() {
    try {
        const sep = LB_URL.includes('?') ? '&' : '?';
        const res = await fetch(LB_URL + sep + '_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (!_hasData) {
            // First successful load - render everything immediately
            _hasData = true;
            render(data);
        } else {
            // Update everything immediately - no animation buffer
            updateHeader(data);
            setBlueBallVisible(data.date);
            renderLeaderboard(data.players || [], data.holeCount || 18, data.started || false, data.competition || '');
            renderStories(data.stories || []);
            renderComingLast(data.comingLast || [], data.holeCount || 18);
            setFooter(data.generatedAt, '');
        }
    } catch (e) {
        onFetchError(e.message);
    }
}

// (animation-buffering removed - leaderboard updates immediately on each fetch)

// ── Full render (first load) ──────────────────────────────────────
function render(d) {
    if (d.status === 'no board') {
        setBadge('waiting', 'No comp today');
        setHeader('⛳ Live Golf Leaderboard', 'Wagga Wagga Country Club - no competition found for today');
        showNoData('lb-inner', '📋', 'No competition today', 'The poller found no active leaderboard.');
        showSideEmpty('heater-list', '-');
        showSideEmpty('last-list', '-');
        setFooter(d.generatedAt, '');
        return;
    }
    if (d.status === 'error') {
        setBadge('offline', 'Poller error');
        setFooter(d.generatedAt, d.error || 'Unknown error');
        return;
    }

    updateHeader(d);
    setFooter(d.generatedAt, '');
    setBlueBallVisible(d.date);
    renderLeaderboard(d.players || [], d.holeCount || 18, d.started || false, d.competition || '');
    renderStories(d.stories || []);
    renderComingLast(d.comingLast || [], d.holeCount || 18);
}

function updateHeader(d) {
    const started = d.started || false;
    const players = d.players || [];
    const hc      = d.holeCount || 18;

    const meta = ['Wagga Wagga Country Club'];
    if (d.type) meta.push(d.type);
    if (hc)     meta.push(hc + ' holes');
    if (d.par)  meta.push('Par ' + d.par);
    if (players.length) {
        // Detect team events: team entries have hcp=null and names joined with " & "
        const first = players[0];
        const teamSize = (first && first.hcp == null && first.player && first.player.includes(' & '))
            ? first.player.split(' & ').length : 1;
        if (teamSize > 1) {
            meta.push(players.length + ' teams (' + (players.length * teamSize) + ' players)');
        } else {
            meta.push(players.length + ' players');
        }
    }
    setHeader('⛳ ' + (d.competition || 'Live Golf Leaderboard'), meta.join(' - '));
    setBadge(started ? 'live' : 'waiting', started ? 'Live' : 'Not started');
}

// ── Grade helpers ─────────────────────────────────────────────────
// Grades are dynamic: sort all players by HCP, split into thirds.
// A Grade = lowest third, B Grade = middle third, C Grade = top third.
function computeGrades(players) {
    const withHcp = players.filter(p => p.hcp != null).sort((a, b) => a.hcp - b.hcp);
    const n = withHcp.length;
    if (n < 3) return null;
    const aEnd = Math.floor(n / 3);
    const bEnd = Math.floor(n * 2 / 3);
    // If the boundary HCP is shared by the next player, push the whole tie group
    // into the higher grade so no handicap value straddles a grade boundary.
    // This matches MiClub's official grade calculation.
    function boundaryHcp(idx) {
        const hcp = withHcp[idx].hcp;
        if (idx + 1 < n && withHcp[idx + 1].hcp === hcp) {
            // Walk back to find the highest HCP that is strictly below the tie group
            let i = idx - 1;
            while (i >= 0 && withHcp[i].hcp === hcp) i--;
            return i >= 0 ? withHcp[i].hcp : hcp - 1;
        }
        return hcp;
    }
    return { aMax: boundaryHcp(aEnd - 1), bMax: boundaryHcp(bEnd - 1) };
}

function getGrade(hcp, grades) {
    if (hcp == null || !grades) return null;
    if (hcp <= grades.aMax) return 'A';
    if (hcp <= grades.bMax) return 'B';
    return 'C';
}

// Countback comparator: returns <0 if a beats b, >0 if b beats a, 0 if tied.
// Uses GA method: back 9 -> back 6 -> back 3 -> last hole -> second-last ...
// Only applies when both players have finished (thru >= holeCount).
function countbackCompare(a, b, holeCount) {
    const aFin = a.thru >= holeCount;
    const bFin = b.thru >= holeCount;
    if (!aFin && !bFin) return 0;
    if (!aFin) return 1;  // unfinished loses to finished
    if (!bFin) return -1;
    const ah = a.holes || [];
    const bh = b.holes || [];
    const sliceSum = (arr, n) => arr.slice(-n).reduce((s, h) => s + (h.points || 0), 0);
    for (const n of [9, 6, 3]) {
        const d = sliceSum(bh, n) - sliceSum(ah, n);
        if (d !== 0) return d;
    }
    for (let i = ah.length - 1; i >= 0; i--) {
        const d = ((bh[i] || {}).points || 0) - ((ah[i] || {}).points || 0);
        if (d !== 0) return d;
    }
    return 0;
}

function fmtHcp(hcp) {
    if (hcp == null) return '';
    return hcp % 1 === 0 ? hcp.toString() : hcp.toFixed(1);
}

function renderGradeStrip(activeSorted, grades, holeCount, competition) {
    const strip = document.getElementById('grade-strip');
    if (!strip) return;
    // 4BBB has no grade split - best score wins overall
    if ((competition || '').toUpperCase().includes('4BBB')) { strip.classList.remove('visible'); return; }
    if (!grades || !activeSorted.length) { strip.classList.remove('visible'); return; }
    // Wait until at least 3 finished players in every grade
    const finByGrade = { A: 0, B: 0, C: 0 };
    for (const p of activeSorted) {
        if (p.thru >= holeCount) { const g = getGrade(p.hcp, grades); if (g) finByGrade[g]++; }
    }
    if (finByGrade.A < 3 || finByGrade.B < 3 || finByGrade.C < 3) { strip.classList.remove('visible'); return; }

    const gradeAll = { A: [], B: [], C: [] };
    for (const p of activeSorted) {
        const g = getGrade(p.hcp, grades);
        if (g) gradeAll[g].push(p);
    }

    const medals = ['🥇', '🥈', '🥉'];
    ['a', 'b', 'c'].forEach(gk => {
        const el = document.getElementById('grade-' + gk);
        if (!el) return;
        const all = gradeAll[gk.toUpperCase()];
        if (!all.length) { el.innerHTML = '<span style="color:#4a6a84;font-size:0.7em">-</span>'; return; }

        // Sort: points desc, then countback for tied finished players, then name
        all.sort((a, b) => {
            if (b.points !== a.points) return b.points - a.points;
            const cb = countbackCompare(a, b, holeCount);
            return cb !== 0 ? cb : a.player.localeCompare(b.player);
        });
        const top = all.slice(0, 3);

        el.innerHTML = top.map((p, i) => {
            // CB flag: this position was decided by countback (same pts as adjacent player)
            const nextPts = (all[i + 1] || {}).points;
            const usedCB = (p.points === nextPts || (i > 0 && p.points === top[i - 1].points))
                && p.thru >= holeCount;
            return '<div class="grade-item">' +
                '<span class="grade-medal-sm">' + medals[i] + (usedCB ? '<sup style="font-size:0.55em;color:#f39c12;vertical-align:super">CB</sup>' : '') + '</span>' +
                '<span class="grade-name-sm">' + esc(p.player.trim()) + '</span>' +
                '<span class="grade-pts-sm">&nbsp;' + p.points + 'pts</span>' +
                '</div>';
        }).join('');
    });

    strip.classList.add('visible');
}

// ── Leaderboard ───────────────────────────────────────────────────
function renderLeaderboard(players, holeCount, started, competition) {
    const clip     = document.getElementById('lb-clip');
    const top3El   = document.getElementById('lb-top3');
    const restClip = document.getElementById('lb-rest-clip');
    const inner    = document.getElementById('lb-inner');
    if (!inner) return;

    // Only show players who have actually teed off
    const active = started ? players.filter(p => p.thru > 0) : players;

    // Sort by points desc, then countback (GA method) for tied finished players, then name
    active.sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        const cb = countbackCompare(a, b, holeCount);
        return cb !== 0 ? cb : a.player.localeCompare(b.player);
    });

    // Flag every position where countback broke a tie (tied pts with a finished neighbour)
    const cbFlags = active.map((p, i) => {
        if (p.thru < holeCount) return false;
        const prev = active[i - 1];
        const next = active[i + 1];
        return (prev && prev.points === p.points && prev.thru >= holeCount) ||
               (next && next.points === p.points && next.thru >= holeCount);
    });

    // Grade calculations (use full field for boundaries, active for grade strip leaders)
    const grades = computeGrades(players);

    if (!active.length) {
        if (top3El) top3El.innerHTML = '';
        inner.classList.remove('scrolling');
        const compLine = competition ? '<div class="no-data-comp">' + esc(competition) + '</div>' : '';
        inner.innerHTML = started
            ? compLine + '<div class="no-data-msg"><div class="no-data-icon">⛳</div><div class="no-data-title">No scores yet</div><div class="no-data-sub">Players are on their way to the first tee</div></div>'
            : compLine + '<div class="no-data-msg"><div class="no-data-icon">⛳</div><div class="no-data-title">Competition starting soon</div><div class="no-data-sub">Scores will appear here when play begins</div></div>';
        _animRunning = false;
        return;
    }

    function buildRow(p, idx, usedCB) {
        p = { ...p, liveRank: idx + 1 };
        const rank = p.liveRank || 0;
        let rankHtml, rankCls = 'r-rank';
        const enoughHoles = p.thru >= 2;
        const cbMark = usedCB ? '<sup style="font-size:0.5em;color:#f39c12;vertical-align:super;font-weight:normal">CB</sup>' : '';
        if      (rank === 1 && enoughHoles) { rankHtml = '🥇' + cbMark; rankCls += ' gold'; }
        else if (rank === 2 && enoughHoles) { rankHtml = '🥈' + cbMark; rankCls += ' silver'; }
        else if (rank === 3 && enoughHoles) { rankHtml = '🥉' + cbMark; rankCls += ' bronze'; }
        else                                { rankHtml = rank + cbMark; }
        const thruTxt = p.thru === 0 ? '-' : p.thru >= holeCount ? 'F' : p.thru;
        const thruCls = p.thru >= holeCount ? 'r-thru fin' : 'r-thru';
        const ptsTxt  = (p.thru > 0 && started) ? p.points : '-';
        const ptsCls  = (p.thru > 0 && started) ? 'r-pts' : 'r-pts dim';
        const rowCls  = rank <= 3 ? 'lb-row top3' : 'lb-row';
        // Style embedded [N] handicap tokens (used for team names like "A [27] & B [10]")
        const escapedName = esc(p.player).replace(/\[(\+?\d+(?:\.\d+)?)\]/g,
            '<span class="r-hcp-token">[$1]</span>');
        const hcpTag = p.hcp != null ? ' <span class="r-hcp-inline">[' + fmtHcp(p.hcp) + ']</span>' : '';
        return '<div class="' + rowCls + '">' +
            '<span class="' + rankCls + '">' + rankHtml + '</span>' +
            '<span class="r-name">' + escapedName + hcpTag + '</span>' +
            '<span class="' + ptsCls + '">' + ptsTxt + '</span>' +
            '<span class="' + thruCls + '">' + thruTxt + '</span>' +
            '</div>';
    }

    const podium = active.slice(0, 3);
    const field  = active.slice(3);

    const top3Html = podium.map((p, i) => buildRow(p, i, cbFlags[i])).join('');
    const restHtml = field.map((p, i) => buildRow(p, i + 3, cbFlags[i + 3])).join('') +
                     (field.length ? '<div class="lb-gap"></div>' : '');

    // Fade out briefly, rebuild DOM, restart animation, fade in
    if (clip) clip.style.opacity = '0';
    setTimeout(() => {
        // Pinned podium - always static
        if (top3El) top3El.innerHTML = top3Html;

        // Scrolling field (positions 4+)
        inner.classList.remove('scrolling');
        inner.innerHTML = restHtml;
        void inner.offsetHeight; // measure single-copy height first

        const clipH = restClip ? restClip.clientHeight : window.innerHeight;

        if (field.length && inner.scrollHeight > clipH) {
            inner.innerHTML = restHtml + restHtml; // duplicate only when content overflows
            void inner.offsetHeight;
            const dur = Math.max(90, field.length * 0.85);
            inner.style.animationDuration = dur + 's';
            inner.classList.add('scrolling');
            _animRunning = true;
        } else {
            _animRunning = false;
        }
        if (clip) clip.style.opacity = '1';
        renderGradeStrip(active, grades, holeCount, competition);
    }, 250);
}

// ── Side panels ───────────────────────────────────────────────────
function setBlueBallVisible(dateStr) {
    const card = document.getElementById('blue-ball-card');
    if (!card) return;
    // Blue ball only runs on Wednesday (3) and Saturday (6) mens comps
    const day = dateStr ? new Date(dateStr + 'T12:00:00').getDay() : -1;
    card.style.display = (day === 3 || day === 6) ? '' : 'none';
}

function renderSidePanel(containerId, rows, emptyMsg, minForScroll) {
    const el = document.getElementById(containerId);
    if (!el) return;
    let inner = el.querySelector('.side-list-inner');
    if (!inner) {
        inner = document.createElement('div');
        inner.className = 'side-list-inner';
        el.innerHTML = '';
        el.appendChild(inner);
    }
    if (!rows.length) {
        inner.classList.remove('scrolling');
        inner.innerHTML = '<div class="no-data-msg"><div class="no-data-sub">' + esc(emptyMsg) + '</div></div>';
        return;
    }
    const html = rows.join('');
    inner.classList.remove('scrolling');
    if (rows.length >= minForScroll) {
        inner.innerHTML = html + html; // duplicate for seamless loop
        void inner.offsetHeight;
        const dur = Math.max(15, rows.length * 2.5);
        inner.style.animationDuration = dur + 's';
        inner.classList.add('scrolling');
    } else {
        inner.innerHTML = html;
    }
}

function stripHcp(s) {
    return s.replace(/\s*\[\+?\d+(?:\.\d+)?\]/g, '').trim();
}

// Scoreboard Stories - track when each story first appeared for expiry
const _storyState = {}; // { 'player|title': { since: timestamp } }

function renderStories(stories) {
    const now = Date.now();
    const EXPIRY_MS = 15 * 60 * 1000; // gold never expires; others expire after 15 min

    const currentKeys = new Set(stories.map(s => s.player + '|' + s.title));
    for (const k of Object.keys(_storyState)) {
        if (!currentKeys.has(k)) delete _storyState[k];
    }

    const visible = stories.filter(s => {
        const key = s.player + '|' + s.title;
        if (!_storyState[key]) _storyState[key] = { since: now };
        if (s.tier === 'gold') return true;
        return (now - _storyState[key].since) < EXPIRY_MS;
    });

    const TIER_EMOJI = { gold: '⭐', orange: '🔥', red: '😬', blue: '🎯' };
    const TIER_CSS   = { gold: 'story-name-gold', orange: 'story-name-orange', red: 'story-name-red', blue: 'story-name-blue' };

    const rows = visible.map(s => {
        const emoji = TIER_EMOJI[s.tier] || '';
        const css   = TIER_CSS[s.tier]  || 'story-name-blue';
        const name  = esc(stripHcp(s.player));
        return '<div class="story-row">' +
            '<div class="story-left">' +
                '<div class="story-name ' + css + '">' + name + ' ' + emoji + '</div>' +
                '<div class="story-title">' + esc(s.title) + '</div>' +
                '<div class="story-detail">' + esc(s.detail) + '</div>' +
            '</div>' +
            '<div class="story-right">' +
                '<div class="story-pts">' + s.points + 'pts</div>' +
                '<div class="story-thru">thru ' + s.thru + '</div>' +
            '</div>' +
        '</div>';
    });
    renderSidePanel('heater-list', rows, 'Watching the field...', 6);
}

function renderComingLast(comingLast, holeCount) {
    const hc = holeCount || 18;
    const rows = comingLast.map(p => {
        const fin = p.thru >= hc;
        const thruTxt = fin ? 'Finished' : 'thru ' + p.thru;
        const thruCls = fin ? 'last-thru fin' : 'last-thru';
        return '<div class="last-row">' +
            '<div class="last-left">' +
                '<div class="last-name">' + esc(p.player) + '</div>' +
                '<div class="' + thruCls + '">' + thruTxt + '</div>' +
            '</div>' +
            '<div class="last-pts">' + p.points + 'pts</div>' +
        '</div>';
    });
    renderSidePanel('last-list', rows, 'No data yet', 5);
}

// ── Error ─────────────────────────────────────────────────────────
function onFetchError(msg) {
    setBadge('offline', 'Offline');
    const sta = document.getElementById('ftr-status');
    if (sta) sta.textContent = msg;
    if (!_hasData) {
        showNoData('lb-inner', '⛳', 'Waiting for live data',
            'Start the poller:\npython -m miscore.live --serve 8787\n\nThen open:\nleaderboard.html?lb=http://localhost:8787/', msg);
        showSideEmpty('heater-list', 'Watching the field...');
        showSideEmpty('last-list', 'Awaiting connection');
    }
}

// ── Helpers ───────────────────────────────────────────────────────
function setHeader(comp, meta) {
    const c = document.getElementById('hdr-comp');
    const m = document.getElementById('hdr-meta');
    if (c) c.textContent = comp;
    if (m) m.textContent = meta;
}

function setBadge(cls, label) {
    const b = document.getElementById('live-badge');
    if (b) { b.className = 'live-badge ' + cls; b.textContent = label; }
}

function setFooter(generatedAt, status) {
    const upd = document.getElementById('ftr-updated');
    const sta = document.getElementById('ftr-status');
    if (upd && generatedAt) {
        try {
            const t = new Date(generatedAt).toLocaleTimeString('en-AU', { timeZone: 'Australia/Sydney', hour: 'numeric', minute: '2-digit' });
            upd.textContent = 'Updated ' + t;
        } catch (_) { upd.textContent = 'Updated'; }
    }
    if (sta) sta.textContent = status || '';
}

function showNoData(id, icon, title, sub, err) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('scrolling');
    _animRunning = false;
    if (id === 'lb-inner') { const t = document.getElementById('lb-top3'); if (t) t.innerHTML = ''; }
    el.innerHTML =
        '<div class="no-data-msg">' +
            '<div class="no-data-icon">' + icon + '</div>' +
            '<div class="no-data-title">' + esc(title) + '</div>' +
            (sub ? '<div class="no-data-sub">' + esc(sub) + '</div>' : '') +
            (err ? '<div class="no-data-err">' + esc(err) + '</div>' : '') +
        '</div>';
}

function showSideEmpty(id, msg) {
    renderSidePanel(id, [], msg, 99);
}

function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Boot ──────────────────────────────────────────────────────────
updateClock();
setInterval(updateClock, 1000);
setInterval(tickCountdown, 1000);
fetchData();
</script>
