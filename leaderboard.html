<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWCC Live Golf Leaderboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%; overflow: hidden;
    background: #0a1628; color: #ecf0f1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    /* Scale with screen height so any TV resolution shows the same layout.
       1.85vh ≈ 20px on a 1080p screen — a touch denser than the original 22px so
       more rows fit. Override with ?fs= (e.g. ?fs=1.2 bigger, ?fs=0.85 smaller) */
    font-size: clamp(11px, 1.85vh, 32px);
}

#root {
    display: flex; flex-direction: column;
    /* --edge: extra safe margin for TV overscan (TVs crop the picture edges).
       Default 1.2vw each side; tune per TV with ?edge=<px> in the URL. */
    height: 100vh; gap: 0.55em;
    padding: 0.73em calc(1.09em + var(--edge, 2vw)) 0.55em;
}

/* ── Header ──────────────────────────────────────────────────────── */
.hdr {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 20px;
    padding-bottom: 12px; border-bottom: 2px solid #27ae60;
    flex-shrink: 0;
}
.hdr-logo { height: 2.64em; width: auto; }
.hdr-center { text-align: center; min-width: 0; }
.hdr-comp {
    font-size: 1.45em; font-weight: bold; letter-spacing: 3px;
    color: #ecf0f1; text-transform: uppercase; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hdr-meta { font-size: 0.78em; color: #7f8c8d; letter-spacing: 1px; margin-top: 4px; }
.hdr-right { text-align: right; flex-shrink: 0; }
.hdr-clock-row { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
.hdr-clock {
    font-size: 2.3em; font-weight: bold; color: #27ae60;
    line-height: 1; font-variant-numeric: tabular-nums;
}
.hdr-date { font-size: 0.8em; color: #bdc3c7; margin-top: 4px; }

/* ── Main layout ─────────────────────────────────────────────────── */
.main { flex: 1; display: flex; gap: 0.64em; min-height: 0; overflow: hidden; }

/* ── Leaderboard panel ───────────────────────────────────────────── */
.lb-panel {
    flex: 1.05; display: flex; flex-direction: column; min-height: 0; min-width: 0; font-size: 1.44em;
    background: #1e2f3e; border: 2px solid #4a6a84; border-top: 4px solid #27ae60;
    border-radius: 12px; overflow: hidden;
}

.panel-title-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,0.4); padding: 7px 16px; flex-shrink: 0;
}
.panel-title { font-size: 0.78em; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; }

.live-badge {
    font-size: 0.65em; font-weight: bold; letter-spacing: 2px;
    padding: 3px 9px; border-radius: 4px; text-transform: uppercase;
}
.live-badge.live    { background: #27ae60; color: #fff; animation: badge-pulse 2s ease-in-out infinite; }
.live-badge.waiting { background: #4a6a84; color: #bdc3c7; }
.live-badge.offline { background: #7d1a00; color: #fff; }
.live-badge.loading { background: #2c3e50; color: #7f8c8d; }
.live-badge.results { background: #d4ac0d; color: #1a1a2e; }
@keyframes badge-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

.col-hdr {
    display: grid;
    grid-template-columns: 3em 1fr 6em 3.2em;
    gap: 0.27em; padding: 0.23em 0.73em;
    background: rgba(0,0,0,0.25); flex-shrink: 0;
    font-size: 1.02em; font-weight: bold; letter-spacing: 1.5px;
    text-transform: uppercase; color: #4a6a84;
    border-bottom: 1px solid #2a3f52;
}
.col-hdr-rank { text-align: center; }
.col-hdr-pts  { text-align: right; }
.col-hdr-thru { text-align: right; }

.lb-scroll-clip {
    flex: 1; display: flex; flex-direction: column; position: relative;
    transition: opacity 0.25s ease; overflow: hidden;
}
#lb-top3 {
    flex-shrink: 0;
    border-bottom: 2px solid rgba(39,174,96,0.35);
}
.lb-rest-clip {
    flex: 1; overflow: hidden; position: relative;
}
.lb-scroll-inner { width: 100%; }

@keyframes lb-scroll {
    from { transform: translateY(0); }
    to   { transform: translateY(-100%); }
}
.lb-scroll-inner.scrolling { animation: lb-scroll linear 1 forwards; }
.lb-gap { height: 3.64em; }

.lb-row {
    display: grid;
    grid-template-columns: 3em 1fr 6em 3.2em;
    gap: 0.27em; padding: 0.45em 0.73em;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.lb-row:nth-child(even) { background: rgba(255,255,255,0.03); }
.lb-row.top3 { background: rgba(39,174,96,0.07) !important; }

.r-rank { text-align: center; font-size: 1.32em; color: #4a6a84; font-weight: bold; line-height: 1; }
.r-rank.gold   { color: #f1c40f; font-size: 1.5em; }
.r-rank.silver { color: #bdc3c7; }
.r-rank.bronze { color: #cd7f32; }
.r-name  { font-size: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-name.team { font-size: 1.05em; white-space: normal; overflow: visible; line-height: 1.25; }
.r-hcp-inline { font-size: 0.72em; color: #4a6a84; font-weight: normal; margin-left: 4px; }
.ball-win     { font-size: 0.7em; margin-left: 4px; vertical-align: middle; opacity: 0.9; }
.r-hcp-token  { font-size: 0.72em; color: #4a6a84; font-weight: normal; }
.r-hcp-team   { display: block; font-size: 0.68em; color: #4a6a84; font-weight: normal; margin-top: 3px; letter-spacing: 0.02em; }
.r-gross { font-size: 0.72em; color: #8fb8cc; font-weight: normal; margin-right: 3px; }
.r-pts   { text-align: right; font-size: 1.65em; font-weight: bold; color: #27ae60; white-space: nowrap; }
.r-pts.dim { color: #4a6a84; }
.r-thru  { text-align: right; font-size: 1.2em; color: #7f8c8d; }
.r-thru.fin { color: #27ae60; font-weight: bold; font-size: 1.32em; }

/* ── Side panels ─────────────────────────────────────────────────── */
.side-panels {
    flex: 1.5; display: flex; flex-direction: column; gap: 0.55em; min-height: 0; min-width: 0; font-size: 1.44em;
}
.side-card {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: #1e2f3e; border: 2px solid #4a6a84;
    border-radius: 12px; overflow: hidden;
}
.heater-card { border-top: 4px solid #e74c3c; }
.last-card   { border-top: 4px solid #3498db; }

.side-title-bar {
    background: rgba(0,0,0,0.4); padding: 7px 14px; flex-shrink: 0;
    font-size: 0.78em; font-weight: bold; letter-spacing: 2.5px; text-transform: uppercase;
}
/* Side panel scroll - same infinite-loop technique as main leaderboard */
.side-list { flex: 1; overflow: hidden; padding: 0; position: relative; }
.side-list-inner { padding: 8px 14px 6px; width: 100%; }
@keyframes side-scroll { from { transform: translateY(0); } to { transform: translateY(-100%); } }
.side-list-inner.scrolling { animation: side-scroll linear 1 forwards; }

.story-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.story-row:last-child { border-bottom: none; }
.story-left  { flex: 1; min-width: 0; }
.story-right { text-align: right; flex-shrink: 0; padding-left: 8px; }
.story-name   { font-size: 1.25em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.story-title  { font-size: 1.05em; font-weight: 600; color: #ecf0f1; margin-top: 3px; }
.story-detail { font-size: 0.88em; color: #7f8c8d; margin-top: 1px; }
.story-pts    { font-size: 1.43em; font-weight: bold; color: #27ae60; }
.story-thru   { font-size: 1.02em; color: #7f8c8d; margin-top: 1px; }

.last-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.last-row:last-child { border-bottom: none; }
.last-left  { min-width: 0; }
.last-name  { font-size: 1.32em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.last-thru  { font-size: 1.02em; color: #7f8c8d; margin-top: 2px; }
.last-thru.fin { color: #27ae60; font-weight: bold; }
.last-pts   { font-size: 1.43em; font-weight: bold; color: #f39c12; flex-shrink: 0; padding-left: 8px; }

.empty-note {
    color: #4a6a84; font-size: 1.2em; text-align: center;
    padding: 16px 0; font-style: italic;
}

/* ── NTP / Longest Drive ticker ─────────────────────────────────── */
.ntpld-bar {
    display: flex; align-items: center; flex-shrink: 0;
    height: 2.4rem; background: #0a1520; border-top: 1px solid #1e3a50;
    padding: 0 10px; gap: 10px; overflow: hidden;
}
.ntpld-label {
    font-size: 0.68em; font-weight: 700; letter-spacing: 0.12em;
    color: #4a9eca; text-transform: uppercase; white-space: nowrap; flex-shrink: 0;
}
.ntpld-scroll {
    flex: 1; overflow: hidden; position: relative;
    mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
}
.ntpld-inner {
    display: inline-block; white-space: nowrap;
    font-size: 1.5em; color: #dce8f0;
    animation: ntpld-scroll 60s linear infinite;
}
.ntpld-inner .ntpld-entry { margin: 0 28px; }
.ntpld-inner .ntpld-type { color: #4a9eca; font-weight: 700; margin-right: 5px; }
.ntpld-inner .ntpld-sep { color: #2a4a64; margin: 0 16px; }
@keyframes ntpld-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* ── Footer ──────────────────────────────────────────────────────── */
.ftr {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 8px; border-top: 1px solid #2a3f52; flex-shrink: 0;
    font-size: 1.08em; color: #7f8c8d;
}
.ftr-left  { display: flex; gap: 14px; align-items: center; }
.ftr-right { display: flex; gap: 14px; align-items: center; }
.ftr-updated { color: #bdc3c7; }
.ftr-dot { width: 9px; height: 9px; border-radius: 50%; background: #7f8c8d; display: inline-block; flex-shrink: 0; }
.ftr-dot.fresh { background: #27ae60; box-shadow: 0 0 6px rgba(39,174,96,0.6); }
.ftr-dot.stale { background: #e67e22; }
.ftr-dot.down  { background: #e74c3c; }
.ftr-build  { font-size: 0.62em; color: #4a6a84; letter-spacing: 0.05em; }
.ftr-results { color: #4a6a84; font-size: 0.75em; text-decoration: none; }
.ftr-results:hover { color: #7f8c8d; }

/* ── No-data placeholder ─────────────────────────────────────────── */
.no-data-comp {
    font-size: 2em; font-weight: 800; color: #ecf0f1;
    text-align: center; padding: 32px 20px 4px; letter-spacing: 0.5px;
}
.no-data-msg {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; text-align: center; padding: 32px;
    color: #4a6a84;
}
.no-data-icon  { font-size: 3.6em; margin-bottom: 14px; }
.no-data-title { font-size: 1.5em; color: #ecf0f1; margin-bottom: 6px; font-weight: bold; }
.no-data-sub   { font-size: 1.1em; color: #7f8c8d; line-height: 1.5; white-space: pre-line; }
.no-data-err   { font-size: 1.05em; color: #e74c3c; margin-top: 8px; }

/* ── Grade leader strip ──────────────────────────────────────────── */
.grade-strip {
    flex-shrink: 0; display: none;
    background: rgba(0,0,0,0.2);
    border-bottom: 2px solid #2a3f52;
}
.grade-strip.visible { display: block; }
.grade-row {
    display: flex; align-items: center; gap: 0.45em;
    padding: 0.23em 0.73em;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.grade-row:last-child { border-bottom: none; }
.grade-label {
    font-size: 0.9em; font-weight: bold; letter-spacing: 1px;
    color: #4a6a84; width: 6em; flex-shrink: 0; text-transform: uppercase;
}
.grade-leaders-list { display: grid; grid-template-columns: repeat(3, 1fr); min-width: 0; overflow: hidden; align-items: center; }
.grade-item { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
.grade-medal-sm { font-size: 1.17em; flex-shrink: 0; }
.grade-name-sm  { font-size: 1.08em; color: #ecf0f1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grade-pts-sm   { font-size: 1.08em; font-weight: bold; color: #27ae60; flex-shrink: 0; white-space: nowrap; }

/* Grade badge in scrolling rows */
.grade-badge { display: inline-block; font-size: 0.52em; vertical-align: middle; margin-right: 4px; }

/* Scoreboard Stories tier colours */
@keyframes story-pulse-orange { 0%,100% { color: #e67e22; } 50% { color: #f39c12; opacity: 0.75; } }
@keyframes story-flash-gold   { 0%,100% { color: #f1c40f; } 45%,55% { color: #fff; } }
.story-name-gold   { animation: story-flash-gold   1.2s ease-in-out infinite; color: #f1c40f; }
.story-name-orange { animation: story-pulse-orange 2.5s ease-in-out infinite; color: #e67e22; }
.story-name-red    { color: #e74c3c; }
.story-name-blue   { color: #5dade2; }

/* ── Results 3-column layout ─────────────────────────────────────── */
.results-grade-panel {
    display: none; flex: 1.4; flex-direction: column; gap: 0.45em; min-height: 0; min-width: 0;
}
.main.results-mode .results-grade-panel { display: flex; }
.main.results-mode .lb-panel { flex: 1.4; }
.main.results-mode .grade-strip { display: none !important; }

.grade-card {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: #1e2f3e; border: 2px solid #4a6a84; border-radius: 12px; overflow: hidden;
}
.grade-card-hdr {
    background: rgba(0,0,0,0.4); padding: 7px 14px; flex-shrink: 0;
    font-size: 0.78em; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; color: #4a6a84;
}
.grade-card-body {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 8px 14px; gap: 10px;
}
.grade-podium-row   { display: flex; align-items: center; gap: 8px; }
.grade-podium-medal { font-size: 1.7em; flex-shrink: 0; line-height: 1; }
.grade-podium-name  { flex: 1; font-size: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.grade-podium-pts   { font-size: 1.65em; font-weight: bold; color: #27ae60; flex-shrink: 0; white-space: nowrap; }

/* ── Mobile / small screen responsive ───────────────────────────── */
@media (max-width: 900px) {
    /* Allow the page to scroll on mobile - TV keeps its 100vh lock */
    html, body { font-size: 16px; overflow-y: auto; height: auto; }
    #root { height: auto; min-height: 100vh; overflow: visible; padding: 10px 12px 8px; gap: 8px; }
    .main { overflow: visible; flex-direction: column; gap: 8px; }

    /* Mobile header: stack comp name on top centred, clock+date row below */
    .hdr { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .hdr-logo { display: none; }
    .hdr-center { text-align: center; width: 100%; }
    .hdr-comp { font-size: 1.45em; letter-spacing: 1px; }
    .hdr-right { display: flex; align-items: baseline; gap: 10px; justify-content: center; }
    .hdr-clock { font-size: 1.6em; font-weight: bold; color: #27ae60; }
    .hdr-date  { font-size: 0.75em; margin-top: 0; }

    .lb-panel { flex: none; height: 55vh; }

    /* Stack side panels vertically so names have full width */
    .side-panels { flex: none; flex-direction: column; height: auto; gap: 8px; }
    .side-card { flex: none; }
    /* Side panels: fixed height + hidden overflow so the auto-scroll animation works on mobile */
    .side-list { height: 260px; overflow: hidden; padding: 0; }
    .side-list-inner { padding: 8px 12px 6px; }

    /* Grade strip: hidden during live play, shown in results mode */
    .grade-strip { display: none; }
    .grade-strip.visible { display: block; }
    /* Results left-panel and layout adjustments not applicable on mobile */
    .main.results-mode .results-grade-panel { display: none !important; }
    .main.results-mode .lb-panel { flex: none; height: 55vh; }

    .col-hdr { grid-template-columns: 2.5em 1fr 5.5em 3em; }
    .lb-row  { grid-template-columns: 2.5em 1fr 5.5em 3em; padding: 6px 10px; }
    .lb-row .r-pts  { font-size: 1em; }

    .panel-title-bar { padding: 5px 10px; }
    .col-hdr { padding: 4px 10px; }
    .side-title-bar { padding: 5px 10px; font-size: 0.72em; }
    .story-row { padding: 8px 0; }
    .last-row  { padding: 8px 0; }

    /* Leaderboard: allow team names to wrap and reduce font size */
    .r-name { white-space: normal; overflow: visible; font-size: 1.15em; }

    .story-name  { font-size: 1.05em; }
    .story-title { font-size: 0.95em; }
    .story-detail { font-size: 0.8em; }
}

@media (max-width: 480px) {
    html, body { font-size: 13px; }
    .hdr-comp { font-size: 1.2em; }
    .hdr-clock { font-size: 1.35em; }
    .lb-panel { height: 52vh; }
    .side-list { height: 200px; }
    .ftr { font-size: 0.65em; }
}
</style>
</head>
<body>
<div id="root">

  <header class="hdr">
    <img class="hdr-logo"
         src="https://wwcc.com.au/cms/wp-content/themes/contemporary/assets/images/logo.png"
         alt="WWCC" onerror="this.style.display='none'">
    <div class="hdr-center">
      <div class="hdr-comp" id="hdr-comp">⛳ Live Golf Leaderboard</div>
      <div class="hdr-meta" id="hdr-meta">Wagga Wagga Country Club</div>
    </div>
    <div class="hdr-right">
      <div class="hdr-clock-row">
        <span class="live-badge loading" id="live-badge">Loading</span>
        <div class="hdr-clock" id="clock">--:-- --</div>
      </div>
      <div class="hdr-date"  id="date-str">---</div>
    </div>
  </header>

  <main class="main">

    <section class="results-grade-panel" id="results-grade-panel">
      <div class="grade-card" style="border-top:4px solid #f1c40f">
        <div class="grade-card-hdr">A Grade</div>
        <div class="grade-card-body" id="grade-card-a-body"></div>
      </div>
      <div class="grade-card" style="border-top:4px solid #bdc3c7">
        <div class="grade-card-hdr">B Grade</div>
        <div class="grade-card-body" id="grade-card-b-body"></div>
      </div>
      <div class="grade-card" style="border-top:4px solid #cd7f32">
        <div class="grade-card-hdr">C Grade</div>
        <div class="grade-card-body" id="grade-card-c-body"></div>
      </div>
    </section>

    <section class="lb-panel">
      <div class="col-hdr">
        <span class="col-hdr-rank">#</span>
        <span class="col-hdr-name">Player</span>
        <span class="col-hdr-pts" id="col-hdr-pts">Pts</span>
        <span class="col-hdr-thru">Thru</span>
      </div>
      <div class="grade-strip" id="grade-strip">
        <div class="grade-row">
          <span class="grade-label">A Grade</span>
          <div class="grade-leaders-list" id="grade-a"></div>
        </div>
        <div class="grade-row">
          <span class="grade-label">B Grade</span>
          <div class="grade-leaders-list" id="grade-b"></div>
        </div>
        <div class="grade-row">
          <span class="grade-label">C Grade</span>
          <div class="grade-leaders-list" id="grade-c"></div>
        </div>
      </div>
      <div class="lb-scroll-clip" id="lb-clip">
        <div id="lb-top3"></div>
        <div class="lb-rest-clip" id="lb-rest-clip">
          <div class="lb-scroll-inner" id="lb-inner">
            <div class="no-data-msg">
              <div class="no-data-icon">⛳</div>
              <div class="no-data-title">Loading leaderboard...</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="side-panels">
      <div class="side-card heater-card">
        <div class="side-title-bar">📖 Scoreboard Stories</div>
        <div class="side-list" id="heater-list">
          <div class="side-list-inner"><div class="no-data-msg"><div class="no-data-sub">Waiting...</div></div></div>
        </div>
      </div>
      <div class="side-card last-card" id="blue-ball-card" style="display:none">
        <div class="side-title-bar">🔵🔵 Blue Ball Contenders</div>
        <div class="side-list" id="last-list">
          <div class="side-list-inner"><div class="no-data-msg"><div class="no-data-sub">Waiting...</div></div></div>
        </div>
      </div>
    </aside>

  </main>

  <div class="ntpld-bar" id="ntpld-bar" style="display:none">
    <div class="ntpld-scroll">
      <span class="ntpld-inner" id="ntpld-inner"></span>
    </div>
  </div>

  <footer class="ftr">
    <div class="ftr-left">
      <span id="ftr-countdown">Fetching data...</span>
      <span class="ftr-build" id="ftr-build"></span>
    </div>
    <span id="ftr-status"></span>
    <div class="ftr-right">
      <span class="ftr-dot" id="ftr-dot" title="Data feed"></span>
      <span class="ftr-updated" id="ftr-updated">Not yet loaded</span>
      <a href="results.html" class="ftr-results">Past Results</a>
    </div>
  </footer>

</div>
<script>
const LB_URL      = new URLSearchParams(location.search).get('lb') || './out/live-leaderboard.json';

// TV size tweak: ?fs=1.2 makes everything 20% bigger, ?fs=0.85 smaller,
// or an absolute pixel base like ?fs=18. No param = auto-scale to screen.
(() => {
    const params = new URLSearchParams(location.search);
    const fs = parseFloat(params.get('fs'));
    if (fs > 0) {
        const size = fs < 4 ? `calc(clamp(11px, 1.85vh, 32px) * ${fs})` : `${fs}px`;
        document.documentElement.style.fontSize = size;
        document.body.style.fontSize = size;
    }
    // Overscan safe margin: ?edge=40 adds 40px each side (0 disables)
    const edge = parseFloat(params.get('edge'));
    if (!isNaN(edge)) document.documentElement.style.setProperty('--edge', edge + 'px');
})();
const REFRESH_SEC = 15;

let _countdown    = REFRESH_SEC;
let _hasData      = false;
let _animRunning  = false;
let _pendingData  = null;  // new data buffered until scroll cycle ends
let _lbAnimDurMs  = 0;    // current scroll cycle duration (ms)
let _forceTimer   = null; // fallback: force-apply if animationiteration is slow

let _pendingStories           = null;  // stories buffered until story scroll cycle ends
let _pendingStoriesSkipExpiry = false; // true when results mode: show all archive stories
let _storyForceTimer          = null;  // fallback timer for story panel
let _storyAnimDurMs           = 0;    // current story scroll cycle duration (ms)
let _lastStoryRenderTime      = 0;    // timestamp of last story render (for minimum-hold guard)
let _storyRotateOffset        = 0;    // rotating-window start into the mixed pool
let _storyMixedPool           = [];   // tier-interleaved, shuffled non-gold story pool
let _storyPoolSig             = '';   // signature of the story set the pool was built from
const STORY_PAUSE_MS          = 10000; // static hold before each scroll begins
const STORY_WINDOW            = 15;    // non-gold stories shown per scroll (below the pinned gold)

let _pendingComingLast    = null; // coming-last buffered until its scroll cycle ends
let _comingLastForceTimer = null; // fallback timer for coming-last panel
let _comingLastAnimDurMs  = 0;    // current coming-last scroll cycle duration (ms)

// Bump this whenever leaderboard.html changes. The poller reads it from this file
// and reports it as data.frontendVersion; a running page reloads (at a scroll
// boundary) only when the deployed version differs - so data commits never reload.
const FRONTEND_VERSION = '7.3';   // shown in the footer; bump by 0.1 each leaderboard.html change
let _loadedHash      = null;   // gitHash from first successful fetch (kept for footer only)
let _needsReload     = false;  // true when a NEWER frontend is deployed; reload at scroll-end
let _refreshStopped  = false;  // true once round is complete - no more fetches needed
let _awaitingOfficial = false; // everyone finished but official (PDF) results not in yet
let _stoppedForDate  = null;   // competition date when _refreshStopped was set
let _stoppedTick     = 0;      // counts 1-s ticks while stopped (for periodic date checks)
let _isStableford    = true;   // false for stroke/gross comps (lower score = better)
let _isAmbrose       = false;  // true for ambrose team events (board Total = absolute net strokes)
let _coursePar       = 72;    // course par from JSON; used to compute net total for display

// Last-render snapshots: used to keep panels scrolling after refresh stops
let _lastRenderData        = null;
let _lastStoriesData       = null;
let _lastStoriesSkipExpiry = false;
let _lastComingLastArgs    = null; // { comingLast, holeCount }

// True once the WWCC official results API confirms results are published.
// Results mode (3-column layout) only activates when this is true.
let _officialResultsReady = false;
let _ballWinners = new Set();
// PDF standings from official results: {grades: ["A","B","C"], players: [{pos,name,grade,score}]}
let _pdfStandings = { grades: [], players: [] };
// Cached surname→grade map built from pdfStandings; used in both renderLeaderboard and renderGradeStrip
let _pdfGradeMap = {};  // lower-case pdf name → "A"|"B"|"C"
let _pdfPosMap   = {};  // lower-case player name → official pdf position number

// Multi-board rotation: companions array + index-based cycle (primary=0, companions=1..N)
let _companions = [];   // companion board data objects from JSON (women's, 4BBB, etc.)
let _boardIdx   = 0;    // 0 = primary; 1..N = companions[0..N-1]

// ── Clock ─────────────────────────────────────────────────────────
function updateClock() {
    const syd = { timeZone: 'Australia/Sydney' };
    const clk = document.getElementById('clock');
    const dat = document.getElementById('date-str');
    if (clk) clk.textContent = new Date().toLocaleTimeString('en-AU', { ...syd, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
    if (dat) dat.textContent = new Date().toLocaleDateString('en-AU', { ...syd, weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
}

// ── Countdown ─────────────────────────────────────────────────────
function tickCountdown() {
    if (_refreshStopped) {
        // Even when stopped, check every 10 minutes for a new competition day.
        _stoppedTick++;
        if (_stoppedTick >= 600) {
            _stoppedTick = 0;
            fetchData();  // updateHeader will un-stop if d.date changed
        }
        return;
    }
    _countdown--;
    const el = document.getElementById('ftr-countdown');
    if (_countdown <= 0) {
        _countdown = REFRESH_SEC;
        // Keep polling for the PDF while awaiting official results, but say so.
        if (el) el.textContent = _awaitingOfficial ? 'Pending official results...' : 'Refreshing...';
        fetchData();
    } else {
        if (el) el.textContent = _awaitingOfficial
            ? 'Pending official results'
            : ('Next refresh in ' + _countdown + 's');
    }
}

// ── Fetch ─────────────────────────────────────────────────────────
async function fetchData() {
    try {
        const sep = LB_URL.includes('?') ? '&' : '?';
        const res = await fetch(LB_URL + sep + '_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        // Footer build tag: the running frontend version.
        const _bEl = document.getElementById('ftr-build');
        if (_bEl) _bEl.textContent = 'v' + FRONTEND_VERSION + ' · ' +
            window.innerWidth + '×' + window.innerHeight +
            (window.devicePixelRatio !== 1 ? ' @' + window.devicePixelRatio.toFixed(2) : '');

        // Store companion boards array; fall back to old single-companion field for compat.
        // 4BBB board is parked for now — add ?4bbb=1 to the URL to show it again.
        const show4bbb = new URLSearchParams(location.search).get('4bbb') === '1';
        _companions = (data.companions || (data.companion ? [data.companion] : []))
            .filter(c => show4bbb || !((c.competition || '').toLowerCase().includes('4bbb')));

        if (!_hasData) {
            // First successful load - render everything immediately
            _hasData = true;
            _loadedHash = data.gitHash || null;
            render(data);
        } else {
            // Reload ONLY when the frontend (leaderboard.html) itself changed - the
            // poller reports the deployed FRONTEND_VERSION; data commits don't change
            // it, so the board updates content in place without a full-screen reload.
            if (data.frontendVersion && data.frontendVersion !== FRONTEND_VERSION) {
                _needsReload = true;
            }
            // Buffer leaderboard rebuild until scroll completes full cycle -
            // users see every player before the list refreshes with new data.
            // Side panels update immediately so stories/header stay live.
            _pendingData = data;
            if (_animRunning) {
                // Scrolling - reset force-timer to one full cycle + buffer
                if (_forceTimer) clearTimeout(_forceTimer);
                _forceTimer = setTimeout(_applyPending, Math.max(60000, _lbAnimDurMs + 10000));
            } else if (!_forceTimer) {
                // Not scrolling (tiny field) - apply after short delay; don't reset if already counting
                _forceTimer = setTimeout(_applyPending, 10000);
            }
            updateHeader(data);
            setBlueBallVisible(data.date);
            const _ps = _pickStories(data); queueStories(_ps.stories, _ps.skipExpiry);
            queueComingLast(data.comingLast || [], data.holeCount || 18);
            setFooter(data.generatedAt, '');
        }
    } catch (e) {
        onFetchError(e.message);
    }
}

// Apply buffered leaderboard data at the natural scroll loop point (last player scrolls off).
// When refresh is stopped (round complete), fall back to last render data so the scroll loop
// keeps cycling without needing new data from the poller.
// Return a short display label for a companion board based on its comp name
function _companionLabel(c) {
    const name = (c.competition || '').toLowerCase();
    if (name.includes('4bbb'))                                return '4BBB';
    if (name.includes('ladies') || name.includes('women'))   return 'Women';
    return '';
}

function _applyPending() {
    _lastApplyTs = Date.now();
    if (_forceTimer) { clearTimeout(_forceTimer); _forceTimer = null; }
    if (_needsReload) { location.reload(); return; }

    // Rotate through primary + companion boards on each scroll cycle
    if (_companions.length > 0) {
        _boardIdx = (_boardIdx + 1) % (1 + _companions.length);
        if (_boardIdx > 0) {
            // Showing a companion board
            const c  = _companions[_boardIdx - 1];
            const hc = c.holeCount || 18;
            const lbl = _companionLabel(c);
            const meta = ['Wagga Wagga Country Club'];
            if (lbl) meta.push(lbl);
            const cType = c.type || ((c.competition || '').toLowerCase().includes('stableford') ? 'Stableford' : '');
            if (cType) meta.push(cType);
            if (hc)     meta.push(hc + ' holes');
            if (c.par)  meta.push('Par ' + c.par);
            if ((c.players || []).length) meta.push(c.players.length + ' players');
            _isStableford = c.isStableford !== false;
            _isAmbrose    = c.isAmbrose   === true;
            if (c.par) _coursePar = c.par;
            const ptsHdr = document.getElementById('col-hdr-pts');
            if (ptsHdr) ptsHdr.textContent = _isStableford ? 'Pts' : (_isAmbrose ? 'Net' : 'Score');
            renderLeaderboard(c.players || [], hc, c.started || false, c.competition || '');
            setHeader('⛳ ' + (c.competition || 'Leaderboard') + ' - Leaderboard', meta.join(' - '));
            // Show companion stories immediately; hide blue ball (men's-only feature)
            const cStories = c.stories || [];
            renderStories(cStories, false);
            _pendingStories = cStories; _pendingStoriesSkipExpiry = false;
            const bbCard = document.getElementById('blue-ball-card');
            if (bbCard) bbCard.style.display = 'none';
            return;
        }
    }

    // Primary board (_boardIdx == 0). Always fall back to the last rendered data
    // (not only when officially stopped) so the scroll keeps looping - otherwise a
    // finished-but-not-yet-official comp scrolls the field off once and never
    // repeats, leaving just the pinned top 3.
    const d = _pendingData || _lastRenderData;
    if (!d) return;
    if (_pendingData) { _lastRenderData = d; _pendingData = null; }
    _isStableford = d.isStableford !== false;
    _isAmbrose    = d.isAmbrose   === true;
    if (d.par) _coursePar = d.par;
    const ptsHdr2 = document.getElementById('col-hdr-pts');
    if (ptsHdr2) ptsHdr2.textContent = _isStableford ? 'Pts' : (_isAmbrose ? 'Net' : 'Score');
    renderLeaderboard(d.players || [], d.holeCount || 18, d.started || false, d.competition || '');
    // Header/stories/blue-ball only need "restoring" when we're rotating back from a
    // companion board. With no companions the leaderboard refresh must NOT re-render
    // the stories - they run on their own independent cycle. (Header stays current via
    // updateHeader() on each fetch; stories via their own loop.)
    if (_companions.length > 0) {
        const hcP = d.holeCount || 18;
        const metaP = ['Wagga Wagga Country Club', 'Men'];
        if (d.type) metaP.push(d.type);
        if (hcP)    metaP.push(hcP + ' holes');
        if (d.par)  metaP.push('Par ' + d.par);
        if ((d.players || []).length) metaP.push(d.players.length + ' players');
        setHeader('⛳ ' + (d.competition || 'Live Golf Leaderboard') + ' - Leaderboard', metaP.join(' - '));
        const ps = _pickStories(d);
        renderStories(ps.stories, ps.skipExpiry);
        _pendingStories = ps.stories; _pendingStoriesSkipExpiry = ps.skipExpiry;
        setBlueBallVisible(d.date);
    }
}
document.getElementById('lb-inner').addEventListener('animationend', () => setTimeout(_applyPending, 2000));

// Watchdog: rotation normally advances via animationend / force timers, but if
// those ever stall (e.g. a board that never scrolls, or a lost timer) the kiosk
// would freeze on one board forever - and even a deployed frontend update could
// not reload it. Recover automatically if nothing has applied for a while.
let _lastApplyTs = Date.now();
setInterval(() => {
    const idleMs = Date.now() - _lastApplyTs;
    if (_needsReload && idleMs > 120000) { location.reload(); return; }
    if (_hasData && idleMs > 180000) _applyPending();
}, 60000);

// Apply buffered stories at the natural story-scroll loop point.
// Guards against applying before a full scroll cycle has passed - so viewers
// always see the complete list before it resets.
function _applyPendingStories() {
    if (_storyForceTimer) { clearTimeout(_storyForceTimer); _storyForceTimer = null; }
    // Use pending data, or fall back to last rendered data to keep the loop alive when stopped
    // Always fall back to the last rendered set (not only when stopped) so the reel
    // keeps looping and rotating every cycle, independent of when new data arrives.
    const hasPending = _pendingStories !== null;
    const s    = hasPending ? _pendingStories          : _lastStoriesData;
    const skip = hasPending ? _pendingStoriesSkipExpiry : _lastStoriesSkipExpiry;
    if (s === null || s === undefined) return;
    // Hold for at least one full animation cycle so all stories are seen.
    const minHold = Math.max(25000, _storyAnimDurMs);
    const elapsed = Date.now() - _lastStoryRenderTime;
    if (elapsed < minHold) {
        _storyForceTimer = setTimeout(_applyPendingStories, minHold - elapsed + 500);
        return;
    }
    if (hasPending) { _pendingStories = null; _pendingStoriesSkipExpiry = false; }
    renderStories(s, skip);
}

// Queue new stories; apply at next animationend (or force after 2 full cycles)
function queueStories(stories, skipExpiry) {
    _pendingStories           = stories;
    _pendingStoriesSkipExpiry = skipExpiry || false;
    if (_storyAnimDurMs > 0) {
        // Animation running - reset force-timer
        if (_storyForceTimer) clearTimeout(_storyForceTimer);
        _storyForceTimer = setTimeout(_applyPendingStories, Math.max(30000, _storyAnimDurMs * 2));
    } else if (!_storyForceTimer) {
        // Not animating (< minForScroll stories) - apply after short delay; don't reset if already counting
        _storyForceTimer = setTimeout(_applyPendingStories, 5000);
    }
}

// Attach animationend listeners to both side panels (elements exist in HTML at load)
(function () {
    const heater = document.querySelector('#heater-list .side-list-inner');
    // Loop promptly into the next cycle - the 10s pause lives at the START of each
    // scroll now, so no long dead gap is needed after the list scrolls off.
    if (heater) heater.addEventListener('animationend', () => setTimeout(_applyPendingStories, 400));
    const last = document.querySelector('#last-list .side-list-inner');
    if (last) last.addEventListener('animationend', () => setTimeout(_applyPendingComingLast, 5000));
})();

// Pick which stories list to display: archive (all day) when round complete, live otherwise
function _pickStories(d) {
    const players = d.players || [];
    const hc      = d.holeCount || 18;
    const active  = players.filter(p => p.thru > 0);
    const allDone = active.length > 0 && active.every(p => p.thru >= hc);
    return { stories: allDone ? (d.storiesArchive || d.stories || []) : (d.stories || []), skipExpiry: allDone };
}

// ── Full render (first load) ──────────────────────────────────────
function render(d) {
    if (d.status === 'no board') {
        setBadge('waiting', 'No comp today');
        setHeader('⛳ Live Golf Leaderboard', 'Wagga Wagga Country Club - no competition found for today');
        showNoData('lb-inner', '📋', 'No competition today', 'The poller found no active leaderboard.');
        showSideEmpty('heater-list', '-');
        showSideEmpty('last-list', '-');
        setBlueBallVisible(null);
        setFooter(d.generatedAt, '');
        return;
    }
    if (d.status === 'error') {
        setBadge('offline', 'Poller error');
        setBlueBallVisible(null);
        setFooter(d.generatedAt, d.error || 'Unknown error');
        return;
    }

    _lastRenderData = d;

    // When today's competition hasn't started yet and official results from the previous
    // comp are available (saved by the poller), show those results while we wait.
    const lr = (!d.started && d.lastResults && d.lastResults.officialResultsReady) ? d.lastResults : null;
    if (lr) {
        _isStableford        = lr.isStableford !== false;
        _isAmbrose           = lr.isAmbrose === true;
        _officialResultsReady = true;
        _ballWinners         = new Set(lr.ballWinners || []);
        _pdfStandings        = lr.pdfStandings || { grades: [], players: [] };
        _pdfGradeMap = {};
        _pdfPosMap   = {};
        for (const pp of (_pdfStandings.players || [])) {
            if (pp.name && pp.grade) _pdfGradeMap[pp.name.toLowerCase()] = pp.grade.toUpperCase();
            if (pp.name && !pp.name.includes(',') && pp.pos) _pdfPosMap[pp.name.toLowerCase()] = pp.pos;
        }
        const ptsHdrLr = document.getElementById('col-hdr-pts');
        if (ptsHdrLr) ptsHdrLr.textContent = _isStableford ? 'Pts' : (_isAmbrose ? 'Net' : 'Score');
        setBadge('results', 'Results');
        setHeader('⛳ ' + lr.competition + ' - Official Results',
                  'Wagga Wagga Country Club - ' + (d.competition || 'next comp') + ' not yet started');
        setBlueBallVisible(lr.date);
        renderLeaderboard(lr.players || [], lr.holeCount || 18, true, lr.competition || '');
        renderInfoTicker(lr);
        setFooter(d.generatedAt, '');
        return;
    }

    updateHeader(d);
    setFooter(d.generatedAt, '');
    setBlueBallVisible(d.date);
    renderLeaderboard(d.players || [], d.holeCount || 18, d.started || false, d.competition || '');
    const _ps0 = _pickStories(d); renderStories(_ps0.stories, _ps0.skipExpiry);
    renderComingLast(d.comingLast || [], d.holeCount || 18);
}

// Top info marquee - live items: field progress, leader (+margin), today's
// weather, and the day's headline story. NTP/LD is deliberately NOT here (it's
// PDF-only / post-comp; it lives on the Past Results page).
function renderInfoTicker(d) {
    const bar   = document.getElementById('ntpld-bar');
    const inner = document.getElementById('ntpld-inner');
    if (!bar || !inner) return;
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const items = [];
    const players = d.players || [];
    const hc = d.holeCount || 18;
    const active = players.filter(p => p.thru > 0);

    if (active.length) {
        const fin = active.filter(p => p.thru >= hc).length;
        items.push({ t: 'Field', v: fin >= active.length
            ? ('All ' + active.length + ' finished')
            : (fin + ' of ' + active.length + ' finished') });
    }
    const lead = (d.leaders && d.leaders[0]) || players[0];
    if (lead && lead.points != null && lead.thru > 0) {
        let v = stripHcp(lead.player) + ' ' + fmtScore(lead.points) + (_isStableford ? 'pts' : '');
        const second = (d.leaders && d.leaders[1]) || players[1];
        if (_isStableford && second && second.points != null) {
            const m = lead.points - second.points;
            v += m > 0 ? (' (by ' + m + ')') : ' (tied)';
        }
        items.push({ t: 'Leader', v: v });
    }
    const w = d.weather;
    if (w && w.tMax != null) {
        let v = Math.round(w.tMax) + '°C';
        if (w.windDir && w.windMax != null) v += ' · ' + w.windDir + ' to ' + Math.round(w.windMax) + ' km/h';
        if (w.humidity != null) v += ' · ' + Math.round(w.humidity) + '% hum';
        if (w.rain) v += ' · ' + w.rain + 'mm';
        items.push({ t: 'Today', v: v });
    }
    const gold = (d.stories || []).find(s => s.tier === 'gold' && s.player &&
        s.player.indexOf(' & ') === -1 && !s.player.startsWith('Hole ') &&
        ['Today', 'The Board', 'The Field'].indexOf(s.player) === -1);
    if (gold) items.push({ t: gold.title, v: stripHcp(gold.player) });

    // NTP / Longest Drive prizes - only present once official results reveal, so
    // the ticker naturally switches to the prize winners after a comp.
    (d.ntpLd || []).forEach(e => {
        if (!e.winner) return;
        const nm = String(e.winner).trim();
        if (nm.split(/\s+/).filter(w => w.length >= 2).length < 2) return;   // skip label rows
        const label = (e.type === 'ld' ? 'Longest Drive' : 'NTP') + (e.hole ? ' Hole ' + e.hole : '');
        items.push({ t: label, v: nm + (e.distance ? ' - ' + e.distance : '') });
    });

    if (!items.length) { bar.style.display = 'none'; return; }
    const html = items.map(it =>
        '<span class="ntpld-entry"><span class="ntpld-type">' + esc(it.t) + '</span>' + esc(it.v) + '</span>'
    ).join('<span class="ntpld-sep">|</span>');
    const sep = '<span class="ntpld-sep">|</span>';
    inner.innerHTML = html + sep + html;   // double for seamless looping scroll
    bar.style.display = 'flex';
}

function updateHeader(d) {
    const started = d.started || false;
    const players = d.players || [];
    const hc      = d.holeCount || 18;

    const meta = ['Wagga Wagga Country Club'];
    if (_companions.length > 0) meta.push('Men');   // gender label only when multi-board mode is active
    // Type label: use explicit type, or infer from competition name
    const typeLabel = d.type || ((d.competition || '').toLowerCase().includes('stableford') ? 'Stableford' : '');
    if (typeLabel) meta.push(typeLabel);
    if (hc)     meta.push(hc + ' holes');
    if (d.par)  meta.push('Par ' + d.par);
    if (players.length) {
        // Detect team events: team entries have hcp=null and names joined with " & "
        const first = players[0];
        const teamSize = (first && first.hcp == null && first.player && first.player.includes(' & '))
            ? first.player.split(' & ').length : 1;
        if (teamSize > 1) {
            meta.push(players.length + ' teams (' + (players.length * teamSize) + ' players)');
        } else {
            meta.push(players.length + ' players');
        }
    }
    // Only update title when showing the primary (men's) board - companion updates its own title
    if (_boardIdx === 0) {
        setHeader('⛳ ' + (d.competition || 'Live Golf Leaderboard') + ' - Leaderboard', meta.join(' - '));
    }
    // Un-stop when a new competition day is detected (overnight auto-reset)
    if (_refreshStopped && d.date && d.date !== _stoppedForDate) {
        _refreshStopped = false;
        _stoppedTick    = 0;
        _countdown      = REFRESH_SEC;
    }
    _isStableford = d.isStableford !== false;  // default true; false only for stroke/gross
    _isAmbrose    = d.isAmbrose   === true;
    if (d.par) _coursePar = d.par;
    const ptsHdr = document.getElementById('col-hdr-pts');
    if (ptsHdr) ptsHdr.textContent = _isStableford ? 'Pts' : (_isAmbrose ? 'Net' : 'Score');
    _awaitingOfficial = false;
    if (!started || !players.length) {
        setBadge('waiting', 'Not started');
    } else {
        const active = players.filter(p => p.thru > 0);
        const allDone = active.length > 0 && active.filter(p => p.thru >= hc).length / active.length >= 0.95;
        const official = d.officialResultsReady || false;
        _officialResultsReady = official;
        _awaitingOfficial = allDone && !official;
        if (d.ballWinners && d.ballWinners.length) _ballWinners = new Set(d.ballWinners);
        if (d.pdfStandings) {
            _pdfStandings = d.pdfStandings;
            _pdfGradeMap = {};
            _pdfPosMap   = {};
            for (const pp of (_pdfStandings.players || [])) {
                if (pp.name && pp.grade) _pdfGradeMap[pp.name.toLowerCase()] = pp.grade.toUpperCase();
                if (pp.name && !pp.name.includes(',') && pp.pos) {
                    _pdfPosMap[pp.name.toLowerCase()] = pp.pos;
                }
            }
        }
        const showResults = allDone && official;
        setBadge(showResults ? 'results' : 'live', showResults ? 'Results' : 'Live');
        if (allDone && official && !_refreshStopped) {
            _refreshStopped  = true;
            _stoppedForDate  = d.date || null;
            const el = document.getElementById('ftr-countdown');
            if (el) el.textContent = 'Official results in';
        }
    }
    renderInfoTicker(d);
}

// ── Grade helpers ─────────────────────────────────────────────────
// Grades are dynamic: sort all players by HCP, split into thirds.
// A Grade = lowest third, B Grade = middle third, C Grade = top third.
function computeGrades(players) {
    const withHcp = players.filter(p => p.hcp != null).sort((a, b) => a.hcp - b.hcp);
    const n = withHcp.length;
    if (n < 3) return null;
    const aEnd = Math.floor(n / 3);
    const bEnd = Math.floor(n * 2 / 3);
    // If the boundary HCP is shared by the next player, push the whole tie group
    // into the higher grade so no handicap value straddles a grade boundary.
    // This matches MiClub's official grade calculation.
    function boundaryHcp(idx) {
        const hcp = withHcp[idx].hcp;
        if (idx + 1 < n && withHcp[idx + 1].hcp === hcp) {
            // Walk back to find the highest HCP that is strictly below the tie group
            let i = idx - 1;
            while (i >= 0 && withHcp[i].hcp === hcp) i--;
            return i >= 0 ? withHcp[i].hcp : hcp - 1;
        }
        return hcp;
    }
    return { aMax: boundaryHcp(aEnd - 1), bMax: boundaryHcp(bEnd - 1) };
}

// Return PDF-assigned grade for a player, or null if not found.
// PDF map keys are "lastname, firstname" (from grade prize sections).
// Player names from live board are "Firstname Lastname".
function lookupPdfGrade(playerName) {
    if (!Object.keys(_pdfGradeMap).length) return null;
    const key = (playerName || '').toLowerCase();
    if (_pdfGradeMap[key]) return _pdfGradeMap[key];
    // Derive surname and first initial for disambiguation when two players share a surname
    const parts = key.split(' ').filter(Boolean);
    const surname = parts[parts.length - 1] || '';
    const initial = parts[0] ? parts[0][0] : '';
    for (const [pdfName, pdfGrade] of Object.entries(_pdfGradeMap)) {
        if (!pdfName.includes(surname)) continue;
        // pdfName is "lastname, firstname" — extract first initial after the comma
        const commaIdx = pdfName.indexOf(',');
        const pdfFirst = commaIdx >= 0 ? pdfName.slice(commaIdx + 1).trimStart() : '';
        const pdfInitial = pdfFirst ? pdfFirst[0] : '';
        if (!initial || !pdfInitial || pdfInitial === initial) return pdfGrade;
    }
    return null;
}

function getGrade(hcp, grades) {
    if (hcp == null || !grades) return null;
    if (hcp <= grades.aMax) return 'A';
    if (hcp <= grades.bMax) return 'B';
    return 'C';
}

// Countback comparator: returns <0 if a beats b, >0 if b beats a, 0 if tied.
// Uses GA method: back 9 -> back 6 -> back 3 -> last hole -> second-last ...
// Only applies when both players have finished (thru >= holeCount).
// dir = 1 for stableford (higher wins), -1 for stroke (lower wins).
function countbackCompare(a, b, holeCount, dir) {
    if (dir === undefined) dir = _isStableford ? 1 : -1;
    const aFin = a.thru >= holeCount;
    const bFin = b.thru >= holeCount;
    if (!aFin && !bFin) return 0;
    if (!aFin) return 1;  // unfinished loses to finished
    if (!bFin) return -1;
    const ah = a.holes || [];
    const bh = b.holes || [];
    const sliceSum = (arr, n) => arr.slice(-n).reduce((s, h) => s + (h.points || 0), 0);
    for (const n of [9, 6, 3]) {
        const d = dir * (sliceSum(bh, n) - sliceSum(ah, n));
        if (d !== 0) return d;
    }
    for (let i = ah.length - 1; i >= 0; i--) {
        const d = dir * (((bh[i] || {}).points || 0) - ((ah[i] || {}).points || 0));
        if (d !== 0) return d;
    }
    return 0;
}

function fmtHcp(hcp) {
    if (hcp == null) return '';
    return hcp % 1 === 0 ? hcp.toString() : hcp.toFixed(1);
}

function fmtScore(pts) {
    if (!_isStableford) {
        if (_isAmbrose) {
            // Ambrose: absolute net strokes (e.g. 28.25) - show with 2 decimal max
            return pts % 1 === 0 ? pts.toString() : pts.toFixed(2).replace(/\.?0+$/, '');
        }
        if (pts === 0) return 'E';
        return (pts > 0 ? '+' : '') + pts;
    }
    return pts;
}

function renderGradeStrip(activeSorted, grades, holeCount, competition, roundComplete, officialResultsReady) {
    const strip  = document.getElementById('grade-strip');
    const panel  = document.getElementById('results-grade-panel');
    const mainEl = document.querySelector('.main');

    function exitResults() {
        if (strip)  strip.classList.remove('visible');
        if (panel)  panel.style.display = 'none';
        if (mainEl) mainEl.classList.remove('results-mode');
    }

    if ((competition || '').toUpperCase().includes('4BBB')) { exitResults(); return; }
    if (!activeSorted.length) { exitResults(); return; }
    if (!roundComplete) { exitResults(); return; }
    if (!officialResultsReady) { exitResults(); return; }

    // Detect grade count from PDF (authoritative); fall back by comp type if PDF has no grades.
    // Women's/Ladies comps use 2 grades (A/B); Men's comps use 3 (A/B/C).
    const pdfGrades = (_pdfStandings.grades || []).filter(g => 'ABCD'.includes(g));
    const isWomens = /women|ladies/i.test(competition || '');
    const gradeCount = pdfGrades.length >= 2 ? pdfGrades.length : (isWomens ? 2 : 3);
    const gradeKeys = gradeCount >= 3 ? ['A', 'B', 'C'] : ['A', 'B'];

    // Need at least 3 players per grade; skip if too few
    if (activeSorted.length < gradeKeys.length * 3) { exitResults(); return; }

    // For 2-grade comps, compute a half-split boundary; for 3-grade use the thirds boundary.
    let effectiveGrades = grades;  // { aMax, bMax } from computeGrades (thirds)
    if (gradeCount < 3) {
        const withHcp = activeSorted.filter(p => p.hcp != null).sort((a, b) => a.hcp - b.hcp);
        const n = withHcp.length;
        const half = Math.floor(n / 2);
        effectiveGrades = { aMax: (half > 0 ? withHcp[half - 1].hcp : 999), bMax: 999 };
    }
    if (!effectiveGrades) { exitResults(); return; }

    // Grade assignment: PDF winners override dynamic split; everyone else uses HCP boundary
    function getPlayerGrade(p) {
        const pdf = lookupPdfGrade(p.player);
        if (pdf) return pdf;
        if (p.hcp == null) return null;
        if (p.hcp <= effectiveGrades.aMax) return 'A';
        if (p.hcp <= effectiveGrades.bMax) return 'B';
        return gradeCount >= 3 ? 'C' : 'B';
    }

    const gradeAll = {};
    gradeKeys.forEach(k => gradeAll[k] = []);
    for (const p of activeSorted) {
        const g = getPlayerGrade(p);
        if (g && gradeAll[g]) gradeAll[g].push(p);
    }

    // Require at least 2 grades to have players
    const gradesWithPlayers = Object.values(gradeAll).filter(arr => arr.length > 0).length;
    if (gradesWithPlayers < 2) { exitResults(); return; }

    // Sort each grade: best score first (higher for stableford, lower for stroke)
    const scoreDir = _isStableford ? 1 : -1;
    gradeKeys.forEach(gk => {
        gradeAll[gk].sort((a, b) => {
            if (b.points !== a.points) return scoreDir * (b.points - a.points);
            const cb = countbackCompare(a, b, holeCount);
            return cb !== 0 ? cb : a.player.localeCompare(b.player);
        });
    });

    const medals = ['🥇', '🥈', '🥉'];

    function cbHtml(all, top, i, hc) {
        const nextPts = (all[i + 1] || {}).points;
        const used = (top[i].points === nextPts || (i > 0 && top[i].points === top[i - 1].points))
            && top[i].thru >= hc;
        return used ? '<sup style="font-size:0.55em;color:#f39c12;vertical-align:super">CB</sup>' : '';
    }

    // Show/hide C grade elements based on grade count
    const cRow = document.getElementById('grade-c')?.closest('.grade-row');
    if (cRow) cRow.style.display = gradeCount >= 3 ? '' : 'none';
    const cCard = document.getElementById('grade-card-c-body')?.closest('.grade-card');
    if (cCard) cCard.style.display = gradeCount >= 3 ? '' : 'none';

    // Compact grade strip (inside leaderboard - hidden in results mode by CSS, kept for live use)
    gradeKeys.forEach(gk => {
        const el = document.getElementById('grade-' + gk.toLowerCase());
        if (!el) return;
        const all = gradeAll[gk];
        if (!all.length) { el.innerHTML = '<span style="color:#4a6a84;font-size:0.7em">-</span>'; return; }
        const top = all.slice(0, 3);
        el.innerHTML = top.map((p, i) =>
            '<div class="grade-item">' +
                '<span class="grade-medal-sm">' + medals[i] + cbHtml(all, top, i, holeCount) + '</span>' +
                '<span class="grade-name-sm">' + esc(p.player.trim()) + '</span>' +
                '<span class="grade-pts-sm">&nbsp;' + fmtScore(p.points) + (_isStableford ? 'pts' : '') + '</span>' +
            '</div>'
        ).join('');
    });

    // Expanded grade cards (left results panel)
    gradeKeys.forEach(gk => {
        const body = document.getElementById('grade-card-' + gk.toLowerCase() + '-body');
        if (!body) return;
        const all = gradeAll[gk];
        if (!all.length) { body.innerHTML = '<div style="color:#4a6a84;text-align:center">-</div>'; return; }
        const top = all.slice(0, 3);
        body.innerHTML = top.map((p, i) =>
            '<div class="grade-podium-row">' +
                '<span class="grade-podium-medal">' + medals[i] + cbHtml(all, top, i, holeCount) + '</span>' +
                '<span class="grade-podium-name">' + esc(p.player.trim()) + '</span>' +
                '<span class="grade-podium-pts">' + fmtScore(p.points) + (_isStableford ? 'pts' : '') + '</span>' +
            '</div>'
        ).join('');
    });

    if (strip)  strip.classList.add('visible');
    if (panel)  panel.style.display = 'flex';
    if (mainEl) mainEl.classList.add('results-mode');
}

// ── Leaderboard ───────────────────────────────────────────────────
function renderLeaderboard(players, holeCount, started, competition) {
    const clip     = document.getElementById('lb-clip');
    const top3El   = document.getElementById('lb-top3');
    const restClip = document.getElementById('lb-rest-clip');
    const inner    = document.getElementById('lb-inner');
    if (!inner) return;

    // Only show players who have actually teed off
    const active = players.filter(p => p.thru > 0);

    // Round is "complete" when 95%+ of active players have finished (tolerates NR/WD),
    // OR when official results are published (PDF gate = the true source of truth).
    const finishedCount = active.filter(p => p.thru >= holeCount).length;
    const roundComplete = _officialResultsReady ||
        (active.length > 0 && finishedCount / active.length >= 0.95);

    // Sort by score: best first (higher for stableford, lower for stroke/gross)
    const scoreDir = _isStableford ? 1 : -1;
    if (_officialResultsReady && Object.keys(_pdfPosMap).length) {
        // Points are always the primary sort so the board reads top-to-bottom by
        // score. The official PDF position is used only to break ties between
        // players on equal points - it carries the club's official countback order
        // (some result PDFs list players by playing group, not by rank, so PDF
        // position must NOT drive the overall order).
        active.sort((a, b) => {
            if (b.points !== a.points) return scoreDir * (b.points - a.points);
            const pa = _pdfPosMap[(a.player || '').toLowerCase()] || 999;
            const pb = _pdfPosMap[(b.player || '').toLowerCase()] || 999;
            if (pa !== pb) return pa - pb;
            const cb = countbackCompare(a, b, holeCount);
            return cb !== 0 ? cb : a.player.localeCompare(b.player);
        });
    } else {
        active.sort((a, b) => {
            if (b.points !== a.points) return scoreDir * (b.points - a.points);
            const cb = countbackCompare(a, b, holeCount);
            return cb !== 0 ? cb : a.player.localeCompare(b.player);
        });
    }

    // Flag every position where countback broke a tie (tied pts with a finished neighbour)
    const cbFlags = active.map((p, i) => {
        if (p.thru < holeCount) return false;
        const prev = active[i - 1];
        const next = active[i + 1];
        return (prev && prev.points === p.points && prev.thru >= holeCount) ||
               (next && next.points === p.points && next.thru >= holeCount);
    });

    // Grade calculations (use full field for boundaries, active for grade strip leaders)
    const grades = computeGrades(players);

    // Build grade-sorted lists for ball marker logic (top-3 per grade = prize positions)
    // Use PDF grade assignments where available (overrides dynamic thirds).
    const scoreDir2 = _isStableford ? 1 : -1;
    const _gradeTopN = {};
    if (grades && roundComplete && _officialResultsReady) {
        const _ga = { A: [], B: [], C: [] };
        for (const p of active) {
            const g = lookupPdfGrade(p.player) || getGrade(p.hcp, grades);
            if (g && _ga[g]) _ga[g].push(p);
        }
        ['A', 'B', 'C'].forEach(gk => {
            _ga[gk].sort((a, b) => {
                if (b.points !== a.points) return scoreDir2 * (b.points - a.points);
                return countbackCompare(a, b, holeCount) || a.player.localeCompare(b.player);
            });
            _ga[gk].slice(0, 3).forEach(p => { _gradeTopN[p.player] = true; });
        });
    }

    if (!active.length) {
        if (top3El) top3El.innerHTML = '';
        inner.classList.remove('scrolling');
        const compLine = competition ? '<div class="no-data-comp">' + esc(competition) + '</div>' : '';
        inner.innerHTML = started
            ? compLine + '<div class="no-data-msg"><div class="no-data-icon">⛳</div><div class="no-data-title">No scores yet</div><div class="no-data-sub">Players are on their way to the first tee</div></div>'
            : compLine + '<div class="no-data-msg"><div class="no-data-icon">⛳</div><div class="no-data-title">Competition starting soon</div><div class="no-data-sub">Scores will appear here when play begins</div></div>';
        _animRunning = false;
        return;
    }

    function buildRow(p, idx, usedCB) {
        p = { ...p, liveRank: idx + 1 };
        const rank = p.liveRank || 0;
        let rankHtml, rankCls = 'r-rank';
        const cbMark = usedCB ? '<sup style="font-size:0.5em;color:#f39c12;vertical-align:super;font-weight:normal">CB</sup>' : '';
        if      (rank === 1 && roundComplete) { rankHtml = '🥇' + cbMark; rankCls += ' gold'; }
        else if (rank === 2 && roundComplete) { rankHtml = '🥈' + cbMark; rankCls += ' silver'; }
        else if (rank === 3 && roundComplete) { rankHtml = '🥉' + cbMark; rankCls += ' bronze'; }
        else                                { rankHtml = rank + cbMark; }
        const thruTxt = p.thru === 0 ? '-' : p.thru >= holeCount ? 'F' : p.thru;
        const thruCls = p.thru >= holeCount ? 'r-thru fin' : 'r-thru';
        // Ambrose scores are absolute net strokes - no vs-par gross tag needed
        const grossTag = (!_isStableford && !_isAmbrose && p.thru >= holeCount && _coursePar)
            ? '<span class="r-gross">(' + (_coursePar + p.points) + ')</span> ' : '';
        const ptsTxt  = (p.thru > 0 && started) ? grossTag + fmtScore(p.points) : '-';
        const ptsCls  = (p.thru > 0 && started) ? 'r-pts' : 'r-pts dim';
        const rowCls  = rank <= 3 ? 'lb-row top3' : 'lb-row';
        const isTeam  = p.player && p.player.indexOf(' & ') !== -1;
        // For ambrose: strip the embedded handicap token from the name and show it on a
        // separate line as "Combined Handicap [X]" so the player list reads cleanly.
        let escapedName;
        if (_isAmbrose && isTeam) {
            const raw = p.player || '';
            const cleanName = esc(raw.replace(/\s*\[(\+?\d+(?:\.\d+)?)\]/g, ''));
            // Prefer server-computed allowance (sum of all indiv hcps / n*2).
            // Fall back to the single bracket MiClub shows on the board (captain's hcp).
            let hcpVal = null;
            if (p.ambroseTeamHcp != null) {
                hcpVal = parseFloat(p.ambroseTeamHcp).toFixed(2);
            } else {
                const m = raw.match(/\[(\+?\d+(?:\.\d+)?)\]/);
                if (m) hcpVal = parseFloat(m[1]).toFixed(2);
            }
            escapedName = cleanName + (hcpVal
                ? '<span class="r-hcp-team">Combined Handicap [' + hcpVal + ']</span>'
                : '');
        } else {
            // Style embedded [N] handicap tokens (used for team names like "A [27] & B [10]")
            escapedName = esc(p.player).replace(/\[(\+?\d+(?:\.\d+)?)\]/g,
                '<span class="r-hcp-token">[$1]</span>');
        }
        const hcpTag = p.hcp != null ? ' <span class="r-hcp-inline">[' + fmtHcp(p.hcp) + ']</span>' : '';
        // PDF ball winners (from "1 Ball" column) are authoritative when available.
        // Fall back to top-3 per grade only when no PDF ball data has loaded.
        const isBallWinner = _ballWinners.size > 0
            ? _ballWinners.has(p.player)
            : (roundComplete && _officialResultsReady && !!_gradeTopN[p.player]);
        const ballTag = isBallWinner ? ' <span class="ball-win">&#x26AA;</span>' : '';
        const nameCls = 'r-name' + (isTeam ? ' team' : '');
        return '<div class="' + rowCls + '">' +
            '<span class="' + rankCls + '">' + rankHtml + '</span>' +
            '<span class="' + nameCls + '">' + escapedName + hcpTag + ballTag + '</span>' +
            '<span class="' + ptsCls + '">' + ptsTxt + '</span>' +
            '<span class="' + thruCls + '">' + thruTxt + '</span>' +
            '</div>';
    }

    // Pin the top 3 during live play so the podium stays static while positions 4+
    // scroll below them. In RESULTS mode only, the top places are already shown in
    // the grade-winners strip, so unpin the podium and let the whole field scroll
    // together. Live scroll behaviour is unchanged.
    let top3Html, restHtml, scrollCount;
    if (_officialResultsReady) {
        top3Html  = '';
        restHtml  = active.map((p, i) => buildRow(p, i, cbFlags[i])).join('') +
                    (active.length ? '<div class="lb-gap"></div>' : '');
        scrollCount = active.length;
    } else {
        const podium = active.slice(0, 3);
        const field  = active.slice(3);
        top3Html  = podium.map((p, i) => buildRow(p, i, cbFlags[i])).join('');
        restHtml  = field.map((p, i) => buildRow(p, i + 3, cbFlags[i + 3])).join('') +
                    (field.length ? '<div class="lb-gap"></div>' : '');
        scrollCount = field.length;
    }

    // Fade out briefly, rebuild DOM, restart animation, fade in
    if (clip) clip.style.opacity = '0';
    setTimeout(() => {
        // Pinned podium — hidden when round is complete (all players scroll together)
        if (top3El) {
            top3El.innerHTML = top3Html;
            top3El.style.display = top3Html ? '' : 'none';
        }

        // Scrolling field (positions 4+ mid-round; all players when complete)
        inner.classList.remove('scrolling');
        inner.innerHTML = restHtml;
        void inner.offsetHeight;

        const clipH = restClip ? restClip.clientHeight : window.innerHeight;

        if (scrollCount && inner.scrollHeight > clipH) {
            // single copy — translateY(-100%) scrolls full content off; animationend fires once
            // Speed: 50px/s, minimum 20s - proportional to scroll distance so all fields
            // feel similar pace regardless of field size.
            const dur = Math.max(20, Math.ceil(inner.scrollHeight / 50));
            const scrollDelay = 3;
            inner.style.animationDuration = dur + 's';
            inner.style.animationDelay = scrollDelay + 's';
            inner.classList.add('scrolling');
            _animRunning = true;
            _lbAnimDurMs = (dur + scrollDelay) * 1000;
        } else {
            _animRunning = false;
        }
        if (clip) clip.style.opacity = '1';
        renderGradeStrip(active, grades, holeCount, competition, roundComplete, _officialResultsReady);
    }, 250);
}

// ── Side panels ───────────────────────────────────────────────────
function setBlueBallVisible(dateStr) {
    const card = document.getElementById('blue-ball-card');
    if (!card) return;
    // Blue ball only shows on Men's primary board (Wed/Sat) - never on companion boards
    if (_boardIdx > 0) { card.style.display = 'none'; return; }
    const day = dateStr ? new Date(dateStr + 'T12:00:00').getDay() : -1;
    card.style.display = (day === 3 || day === 6) ? '' : 'none';
}

function renderSidePanel(containerId, rows, emptyMsg, minForScroll, preDelayMs) {
    const el = document.getElementById(containerId);
    if (!el) return 0;
    let inner = el.querySelector('.side-list-inner');
    if (!inner) {
        inner = document.createElement('div');
        inner.className = 'side-list-inner';
        el.innerHTML = '';
        el.appendChild(inner);
    }
    // Gentle fade on each content swap so the refresh/reset doesn't hard-flash.
    // Single exit (opacity always ends at 1) so the panel can never be left blank.
    el.style.transition = 'opacity 0.3s ease';
    el.style.opacity = '0';
    let ret = 0;
    if (!rows.length) {
        inner.classList.remove('scrolling');
        inner.style.animationDelay = '0s';
        inner.innerHTML = '<div class="no-data-msg"><div class="no-data-sub">' + esc(emptyMsg) + '</div></div>';
    } else {
        inner.classList.remove('scrolling');
        inner.innerHTML = rows.join(''); // single copy — translateY(-100%) scrolls full content off
        void inner.offsetHeight;
        // Scroll when there are enough rows to warrant it OR whenever the content
        // actually overflows the panel - a handful of tall cards can spill past the
        // clip even below the row count, and those must scroll rather than clip.
        const overflows = inner.scrollHeight > el.clientHeight + 4;
        if (rows.length >= minForScroll || overflows) {
            const dur = Math.max(15, rows.length * 2.5);
            // preDelayMs holds the list static (people read the pinned headlines)
            // before the scroll begins; animationend then fires after delay + scroll.
            inner.style.animationDelay = (preDelayMs ? preDelayMs / 1000 : 0) + 's';
            inner.style.animationDuration = dur + 's';
            inner.classList.add('scrolling');
            ret = dur * 1000 + (preDelayMs || 0);
        } else {
            inner.style.animationDelay = '0s';
        }
    }
    void el.offsetHeight;   // commit opacity:0 (+ new content) so the fade-in animates
    el.style.opacity = '1';
    return ret;
}

function stripHcp(s) {
    return s.replace(/\s*\[\+?\d+(?:\.\d+)?\]/g, '').trim();
}

// Scoreboard Stories - track when each story first appeared for expiry
const _storyState = {}; // { 'player|title': { since: timestamp } }

function _shuffleArr(a) {
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// Build the rotating pool from the non-gold stories so tiers are evenly spread -
// never all the oranges or reds clumped together, even when one tier is far more
// common. Each tier's items are placed at even fractional positions across the
// whole pool (with a little jitter), then merged by that position. Shuffled each
// rebuild so the specific ordering varies.
function _buildMixedStoryPool(rest) {
    const buckets = {};
    for (const s of rest) (buckets[s.tier] = buckets[s.tier] || []).push(s);
    const tagged = [];
    for (const k of Object.keys(buckets)) {
        const arr = _shuffleArr(buckets[k]);
        const n = arr.length;
        arr.forEach((s, i) => tagged.push({ s, key: (i + 0.05 + Math.random() * 0.9) / n }));
    }
    tagged.sort((a, b) => a.key - b.key);
    return tagged.map(t => t.s);
}

function renderStories(stories, skipExpiry) {
    _lastStoriesData       = stories;
    _lastStoriesSkipExpiry = skipExpiry || false;
    const now = Date.now();
    _lastStoryRenderTime = now; // guard: track when stories were last rendered
    const EXPIRY_MS = 15 * 60 * 1000; // gold never expires; others expire after 15 min

    const currentKeys = new Set(stories.map(s => s.player + '|' + s.title));
    for (const k of Object.keys(_storyState)) {
        if (!currentKeys.has(k)) delete _storyState[k];
    }

    const visible = skipExpiry ? stories : stories.filter(s => {
        const key = s.player + '|' + s.title;
        if (!_storyState[key]) _storyState[key] = { since: now };
        if (s.tier === 'gold') return true;
        return (now - _storyState[key].since) < EXPIRY_MS;
    });

    // Pin gold (the headline stories) at the top - always read during the pause.
    // Below them, rotate a mixed-tier window so every scroll is fresh, tiers never
    // clump, and over successive scrolls everyone's name gets its turn.
    const gold = visible.filter(s => s.tier === 'gold');
    const rest = visible.filter(s => s.tier !== 'gold');
    const sig  = visible.map(s => s.player + '|' + s.title).sort().join('~');
    if (sig !== _storyPoolSig) {
        _storyMixedPool = _buildMixedStoryPool(rest);
        _storyPoolSig = sig;
    }
    const pool = _storyMixedPool;
    let windowRows;
    if (pool.length <= STORY_WINDOW) {
        windowRows = pool.slice();
    } else {
        windowRows = [];
        const start = _storyRotateOffset % pool.length;
        for (let i = 0; i < STORY_WINDOW; i++) windowRows.push(pool[(start + i) % pool.length]);
        _storyRotateOffset = (_storyRotateOffset + STORY_WINDOW) % pool.length;
    }
    const shown = gold.concat(windowRows);

    const TIER_CSS = { gold: 'story-name-gold', orange: 'story-name-orange', red: 'story-name-red', blue: 'story-name-blue' };

    const rows = shown.map(s => {
        const emoji = s.emoji || '';   // per-story emoji set in Python
        const css   = TIER_CSS[s.tier] || 'story-name-blue';
        const name  = esc(stripHcp(s.player));
        // Field-only stories (Hot Hole, weather) have no player score - omit the
        // right column entirely instead of showing "nullpts / thru null".
        const hasPts  = s.points !== null && s.points !== undefined;
        const thruTxt = (s.thru !== null && s.thru !== undefined) ? ('thru ' + s.thru) : '';
        const right = hasPts
            ? '<div class="story-right">' +
                  '<div class="story-pts">' + fmtScore(s.points) + (_isStableford ? 'pts' : '') + '</div>' +
                  (thruTxt ? '<div class="story-thru">' + thruTxt + '</div>' : '') +
              '</div>'
            : '';
        return '<div class="story-row">' +
            '<div class="story-left">' +
                '<div class="story-name ' + css + '">' + name + ' ' + emoji + '</div>' +
                '<div class="story-title">' + esc(s.title) + '</div>' +
                '<div class="story-detail">' + esc(s.detail) + '</div>' +
            '</div>' + right +
        '</div>';
    });
    _storyAnimDurMs = renderSidePanel('heater-list', rows, 'Watching the field...', 6, STORY_PAUSE_MS);
}

function _doRenderComingLast(comingLast, holeCount) {
    _lastComingLastArgs = { comingLast, holeCount };
    const hc = holeCount || 18;
    const rows = comingLast.map(p => {
        const fin = p.thru >= hc;
        const thruTxt = fin ? 'Finished' : 'thru ' + p.thru;
        const thruCls = fin ? 'last-thru fin' : 'last-thru';
        return '<div class="last-row">' +
            '<div class="last-left">' +
                '<div class="last-name">' + esc(p.player) + '</div>' +
                '<div class="' + thruCls + '">' + thruTxt + '</div>' +
            '</div>' +
            '<div class="last-pts">' + fmtScore(p.points) + (_isStableford ? 'pts' : '') + '</div>' +
        '</div>';
    });
    _comingLastAnimDurMs = renderSidePanel('last-list', rows, 'No data yet', 5);
}

// First-load call (not buffered)
function renderComingLast(comingLast, holeCount) {
    _doRenderComingLast(comingLast, holeCount);
}

// Apply buffered coming-last at the natural animationend point; fall back to last render when stopped
function _applyPendingComingLast() {
    if (_comingLastForceTimer) { clearTimeout(_comingLastForceTimer); _comingLastForceTimer = null; }
    const hasPending = _pendingComingLast !== null;
    const args = hasPending ? _pendingComingLast : (_refreshStopped ? _lastComingLastArgs : null);
    if (!args) return;
    if (hasPending) _pendingComingLast = null;
    _doRenderComingLast(args.comingLast, args.holeCount);
}

// Queue new coming-last; apply at next animationend (or force after 2 full cycles)
function queueComingLast(comingLast, holeCount) {
    _pendingComingLast = { comingLast, holeCount };
    if (_comingLastAnimDurMs > 0) {
        if (_comingLastForceTimer) clearTimeout(_comingLastForceTimer);
        _comingLastForceTimer = setTimeout(_applyPendingComingLast, Math.max(30000, _comingLastAnimDurMs * 2));
    } else if (!_comingLastForceTimer) {
        _comingLastForceTimer = setTimeout(_applyPendingComingLast, 5000);
    }
}

// ── Error ─────────────────────────────────────────────────────────
function onFetchError(msg) {
    setBadge('offline', 'Offline');
    setBlueBallVisible(null);
    const dot = document.getElementById('ftr-dot');
    if (dot) dot.className = 'ftr-dot down';
    const sta = document.getElementById('ftr-status');
    if (sta) sta.textContent = msg;
    if (!_hasData) {
        showNoData('lb-inner', '⛳', 'Waiting for live data',
            'Start the poller:\npython -m miscore.live --serve 8787\n\nThen open:\nleaderboard.html?lb=http://localhost:8787/', msg);
        showSideEmpty('heater-list', 'Watching the field...');
        showSideEmpty('last-list', 'Awaiting connection');
    }
}

// ── Helpers ───────────────────────────────────────────────────────
function setHeader(comp, meta) {
    const c = document.getElementById('hdr-comp');
    const m = document.getElementById('hdr-meta');
    if (c) c.textContent = comp;
    if (m) m.textContent = meta;
}

function setBadge(cls, label) {
    const b = document.getElementById('live-badge');
    if (b) { b.className = 'live-badge ' + cls; b.textContent = label; }
}

function setFooter(generatedAt, status) {
    const upd = document.getElementById('ftr-updated');
    const sta = document.getElementById('ftr-status');
    if (upd && generatedAt) {
        try {
            const t = new Date(generatedAt).toLocaleTimeString('en-AU', { timeZone: 'Australia/Sydney', hour: 'numeric', minute: '2-digit' });
            upd.textContent = 'Updated ' + t;
        } catch (_) { upd.textContent = 'Updated'; }
    }
    // Health dot: green when the feed is fresh, amber when it's gone quiet.
    const dot = document.getElementById('ftr-dot');
    if (dot && generatedAt) {
        const ageMin = (Date.now() - new Date(generatedAt).getTime()) / 60000;
        dot.className = 'ftr-dot ' + (ageMin < 5 ? 'fresh' : 'stale');
        dot.title = 'Data feed - ' + (ageMin < 1 ? 'just updated' : Math.round(ageMin) + ' min ago');
    }
    if (sta) sta.textContent = status || '';
}

function showNoData(id, icon, title, sub, err) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('scrolling');
    _animRunning = false;
    if (id === 'lb-inner') { const t = document.getElementById('lb-top3'); if (t) t.innerHTML = ''; }
    el.innerHTML =
        '<div class="no-data-msg">' +
            '<div class="no-data-icon">' + icon + '</div>' +
            '<div class="no-data-title">' + esc(title) + '</div>' +
            (sub ? '<div class="no-data-sub">' + esc(sub) + '</div>' : '') +
            (err ? '<div class="no-data-err">' + esc(err) + '</div>' : '') +
        '</div>';
}

function showSideEmpty(id, msg) {
    renderSidePanel(id, [], msg, 99);
}

function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Boot ──────────────────────────────────────────────────────────
updateClock();
setInterval(updateClock, 1000);
setInterval(tickCountdown, 1000);
fetchData();
</script>
