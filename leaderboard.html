<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWCC Live Golf Leaderboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%; overflow: hidden;
    background: #0a1628; color: #ecf0f1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 22px;
}

#root {
    display: flex; flex-direction: column;
    height: 100vh; padding: 16px 24px 12px; gap: 12px;
}

/* ── Header ──────────────────────────────────────────────────────── */
.hdr {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 20px;
    padding-bottom: 12px; border-bottom: 2px solid #27ae60;
    flex-shrink: 0;
}
.hdr-logo { height: 58px; width: auto; }
.hdr-center { text-align: center; }
.hdr-comp {
    font-size: 1.45em; font-weight: bold; letter-spacing: 3px;
    color: #ecf0f1; text-transform: uppercase; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hdr-meta { font-size: 0.78em; color: #7f8c8d; letter-spacing: 1px; margin-top: 4px; }
.hdr-right { text-align: right; flex-shrink: 0; }
.hdr-clock {
    font-size: 2.3em; font-weight: bold; color: #27ae60;
    line-height: 1; font-variant-numeric: tabular-nums;
}
.hdr-date { font-size: 0.8em; color: #bdc3c7; margin-top: 4px; }

/* ── Main layout ─────────────────────────────────────────────────── */
.main { flex: 1; display: flex; gap: 14px; min-height: 0; overflow: hidden; }

/* ── Leaderboard panel (left, ~65%) ──────────────────────────────── */
.lb-panel {
    flex: 3; display: flex; flex-direction: column; min-height: 0;
    background: #1e2f3e; border: 2px solid #4a6a84; border-top: 4px solid #27ae60;
    border-radius: 12px; overflow: hidden;
}

.panel-title-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,0.4); padding: 7px 16px; flex-shrink: 0;
}
.panel-title { font-size: 0.78em; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; color: #fff; }

.live-badge {
    font-size: 0.65em; font-weight: bold; letter-spacing: 2px;
    padding: 3px 9px; border-radius: 4px; text-transform: uppercase;
}
.live-badge.live    { background: #27ae60; color: #fff; animation: badge-pulse 2s ease-in-out infinite; }
.live-badge.waiting { background: #4a6a84; color: #bdc3c7; }
.live-badge.offline { background: #7d1a00; color: #fff; }
.live-badge.loading { background: #2c3e50; color: #7f8c8d; }
@keyframes badge-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

.col-hdr {
    display: grid;
    grid-template-columns: 3em 1fr 3em 3.5em 3.2em;
    gap: 6px; padding: 5px 16px;
    background: rgba(0,0,0,0.25); flex-shrink: 0;
    font-size: 0.68em; font-weight: bold; letter-spacing: 1.5px;
    text-transform: uppercase; color: #4a6a84;
    border-bottom: 1px solid #2a3f52;
}
.col-hdr-rank  { text-align: center; }
.col-hdr-name  { }
.col-hdr-hcp   { text-align: center; }
.col-hdr-pts   { text-align: right; }
.col-hdr-thru  { text-align: right; }

.lb-scroll-clip {
    flex: 1; overflow: hidden; position: relative;
    transition: opacity 0.25s ease;
}
.lb-scroll-inner { width: 100%; }

@keyframes lb-scroll {
    from { transform: translateY(0); }
    to   { transform: translateY(-50%); }
}
.lb-scroll-inner.scrolling { animation: lb-scroll linear infinite; }

.lb-row {
    display: grid;
    grid-template-columns: 3em 1fr 3em 3.5em 3.2em;
    gap: 6px; padding: 8px 16px;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.lb-row:nth-child(even) { background: rgba(255,255,255,0.03); }
.lb-row.top3 { background: rgba(39,174,96,0.07) !important; }

.r-rank { text-align: center; font-size: 0.88em; color: #4a6a84; font-weight: bold; line-height: 1; }
.r-rank.gold   { color: #f1c40f; font-size: 1em; }
.r-rank.silver { color: #bdc3c7; }
.r-rank.bronze { color: #cd7f32; }
.r-name  { font-size: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-hcp   { text-align: center; font-size: 0.78em; color: #7f8c8d; }
.r-pts   { text-align: right; font-size: 1.1em; font-weight: bold; color: #27ae60; }
.r-pts.dim { color: #4a6a84; }
.r-thru  { text-align: right; font-size: 0.8em; color: #7f8c8d; }
.r-thru.fin { color: #27ae60; font-weight: bold; font-size: 0.88em; }

/* ── Side panels (right, ~35%) ───────────────────────────────────── */
.side-panels {
    flex: 1.5; display: flex; flex-direction: column; gap: 12px; min-height: 0;
}

.side-card {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: #1e2f3e; border: 2px solid #4a6a84;
    border-radius: 12px; overflow: hidden;
}
.heater-card { border-top: 4px solid #e74c3c; }
.last-card   { border-top: 4px solid #f39c12; }

.side-title-bar {
    background: rgba(0,0,0,0.4); padding: 7px 14px; flex-shrink: 0;
    font-size: 0.78em; font-weight: bold; letter-spacing: 2.5px;
    text-transform: uppercase; color: #fff;
}

.side-list { flex: 1; overflow: hidden; padding: 8px 14px 6px; }

.heater-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.heater-row:last-child { border-bottom: none; }
.heater-name { font-size: 0.9em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.heater-note { font-size: 0.73em; color: #e74c3c; margin-top: 2px; }
.heater-right { text-align: right; flex-shrink: 0; padding-left: 8px; }
.heater-pts   { font-size: 0.95em; font-weight: bold; color: #27ae60; }
.heater-thru  { font-size: 0.68em; color: #7f8c8d; margin-top: 1px; }

.last-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.last-row:last-child { border-bottom: none; }
.last-left  { min-width: 0; }
.last-name  { font-size: 0.88em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.last-thru  { font-size: 0.68em; color: #7f8c8d; margin-top: 2px; }
.last-pts   { font-size: 0.95em; font-weight: bold; color: #f39c12; flex-shrink: 0; padding-left: 8px; }

.empty-note {
    color: #4a6a84; font-size: 0.8em; text-align: center;
    padding: 16px 0; font-style: italic;
}

/* ── Footer ──────────────────────────────────────────────────────── */
.ftr {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 8px; border-top: 1px solid #2a3f52; flex-shrink: 0;
    font-size: 0.72em; color: #7f8c8d;
}
.ftr-updated { color: #bdc3c7; }

/* ── No-data overlay ─────────────────────────────────────────────── */
.no-data-msg {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; text-align: center; padding: 32px;
    color: #4a6a84;
}
.no-data-icon { font-size: 2.4em; margin-bottom: 14px; }
.no-data-title { font-size: 1em; color: #ecf0f1; margin-bottom: 6px; font-weight: bold; }
.no-data-sub   { font-size: 0.75em; color: #7f8c8d; line-height: 1.5; }
.no-data-err   { font-size: 0.7em; color: #e74c3c; margin-top: 8px; }
</style>
</head>
<body>
<div id="root">

  <header class="hdr">
    <img class="hdr-logo"
         src="https://wwcc.com.au/cms/wp-content/themes/contemporary/assets/images/logo.png"
         alt="WWCC Logo"
         onerror="this.style.display='none'">
    <div class="hdr-center">
      <div class="hdr-comp" id="hdr-comp">⛳ Live Golf Leaderboard</div>
      <div class="hdr-meta" id="hdr-meta">Wagga Wagga Country Club</div>
    </div>
    <div class="hdr-right">
      <div class="hdr-clock" id="clock">--:-- --</div>
      <div class="hdr-date"  id="date-str">---</div>
    </div>
  </header>

  <main class="main">

    <!-- Leaderboard panel -->
    <section class="lb-panel">
      <div class="panel-title-bar">
        <span class="panel-title">Leaderboard</span>
        <span class="live-badge loading" id="live-badge">Loading</span>
      </div>
      <div class="col-hdr">
        <span class="col-hdr-rank">#</span>
        <span class="col-hdr-name">Player</span>
        <span class="col-hdr-hcp">HCP</span>
        <span class="col-hdr-pts">Pts</span>
        <span class="col-hdr-thru">Thru</span>
      </div>
      <div class="lb-scroll-clip" id="lb-clip">
        <div class="lb-scroll-inner" id="lb-inner">
          <div class="no-data-msg">
            <div class="no-data-icon">⛳</div>
            <div class="no-data-title">Loading leaderboard...</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Side panels -->
    <aside class="side-panels">

      <div class="side-card heater-card">
        <div class="side-title-bar">🔥 On a Heater</div>
        <div class="side-list" id="heater-list">
          <div class="no-data-msg">
            <div class="no-data-sub">Waiting for data...</div>
          </div>
        </div>
      </div>

      <div class="side-card last-card">
        <div class="side-title-bar">🐢 Coming Last</div>
        <div class="side-list" id="last-list">
          <div class="no-data-msg">
            <div class="no-data-sub">Waiting for data...</div>
          </div>
        </div>
      </div>

    </aside>
  </main>

  <footer class="ftr">
    <span class="ftr-updated" id="ftr-updated">Not yet loaded</span>
    <span id="ftr-status"></span>
    <span id="ftr-countdown">Fetching data...</span>
  </footer>

</div>
<script>
// Config: pass ?lb=http://192.168.x.x:8787/ to read from live.py --serve port
// Default reads from ./out/live-leaderboard.json (run a local web server alongside live.py)
const LB_URL      = new URLSearchParams(location.search).get('lb') || './out/live-leaderboard.json';
const REFRESH_SEC = 60;

let _countdown = REFRESH_SEC;
let _lastData  = null;
let _hasData   = false;

// ── Clock ─────────────────────────────────────────────────────────
function updateClock() {
    const syd = { timeZone: 'Australia/Sydney' };
    const clk = document.getElementById('clock');
    const dat = document.getElementById('date-str');
    if (clk) clk.textContent = new Date().toLocaleTimeString('en-AU', { ...syd, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
    if (dat) dat.textContent = new Date().toLocaleDateString('en-AU', { ...syd, weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
}

// ── Countdown + auto-refresh ──────────────────────────────────────
function tickCountdown() {
    _countdown--;
    const el = document.getElementById('ftr-countdown');
    if (_countdown <= 0) {
        _countdown = REFRESH_SEC;
        if (el) el.textContent = 'Refreshing...';
        fetchData();
    } else {
        if (el) el.textContent = 'Next refresh in ' + _countdown + 's';
    }
}

// ── Data fetch ────────────────────────────────────────────────────
async function fetchData() {
    try {
        const res = await fetch(LB_URL + (LB_URL.includes('?') ? '&' : '?') + '_t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        _lastData = data;
        _hasData  = true;
        render(data);
    } catch (e) {
        onFetchError(e.message);
    }
}

// ── Render ────────────────────────────────────────────────────────
function render(d) {
    if (d.status === 'no board') {
        setBadge('waiting', 'No comp today');
        setHeader('⛳ Live Golf Leaderboard', 'Wagga Wagga Country Club - no competition found for today');
        showNoData('lb-inner', '📋', 'No competition today', 'The poller found no active leaderboard.');
        showSideEmpty('heater-list', '-');
        showSideEmpty('last-list', '-');
        setFooter(d.generatedAt, '');
        return;
    }
    if (d.status === 'error') {
        setBadge('offline', 'Poller error');
        setFooter(d.generatedAt, d.error || 'Unknown error');
        return;
    }

    const holeCount = d.holeCount || 9;
    const players   = d.players || [];
    const started   = d.started || false;

    // Header
    const meta = ['Wagga Wagga Country Club'];
    if (d.type) meta.push(d.type);
    if (holeCount) meta.push(holeCount + ' holes');
    if (d.par)     meta.push('Par ' + d.par);
    if (players.length) meta.push(players.length + ' players');
    setHeader('⛳ ' + (d.competition || 'Live Golf Leaderboard'), meta.join(' - '));

    // Badge
    if (!started) {
        setBadge('waiting', 'Not started');
    } else {
        setBadge('live', 'Live');
    }

    // Footer
    setFooter(d.generatedAt, started ? '' : 'Competition starting soon');

    // Leaderboard
    renderLeaderboard(players, holeCount, started);

    // Side panels
    renderHeaters(d.heaters || []);
    renderComingLast(d.comingLast || []);
}

function renderLeaderboard(players, holeCount, started) {
    const clip  = document.getElementById('lb-clip');
    const inner = document.getElementById('lb-inner');
    if (!inner) return;

    if (!players.length) {
        inner.innerHTML = '<div class="no-data-msg"><div class="no-data-icon">📋</div><div class="no-data-title">No players found</div></div>';
        return;
    }

    const rowsHtml = players.map((p) => {
        const rank = p.liveRank || 0;
        let rankHtml, rankCls = 'r-rank';
        if      (rank === 1) { rankHtml = '🥇'; rankCls += ' gold'; }
        else if (rank === 2) { rankHtml = '🥈'; rankCls += ' silver'; }
        else if (rank === 3) { rankHtml = '🥉'; rankCls += ' bronze'; }
        else                   rankHtml = rank;

        const thruTxt = p.thru === 0 ? '-' : p.thru >= holeCount ? 'F' : p.thru;
        const thruCls = p.thru >= holeCount ? 'r-thru fin' : 'r-thru';
        const ptsTxt  = (p.thru > 0 && started) ? p.points : '-';
        const ptsCls  = (p.thru > 0 && started) ? 'r-pts' : 'r-pts dim';
        const rowCls  = rank <= 3 ? 'lb-row top3' : 'lb-row';
        const hcpTxt  = p.hcp != null ? p.hcp : '';

        return `<div class="${rowCls}">` +
            `<span class="${rankCls}">${rankHtml}</span>` +
            `<span class="r-name">${esc(p.player)}</span>` +
            `<span class="r-hcp">${hcpTxt}</span>` +
            `<span class="${ptsCls}">${ptsTxt}</span>` +
            `<span class="${thruCls}">${thruTxt}</span>` +
            `</div>`;
    }).join('');

    // Fade out, rebuild, restart animation, fade in
    if (clip) clip.style.opacity = '0';
    setTimeout(() => {
        inner.classList.remove('scrolling');
        inner.innerHTML = rowsHtml + rowsHtml; // duplicate for seamless loop
        void inner.offsetHeight; // force reflow to restart animation
        const dur = Math.max(90, players.length * 0.8);
        inner.style.animationDuration = dur + 's';
        inner.classList.add('scrolling');
        if (clip) clip.style.opacity = '1';
    }, 250);
}

function renderHeaters(heaters) {
    const el = document.getElementById('heater-list');
    if (!el) return;
    if (!heaters.length) {
        el.innerHTML = '<div class="no-data-msg"><div class="no-data-sub">No hot streaks yet</div></div>';
        return;
    }
    el.innerHTML = heaters.slice(0, 8).map(h =>
        `<div class="heater-row">` +
            `<div style="min-width:0">` +
                `<div class="heater-name">${esc(h.player)}</div>` +
                `<div class="heater-note">🔥 ${esc(h.note)}</div>` +
            `</div>` +
            `<div class="heater-right">` +
                `<div class="heater-pts">${h.points}pts</div>` +
                `<div class="heater-thru">thru ${h.thru}</div>` +
            `</div>` +
        `</div>`
    ).join('');
}

function renderComingLast(comingLast) {
    const el = document.getElementById('last-list');
    if (!el) return;
    if (!comingLast.length) {
        el.innerHTML = '<div class="no-data-msg"><div class="no-data-sub">No data yet</div></div>';
        return;
    }
    el.innerHTML = comingLast.map(p =>
        `<div class="last-row">` +
            `<div class="last-left">` +
                `<div class="last-name">${esc(p.player)}</div>` +
                `<div class="last-thru">thru ${p.thru}</div>` +
            `</div>` +
            `<div class="last-pts">${p.points}pts</div>` +
        `</div>`
    ).join('');
}

// ── Error state ───────────────────────────────────────────────────
function onFetchError(msg) {
    setBadge('offline', 'Offline');
    const statusEl = document.getElementById('ftr-status');
    if (statusEl) statusEl.textContent = msg;
    if (!_hasData) {
        showNoData('lb-inner', '⛳', 'Waiting for live data',
            'Start the poller: python -m miscore.live --serve 8787\n' +
            'Then open this page with: ?lb=http://localhost:8787/', msg);
        showSideEmpty('heater-list', 'Awaiting connection');
        showSideEmpty('last-list', 'Awaiting connection');
    }
}

// ── Helpers ───────────────────────────────────────────────────────
function setHeader(comp, meta) {
    const c = document.getElementById('hdr-comp');
    const m = document.getElementById('hdr-meta');
    if (c) c.textContent = comp;
    if (m) m.textContent = meta;
}

function setBadge(cls, label) {
    const b = document.getElementById('live-badge');
    if (b) { b.className = 'live-badge ' + cls; b.textContent = label; }
}

function setFooter(generatedAt, status) {
    const upd = document.getElementById('ftr-updated');
    const sta = document.getElementById('ftr-status');
    if (upd && generatedAt) {
        try {
            const t = new Date(generatedAt).toLocaleTimeString('en-AU', { timeZone: 'Australia/Sydney', hour: 'numeric', minute: '2-digit' });
            upd.textContent = 'Updated ' + t;
        } catch (_) { upd.textContent = 'Updated'; }
    }
    if (sta) sta.textContent = status || '';
}

function showNoData(id, icon, title, sub, err) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('scrolling');
    el.innerHTML =
        `<div class="no-data-msg">` +
            `<div class="no-data-icon">${icon}</div>` +
            `<div class="no-data-title">${esc(title)}</div>` +
            (sub  ? `<div class="no-data-sub">${esc(sub)}</div>` : '') +
            (err  ? `<div class="no-data-err">${esc(err)}</div>` : '') +
        `</div>`;
}

function showSideEmpty(id, msg) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = `<div class="no-data-msg"><div class="no-data-sub">${esc(msg)}</div></div>`;
}

function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Boot ──────────────────────────────────────────────────────────
updateClock();
setInterval(updateClock, 1000);
setInterval(tickCountdown, 1000);
fetchData();
</script>
</body>
</html>
